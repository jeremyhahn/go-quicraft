version: "2"

run:
  # Keep in lockstep with the `go` directive in go.mod and with GO_VERSION in
  # .github/workflows/ci.yml. A stale value here silently changes which
  # language-version-dependent diagnostics staticcheck emits.
  go: "1.26.6"
  timeout: 5m
  # Test files ARE linted. This was false, which in a repository with ~265k
  # lines of test code meant the linters examined a minority of the tree — and
  # test code is where this project's defects have most often hidden (a mock
  # that manufactured impossible states, tests that passed against unfixed
  # code). The per-linter exclusions under `exclusions.rules` below already
  # relax the checks that are genuinely noisy in tests (errcheck on deferred
  # Close, gocritic style, gocyclo on table-driven tests); everything else now
  # applies to _test.go as it does to production code.
  tests: true

linters:
  enable:
    # Core linters
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocyclo
    - gocritic
    - revive
    - nolintlint
    # Security-focused linters
    - bodyclose        # HTTP response body close
    - nilerr           # Returns nil even when checking error
    - noctx            # HTTP requests without context
    - reassign         # Reassigning top-level variables
    - usestdlibvars    # Use stdlib constants instead of literals
    - durationcheck    # Duration multiplication mistakes
    - copyloopvar      # Loop variable capture in closures (replaces exportloopref)
    - makezero         # Slice make with non-zero length then append
    - unconvert        # Unnecessary type conversions
    - unparam          # Unused function parameters
    - wastedassign     # Wasted assignments

  exclusions:
    rules:
      # Relaxed in tests because the diagnostic is about production hygiene,
      # not correctness: a deferred Close whose error nobody reads (errcheck),
      # style preferences (gocritic), and long table-driven test functions
      # (gocyclo) are all normal and intended in _test.go.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - gocyclo
      # Added when `run.tests` was turned on. Both fire almost exclusively on
      # stub and mock implementations of production interfaces, where the
      # parameter exists to satisfy the signature and its NAME is the
      # documentation — renaming 48 of them to `_` would make the fakes harder
      # to read, not safer. Same category as the three above: hygiene, not
      # correctness. Every other linter now applies to test files.
      #
      # This is a strictly smaller exclusion than the `tests: false` it
      # replaces, which suppressed all 20 linters across all ~265k lines of
      # test code.
      - path: _test\.go
        linters:
          - unparam
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter"
      - path: mock_
        linters:
          - unused
          - revive
      - path: pkg/crypto/
        linters:
          - revive
        text: "avoid package names"

  settings:
    gocyclo:
      # Targeted nolint:gocyclo directives are used on justified high-complexity
      # functions (StartShard, saveSnapshot, processCommitPendingInbox).
      min-complexity: 25
    lll:
      line-length: 120
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Opinionated checks that require extensive refactoring
        - hugeParam          # Would require changing many API signatures
        - rangeValCopy       # Would require significant changes to loops
        - sloppyReassign     # Minor stylistic preference
        - badLock            # Intentional pattern for lock barriers
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
        - name: unused-parameter
        - name: unreachable-code
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: var-naming
          disabled: true
