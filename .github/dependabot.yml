version: 2

# Dependabot covers the root library, the dragonboat adapter and the benchmark modules; make deps-check covers the rest.
updates:
  # --- Go modules ---
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/contrib/dragonboat"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/test/performance"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/test/performance/quicraft"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/test/performance/dragonboat"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/test/performance/etcd"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  # --- Rust (openraft benchmark) ---
  - package-ecosystem: cargo
    directory: "/test/performance/openraft"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns: ["*"]

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # --- Docker base images (dev + benchmark containers) ---
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/test/performance/quicraft"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/test/performance/dragonboat"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/test/performance/etcd"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/test/performance/openraft"
    schedule:
      interval: weekly
