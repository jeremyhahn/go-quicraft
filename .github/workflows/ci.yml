#
# v1.3 (2026-08-14): `workflow_dispatch:` trigger added, so a phantom failure
# (runner crash, host overload; see infra lessons.md) can be retried without
# pushing an empty commit.
#
#   CORRECTION (2026-08-19): this entry originally claimed "Gitea's build
#   exposes no rerun API, so without it the only way to retry a phantom
#   failure is an empty commit." That premise is FALSE and it propagated to
#   five repos. `swagger.v1.json` on 1.27.1 publishes three re-run routes:
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun-failed-jobs
#     /repos/{owner}/{repo}/actions/runs/{run}/jobs/{job_id}/rerun
#   `rerun-failed-jobs` re-runs only a run's failed jobs. Note the job-level
#   route is NESTED under the run — the flat `jobs/{id}/rerun` shape does not
#   exist, and probing that shape is how two of us concluded the API was
#   missing. A 404 does not distinguish a missing route from a missing
#   resource; swagger is the authority.
#
#   Stated precisely, because the mistake is easy to make in reverse: these
#   routes are PUBLISHED IN THE SPEC — verified. They have NOT yet been
#   executed here, so do not upgrade this to "rerun works" until someone has
#   actually run one. What IS measured: there is no `cancel` route at any
#   path, and DELETE returns 400 "this workflow run is not done" on anything
#   unfinished, so no REST call can shed a queued run (task #90).
#
#   `workflow_dispatch` KEEPS its place regardless, on an independent
#   justification: re-run acts on an existing run, so it cannot help when a
#   run was never created — the lazy-creation case where a fresh head shows
#   no jobs for minutes. Removing the trigger because re-run exists would be
#   an overcorrection.
#
# v1.2 (2026-08-14): actions/checkout and actions/setup-go moved to @v6 —
# §9 already named checkout@v6 the standard and repos were shipping green on
# v6/v6 while this file still said v4/v5 (same defect class as promising a
# gate the template doesn't implement: the standard and the template must
# never disagree).
#
# v1.1 (2026-08-14): gosec findings now also print to the job log (the SARIF
# upload only exists on github.com, so on Gitea the findings were invisible).
# Also NEVER add `GOPROXY: direct` / `GOSUMDB: off` to a repo's env block:
# GOPRIVATE (injected by the runners, dependency-resolution.md §6) already
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency
# and breaks the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). `ghcr.io` likewise does not exist on Gitea — use the Gitea
# registry (lessons.md).
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

# >>> CUSTOMIZE (go-quicraft)
# go-quicraft runs the v1.24 tiers. The pr tier (preflight, image)
# runs on every event. The full tier (integration, netfault, errfs, zero-rtt,
# cross-arch, modules, contrib-dragonboat, fips) runs on push to main,
# nightly, on workflow_dispatch and on a PR labelled ci:full; its jobs carry
# CI_FULL_TIER's expression as `if:`. Soak and fuzz-seeds are nightly: the
# schedule and workflow_dispatch only (m751 (e)). A docs-only PR still runs
# the releasability scan of the tracked tree (the image job's CUSTOMIZE step
# after make coverage), since its markdown is what that scan reads. go-quicraft has no separate race
# job: the image job's `make coverage` is the race run. Every job runs its commands in the
# devcontainer images built at this commit: the five stages are steps of the
# image job, and each CUSTOMIZE job builds the toolchain image and runs one
# make target in it, as the integration job does. The heavy QUIC suites are
# serialised (integration after image; soak, netfault, contrib-dragonboat and
# fips after integration): overlapping multi-node clusters under -race starve each
# other and expire the 30s snapshot and rolling-restart waits.
# v1.29: the Dockerfile's GO_IMAGE ARG has no default (the pin lives in
# scripts/tool-pins.sh), so apk-index-sum.sh cannot read its FROM lines; every
# "Read the Alpine package index" step sources the pin file and passes the base
# image as APK_BASE_IMAGES. No CUSTOMIZE job is path-gated, so the v1.29.2
# `if:` note has nothing to change here.
# <<< CUSTOMIZE
name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk. automerge.yml's merge trains are
    # PRs from merge-train/* and get CI from pull_request (v1.15).
    branches: [main]
  pull_request:
    branches: [main]
    # >>> CUSTOMIZE (go-quicraft)
    # Gitea fires label_updated, not labeled; synchronize re-runs on a push.
    # Adding ci:full takes effect on the next push or a workflow_dispatch.
    # ready_for_review: a draft marked ready gets a run of the jobs that skip
    # drafts, without a new push.
    types: [opened, synchronize, reopened, ready_for_review]
    # <<< CUSTOMIZE
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created (see v1.3 correction above)
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. CUSTOMIZE: the hour, off nightly.yml's.
  # v1.29.3: one schedule run per repository (the concurrency group below),
  # and its bigdisk jobs skip while a main push run is in flight (the
  # preflight job's schedule guard).
  # m1919 rotation (#619): one project per night until the R640s return;
  # go-quicraft's night is Wednesday, so the run fires 05:00 UTC Thursday.
  schedule:
    - cron: '0 5 * * 4'

# v1.53: on main the group is the workflow and the event,
# `main-{event}`, so a newer main run cancels the older one. Before v1.53:
# v1.26.2: on main the group is the workflow, the event and the commit sha,
# so each main run is its own group and a merge never cancels the main run in
# progress; a schedule or workflow_dispatch run is in its own event's group
# and never shares one with a push run (Tenant Agent m1167 (5), ruling 145,
# superseding v1.25's `main-{event}` group, m857 and m774 option (i)). Every
# other ref is one group, so a PR's newer run cancels the older. No
# expression reaches cancel-in-progress: Gitea 1.27.1 never released go-qrdb
# main run 57063, the first run after v1.22.1 set it to an expression
# (Tenant Agent m695).
# v1.29.3 (ruling 255(10)/(11)(c)): a schedule run's group is
# `schedule-{repository}`, with no sha, so a repository has one schedule run
# at a time. It is tested first, so a schedule run never takes a main group.
# The push, pull_request and workflow_dispatch groups do not change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}', github.event_name) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Leave EMPTY if no package is tag-gated. Every analysis step
  # below derives its own form from this ONE value; never write the tag list
  # twice. A tag-gated package that is not named here is analysed by NOTHING
  # while the gate still reports green (one repository had eight
  # such packages, including its whole WebAuthn implementation).
  GO_BUILD_TAGS: ""
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch), and a PR labelled ci:full.
  # LOCAL: v1.41's every-PR full tier is not taken (test/buildgates
  # ci_gate_test.go holds this condition), so the v1.35.1 form stays.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  # v1.30 (fix 5): a workflow_dispatch off main is not the full tier (the
  # schedule guard refuses it and CI Gate fails).
  CI_FULL_TIER: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24 (Tenant Agent m749, m751 (a)): the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.30 (fix 3): a PR runs the lint-gates job only when a changed file
  # matches this extended regex. CUSTOMIZE: narrow it to what the repository's
  # lint-gates read (scripts, workflows, generated code, go.mod). The default
  # matches every file, so lint-gates runs on every PR.
  LINT_GATES_PATTERN: '.'
  # v1.26.1 (Tenant Agent m1128 (9)): the repository's releasability test, which
  # a docs-only PR still runs because make coverage skips on it. CUSTOMIZE: the
  # `go test` arguments, package and -run pattern (for example
  # `./pkg/labstrings -run '^TestTheTrackedTreeIsPubliclyReleasable$'`).
  # Empty means the repository has none.
  RELEASABILITY_TEST: "./test/releasability/..."   # CUSTOMIZE (go-quicraft): the package make coverage runs it in
  # #621 (Company Agent m1923 (e)): every stage sidecar gets 8g
  # (scripts/in-toolchain-image.sh), on every server. A hosted runner has
  # 16 GB, so one 8g sidecar per job fits with room for the runner; the
  # integration stack keeps its own 8g cap (devcontainer compose.yaml
  # mem_limit and memswap_limit).
  IN_IMAGE_MEMORY: 8g
  # CUSTOMIZE: the number of `unit` shards; the unit job's matrix lists
  # 0..UNIT_SHARDS-1. `make coverage-shard` deals packages by test-file size.
  UNIT_SHARDS: 4
  # The per-package -timeout of the -race unit run. Go's default (10m) is
  # sized for a large runner; a 4-core hosted runner is slower.
  COVER_TIMEOUT: 30m
  # CUSTOMIZE: the number of integration shards; the integration job's matrix
  # lists 0..IT_SHARDS-1 (`make it-shard-packages`).
  IT_SHARDS: 2

jobs:
  # v1.34: one preflight job instead of three.
  # `Changed files`, `Schedule guard` and `Architecture Gates` were three jobs,
  # each a hosted runner of its own on every run, in a saturated hosted queue.
  # They are steps of this one job now, in this order: the schedule guard
  # first, before anything is checked out, so AGENT_TOKEN (a schedule run and
  # a push to main only) still reaches a step beside no repository code; then
  # one checkout with persist-credentials false; then the changed-files step;
  # then the architecture gates. The four outputs are the same, read as
  # needs.preflight.outputs.*. A repository adopts v1.34 in one CI-file PR:
  # its CUSTOMIZE jobs read needs.preflight where they read the changed-files
  # or schedule-guard job, its own architecture steps move into this job, and
  # CI Gate checks `preflight` in place of the three. The comments of the
  # three former jobs follow.
  # v1.24: a PR whose every changed file matches DOCS_ONLY_PATTERN
  # runs lint only; build and make coverage are skipped. Off pull_request, or
  # on a ci:full PR, docs_only is always false. Any doubt (a failed diff, an
  # empty list) reads as false, so the tier fails toward running the tests.
  # v1.29.3: one nightly per
  # repository, and none while main is busy. On a schedule run only, this job
  # asks the API whether this workflow has a push run on main in progress or
  # waiting, and sets `verdict`: `run` (none, or not a schedule run), `busy`
  # (one is) or `unreadable` (no count came back). On a schedule run every
  # bigdisk job runs only on `run`; CI Gate skips on `busy` and fails on
  # `unreadable`. The job runs on every event, not on schedule alone, so no
  # bigdisk job's `needs` meets a skipped job off schedule; off schedule it
  # makes no call. It checks nothing out, so no repository code runs beside
  # the tokens.
  # v1.30 (fixes 2, 3 and 5): two more verdicts. `refused`: a
  # workflow_dispatch off main (no full tier on a PR branch, ever) or a pull
  # request from a checkpoint branch (lane-ckpt/*); every job but the gate
  # skips and CI Gate fails. `proven`: on a push to main, the newest of this
  # workflow's last 20 successful runs whose head commit has this commit's tree
  # and whose Integration job succeeded (a ci:full PR run, a dispatch on main,
  # an earlier main run); the guard records its id as `proof`, every bigdisk
  # job skips and CI Gate reads the skips as passed. A proof it cannot read
  # leaves `run`: the full tier runs. A schedule run never gets `proven`,
  # because its security stages read fresh vulnerability databases.
  # Architecture gate (v1.20; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  preflight:
    name: Preflight [changed files, schedule guard, architecture gates]
    # v1.49: on github.com the self-hosted bigdisk pool, so no run waits in
    # the hosted queue for its first ten seconds of work; the repository
    # variable CI_PREFLIGHT_RUNS_ON, runs-on JSON, overrides it (set to
    # `"ubuntu-latest"`, quotes included, while that pool is down). Off
    # github.com ubuntu-latest, as before.
    # LOCAL (security): a pull request from a fork runs untrusted code, so
    # it always gets ubuntu-latest and never the self-hosted pool, whatever
    # the variable says; only pushes, schedules, dispatches and same-repository
    # pull requests take the pool.
    # v1.52: a pull request from a fork (its head repository is not this
    # one) takes ubuntu-latest whatever the variable holds; a fork never
    # reaches a self-hosted runner.
    runs-on: ${{ github.server_url == 'https://github.com' && (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_PREFLIGHT_RUNS_ON || '["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}   # v1.52
    # v1.26: a draft PR runs no CI; every job that needs this one skips with it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10       # v1.34: the three jobs had 5 each
    permissions:
      actions: read
      contents: read
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      lint_gates: ${{ steps.diff.outputs.lint_gates }}   # v1.30
      verdict: ${{ steps.guard.outputs.verdict }}
      proof: ${{ steps.guard.outputs.proof }}   # v1.30
    steps:
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          # v1.30: a push to main reads the tree proof with it as well.
          # v1.49: off github.com only. On github.com the guard never reads it
          # (no schedule check, no tree proof there), so the secret does not
          # reach the step on the self-hosted runner.
          BOT: ${{ github.server_url != 'https://github.com' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          runs() {
            local st n
            N=0
            # v1.29.4: waiting is read before in_progress. A run only moves
            # waiting, then in_progress, then done, so one waiting at the
            # first query is still waiting, in progress or done at the
            # second, and counted or finished. The other order lets a run
            # start between the two queries and be counted by neither.
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          # get <token> <url> <file>: 0 on a 200 reply, saved in <file>.
          get() {
            [ "$(curl -sS --max-time 30 -o "$3" -w '%{http_code}' \
              -H @<(printf 'Authorization: token %s\n' "$1") "$2")" = 200 ]
          }
          # v1.30: proof <token>: sets PROOF to the id of the newest of this
          # workflow's last 20 successful runs whose head commit has this
          # commit's tree and whose Integration jobs all succeeded (at least
          # one). It returns 1 when a reply is not 200, and 0 with PROOF
          # empty when no run proves the tree.
          proof() {
            local tree id sha t
            PROOF=
            get "$1" "$REPO_API/git/commits/$SHA" "$RUNNER_TEMP/c.json" || return 1
            tree=$(jq -er '.commit.tree.sha' "$RUNNER_TEMP/c.json") || return 1
            get "$1" "$RUNS_API?status=success&limit=20" "$RUNNER_TEMP/ok.json" || return 1
            while read -r id sha; do
              get "$1" "$REPO_API/git/commits/$sha" "$RUNNER_TEMP/c.json" || continue
              t=$(jq -r '.commit.tree.sha' "$RUNNER_TEMP/c.json")
              [ "$t" = "$tree" ] || continue
              get "$1" "$REPO_API/actions/runs/$id/jobs?limit=100" "$RUNNER_TEMP/j.json" || continue
              if jq -e '[.jobs[] | select(.name | startswith("Integration"))] | length > 0 and all(.conclusion == "success")' \
                   "$RUNNER_TEMP/j.json" >/dev/null; then
                PROOF=$id
                echo "tree $tree: run $id (head $sha) has a green full tier"
                return 0
              fi
            done < <(jq -r '.workflow_runs[]? | "\(.id) \(.head_sha)"' "$RUNNER_TEMP/ok.json")
            echo "tree $tree: no green full-tier run among the last 20 successful runs"
          }
          verdict=run N=0 PROOF=
          # v1.30 (fixes 3 and 5): the refusals come first.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/ci/deps-bump ]; then
            verdict=refused
            echo "::error::workflow_dispatch on $REF: the full tier runs on main only, never on a PR branch (ci-template v1.30); every job skips and CI Gate fails"
          elif [ "$EVENT" = pull_request ] && [ "${HEAD_REF#lane-ckpt/}" != "$HEAD_REF" ]; then
            verdict=refused
            echo "::error::a pull request from checkpoint branch $HEAD_REF: a checkpoint branch never opens a PR (ci-template v1.30); every job skips and CI Gate fails"
          fi
          if [ "$verdict" != run ]; then
            :
          elif [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "the github.com mirror has no bigdisk runner: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every bigdisk job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its bigdisk jobs, and CI Gate posts skipped"
          fi
          # v1.30 (fix 2): the tree proof, on a push to main on the forge only.
          if [ "$verdict" = run ] && [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$SERVER" != https://github.com ]; then
            if { [ -n "$JOB_TOKEN" ] && proof "$JOB_TOKEN"; } || { [ -n "$BOT" ] && proof "$BOT"; }; then
              if [ -n "$PROOF" ]; then
                verdict=proven
                echo "::notice::this tree already has a green full tier in run $PROOF: the bigdisk jobs skip, and CI Gate passes on it"
              fi
            else
              echo "::warning::the tree proof could not be read: the full tier runs"
            fi
          fi
          echo "verdict: $verdict${PROOF:+ (proof: run $PROOF)}"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"

      # v1.34: the full history on a PR run for the changed-files diff, one
      # commit otherwise. v1.41: every PR run, ci:full or not. No credential is left in the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      # v1.38: a job that names the
      # `release` label runs only on a push to refs/heads/main or a tag, or a
      # workflow_dispatch on main, and never for a pull request. This step
      # reads every .github/workflows/*.yml and *.yaml of the repository as
      # text, takes each job whose runs-on names `release` (plain, in a list,
      # or as a quoted string inside an expression), and evaluates its `if:`
      # under every other event: a pull_request or pull_request_target event
      # in a workflow that has that trigger (a), and the push of another
      # branch, a dispatch off main or on a tag, schedule, workflow_run,
      # merge_group, release, create, issue_comment and repository_dispatch
      # (b). A value it cannot know (vars, needs, secrets, the server) may
      # hold anything, so the `if:` must be false whatever it holds; an `if:`
      # it cannot read fails. It prints each file:job and the reason. A lint,
      # not the gate: the runner side refuses such a job as well.
      # v1.43: on github.com every other job runs on a standard
      # GitHub-hosted image on every event (c), or its runs-on line says why
      # it cannot, `# self-hosted: <reason>`; a larger runner is refused (d).
      # v1.46: the reason names its category, hardware: or
      # oversize: (credential: for the one Codex review job); a reason with
      # no category is (e).
      # v1.47: label and category are checked together. The
      # review-only labels codex and qwen run only in code-review.yml, codex
      # with credential: and qwen with hardware:, and credential: is only for
      # codex; a waiver does not lift it (f).
      # v1.48: in ci.yml, a runs-on that reads
      # needs.preflight.outputs.runner or runner_docker is checked with the
      # output at its default ("ubuntu-latest", which must give a standard
      # image) and at its overflow, where exactly
      # [self-hosted, linux, x64, bigdisk] or [..., bigdisk-docker] passes too.
      # v1.49: the preflight job's own runs-on, which reads
      # vars.CI_PREFLIGHT_RUNS_ON, is checked with the variable unset, where
      # exactly [self-hosted, linux, x64, bigdisk] passes too, and set to
      # `"ubuntu-latest"`, where it must give a standard image.
      # v1.52: a fork's head under pull_request, as under
      # pull_request_target (v1.51), gets no unset-variable exemption, and the
      # selection outputs read for it are the hosted default the step emits.
      # Its tests: test/buildgates/testdata/runner-labels-tests.py (the lint-gates job runs them).
      - name: Runner labels
        run: |
          python3 -I - <<'PY'
          import glob, json, re, sys

          # Reads .github/workflows/*.yml|yaml as text (no YAML library): the
          # top-level `on:` keys, and each job's `runs-on` and `if`. A job names
          # `release` when that label appears in its runs-on, plain, in a list or as a
          # quoted string in an expression. Its `if` is evaluated under every event
          # outside the release allow-list, with every value this step cannot know
          # (vars, needs, secrets, server_url, ...) unknown; the job passes only when
          # the `if` is false in each of them whatever the unknowns hold.
          U = object()  # unknown value
          OPEN = "$" "{{"  # split, so the runner does not read it as an expression
          ALLOWED = "push to refs/heads/main or refs/tags/*, or workflow_dispatch on main"
          PR = {"pull_request", "pull_request_target"}
          OTHER_EV = "another event"  # stands for every event CTX does not name
          CTX = [  # (event, ref) pairs a release job must never run on
              ("pull_request", "refs/pull/1/merge"), ("pull_request_target", "refs/heads/main"),
              ("pull_request_target", "refs/heads/feature"),
              ("push", "refs/heads/feature"), ("workflow_dispatch", "refs/heads/feature"),
              ("workflow_dispatch", "refs/tags/v1.0.0"), ("schedule", "refs/heads/main"),
              ("workflow_run", "refs/heads/main"), ("merge_group", "refs/heads/gh-readonly-queue/main/pr-1"),
              ("release", "refs/tags/v1.0.0"), ("create", "refs/tags/v1.0.0"), ("create", "refs/heads/feature"),
              ("issue_comment", "refs/heads/main"), ("repository_dispatch", "refs/heads/main"),
              (OTHER_EV, "refs/heads/main"), (OTHER_EV, "refs/heads/feature"), (OTHER_EV, "refs/tags/v1.0.0"),
          ]
          EVENTS = {ev for ev, _ in CTX if ev != OTHER_EV}


          # LOCAL (security): a sampled ref, ref name or event other than main and a named event stands for a class; a literal decides it only when the whole class agrees, else unknown
          class Cls:
              def __init__(self, prefix, never=()):
                  self.prefix, self.never = prefix, {n.lower() for n in never}

              def eq(self, lit):
                  l = lit.lower()
                  return False if not l.startswith(self.prefix) or l in self.never else U

              def starts(self, lit):
                  l = lit.lower()
                  if self.prefix.startswith(l):
                      return True
                  return U if l.startswith(self.prefix) else False


          def ref_cls(ref):
              # (ref, ref_name) for the class a sampled ref stands for; refs/heads/main is itself.
              if ref == "refs/heads/main":
                  return ref, "main"
              if ref.startswith("refs/tags/"):
                  # LOCAL (security): Git permits a tag named main, so a tag's ref_name may be main; only github.ref proves the branch
                  return Cls("refs/tags/"), Cls("")
              for p in ("refs/heads/gh-readonly-queue/", "refs/pull/"):
                  if ref.startswith(p):
                      return Cls(p), Cls("", ["main"])
              return Cls("refs/heads/", ["refs/heads/main"]), Cls("", ["main"])


          def ctx_get(ev, ref, path):
              p = path.lower()
              r, name = ref_cls(ref)
              # A pull request's head and base branches are any branch.
              pr = Cls("") if ev in PR else ""
              # LOCAL (security): github.event.ref is a payload field (short on create), so it stays unknown
              known = {"github.event_name": Cls("", EVENTS) if ev == OTHER_EV else ev,
                       "github.ref": r, "github.ref_name": name,
                       "github.ref_type": "tag" if ref.startswith("refs/tags/") else "branch",
                       "github.head_ref": pr, "github.base_ref": pr}
              if p in known:
                  return known[p]
              if ev in EVENTS and ev not in PR and (p == "github.event.pull_request" or p.startswith("github.event.pull_request.")):
                  return None
              return U


          TOK = re.compile(r"\s*(?:(?P<s>'(?:[^']|'')*')|(?P<n>-?\d+(?:\.\d+)?)|(?P<op>&&|\|\||==|!=|<=|>=|[!<>()\[\],.])|(?P<id>[A-Za-z_][\w-]*|\*))")


          def lex(s):
              out, i = [], 0
              while i < len(s):
                  if s[i:].strip() == "":
                      break
                  m = TOK.match(s, i)
                  if not m:
                      raise ValueError(f"cannot read the expression at {s[i:i+20]!r}")
                  i = m.end()
                  if m.group("s"):
                      out.append(("s", m.group("s")[1:-1].replace("''", "'")))
                  elif m.group("n"):
                      out.append(("v", float(m.group("n"))))
                  elif m.group("op"):
                      out.append(("op", m.group("op")))
                  else:
                      out.append(("id", m.group("id")))
              return out


          def truthy(v):
              if v is U:
                  return U
              if isinstance(v, float) and v != v:
                  return False
              return v not in (None, False, 0, "", 0.0)


          # LOCAL (security): a string becomes a number by GitHub's grammar; spellings only Python reads ('1_0') are NaN, unsure ones ('inf', '0X1') unknown
          NUM = re.compile(r"[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?")


          def num(v):
              if v is None or v is False:
                  return 0.0
              if v is True:
                  return 1.0
              if isinstance(v, (int, float)):
                  return float(v)
              if isinstance(v, str):
                  s = v.strip(" \t\n\r\v\f")
                  if s == "":
                      return 0.0
                  if NUM.fullmatch(s):
                      f = float(s)
                      return U if f in (float("inf"), float("-inf")) else f
                  if re.fullmatch(r"0x[0-9a-fA-F]{1,7}", s):
                      return float(int(s[2:], 16))
                  if re.fullmatch(r"0o[0-7]{1,10}", s):
                      return float(int(s[2:], 8))
                  if re.match(r"[+-]?(?:0[xXoO]|inf|nan|∞)", s, re.I):
                      return U
                  return float("nan")
              return float("nan")


          # LOCAL (security): a value as a GitHub expression string; U where the form is not certain
          def tostr(v):
              if v is U or isinstance(v, Cls):
                  return U
              if v is None:
                  return ""
              if isinstance(v, bool):
                  return "true" if v else "false"
              if isinstance(v, str):
                  return v
              if isinstance(v, (int, float)):
                  if v != v or v in (float("inf"), float("-inf")) or abs(v) >= 1e15:
                      return U
                  if v == int(v) and not (v == 0 and str(v).startswith("-")):
                      return str(int(v))
                  return U
              return U

          def eq(a, b):
              if a is U or b is U:
                  return U
              if isinstance(a, Cls) or isinstance(b, Cls):
                  c, o = (a, b) if isinstance(a, Cls) else (b, a)
                  return c.eq(o) if isinstance(o, str) else U
              # LOCAL (security): arrays and objects compare by identity, as in GitHub expressions
              if isinstance(a, (list, dict)) or isinstance(b, (list, dict)):
                  return a is b
              if isinstance(a, str) and isinstance(b, str):
                  return a.lower() == b.lower()
              if type(a) is type(b) and not isinstance(a, (int, float)):
                  return a == b
              x, y = num(a), num(b)
              return U if x is U or y is U else x == y


          class P:
              def __init__(self, toks, get):
                  self.t, self.i, self.get = toks, 0, get

              def peek(self):
                  return self.t[self.i] if self.i < len(self.t) else (None, None)

              def take(self, want=None):
                  k, v = self.peek()
                  if want is not None and v != want:
                      raise ValueError(f"expected {want!r}, found {v!r}")
                  self.i += 1
                  return k, v

              def parse(self):
                  v = self.orx()
                  if self.i != len(self.t):
                      raise ValueError(f"unexpected {self.peek()[1]!r}")
                  return v

              def orx(self):
                  a = self.andx()
                  while self.peek() == ("op", "||"):
                      self.take()
                      b = self.andx()
                      ta = truthy(a)
                      if ta is True:
                          pass
                      elif ta is False:
                          a = b
                      else:
                          # An unknown left operand is the result whenever it
                          # is truthy, so the value stays unknown whatever b is.
                          a = U
                  return a

              def andx(self):
                  a = self.cmp()
                  while self.peek() == ("op", "&&"):
                      self.take()
                      b = self.cmp()
                      ta = truthy(a)
                      if ta is False:
                          pass
                      elif ta is True:
                          a = b
                      else:
                          # An unknown left operand is the result whenever it
                          # is falsy, so the value stays unknown whatever b is.
                          a = U
                  return a

              def cmp(self):
                  # LOCAL (security): equality sits below relational, as in GitHub expressions
                  a = self.rel()
                  while self.peek()[0] == "op" and self.peek()[1] in ("==", "!="):
                      op = self.take()[1]
                      r = eq(a, self.rel())
                      a = r if op == "==" or r is U else not r
                  return a

              def rel(self):
                  a = self.unary()
                  while self.peek()[0] == "op" and self.peek()[1] in ("<", "<=", ">", ">="):
                      op = self.take()[1]
                      b = self.unary()
                      if a is U or b is U or isinstance(a, Cls) or isinstance(b, Cls):
                          a = U
                      else:
                          x, y = (a.lower(), b.lower()) if isinstance(a, str) and isinstance(b, str) else (num(a), num(b))
                          a = U if x is U or y is U else {"<": x < y, "<=": x <= y, ">": x > y, ">=": x >= y}[op]
                  return a

              def unary(self):
                  if self.peek() == ("op", "!"):
                      self.take()
                      t = truthy(self.unary())
                      return U if t is U else not t
                  return self.primary()

              def primary(self):
                  k, v = self.take()
                  if k == "s" or k == "v":
                      return v
                  if (k, v) == ("op", "("):
                      r = self.orx()
                      self.take(")")
                      return r
                  if k != "id":
                      raise ValueError(f"unexpected {v!r}")
                  lv = v.lower()
                  if lv in ("true", "false"):
                      return lv == "true"
                  if lv == "null":
                      return None
                  if self.peek() == ("op", "("):
                      self.take()
                      args = []
                      if self.peek() != ("op", ")"):
                          args.append(self.orx())
                          while self.peek() == ("op", ","):
                              self.take()
                              args.append(self.orx())
                      self.take(")")
                      return self.call(lv, args)
                  path, exact = v, True
                  while self.peek() in (("op", "."), ("op", "[")):
                      if self.take()[1] == ".":
                          k2, v2 = self.take()
                          if k2 != "id":
                              raise ValueError(f"unexpected {v2!r} after '.'")
                          path += "." + v2
                          exact = exact and v2 != "*"
                      else:
                          idx = self.orx()
                          self.take("]")
                          if isinstance(idx, str):
                              path += "." + idx
                          else:
                              exact = False
                  return self.get(path) if exact else U

              def call(self, f, a):
                  if f == "always":
                      return True
                  if f in ("startswith", "endswith", "contains") and len(a) == 2:
                      if U in a:
                          return U
                      if f == "startswith" and isinstance(a[0], Cls) and isinstance(a[1], str):
                          return a[0].starts(a[1])
                      if f == "contains" and isinstance(a[0], list):
                          # LOCAL (security): an unknown element comparison keeps the result unknown
                          r = [eq(x, a[1]) for x in a[0]]
                          return True if any(x is True for x in r) else (U if any(x is U for x in r) else False)
                      # LOCAL (security): operands convert to strings as GitHub does, else unknown
                      x, y = (tostr(s) for s in a)
                      if x is U or y is U:
                          return U
                      x, y = x.lower(), y.lower()
                      return x.startswith(y) if f == "startswith" else x.endswith(y) if f == "endswith" else y in x
                  if f == "fromjson" and len(a) == 1 and isinstance(a[0], str):
                      try:
                          return json.loads(a[0])
                      except ValueError:
                          return U
                  # LOCAL (security): format's arguments convert as GitHub does; one it cannot is unknown
                  if f == "format" and a and U not in a and isinstance(a[0], str):
                      s = [tostr(v) for v in a[1:]]
                      if U in s:
                          return U
                      # LOCAL (security): GitHub's escaping: {{ and }} are literal braces, {N} is argument N;
                      # a malformed or out-of-range placeholder is an error there, so it is unknown here
                      t, out, i = a[0], [], 0
                      while i < len(t):
                          c = t[i]
                          if c in "{}" and t[i + 1:i + 2] == c:
                              out.append(c)
                              i += 2
                          elif c == "{":
                              m = re.match(r"\{(\d+)\}", t[i:])
                              if not m or int(m.group(1)) >= len(s):
                                  return U
                              out.append(s[int(m.group(1))])
                              i += m.end()
                          elif c == "}":
                              return U
                          else:
                              out.append(c)
                              i += 1
                      return "".join(out)
                  return U  # success(), failure(), hashFiles(), ...: unknown


          def unquote(s):
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] == "'":
                  return s[1:-1].replace("''", "'")
              if len(s) >= 2 and s[0] == s[-1] == '"':
                  return json.loads(s)
              return s


          def strip_comment(s):
              q = None
              for i, c in enumerate(s):
                  if q:
                      if c == q:
                          q = None
                  elif c in "'\"":
                      q = c
                  elif c == "#" and (i == 0 or s[i - 1] in " \t"):
                      return s[:i].rstrip()
              return s.rstrip()


          def ind(line):
              return len(line) - len(line.lstrip(" "))


          def body(lines, i, inline):
              """The value text of the key on line i: the inline part plus every deeper line."""
              base, parts = ind(lines[i]), []
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or ind(lines[j]) > base):
                  if lines[j].strip() and not lines[j].lstrip().startswith("#"):
                      parts.append(strip_comment(lines[j]).strip())
                  j += 1
              inline = strip_comment(inline).strip()
              if inline[:1] in ("|", ">"):
                  return (" " if inline[0] == ">" else "\n").join(parts)
              return " ".join([inline] + parts).strip()


          def keys_under(lines, i):
              """(line, key) for each direct child key of the block opened on line i."""
              base, out, child = ind(lines[i]), [], None
              for j in range(i + 1, len(lines)):
                  s = lines[j]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  if ind(s) <= base:
                      break
                  child = ind(s) if child is None else child
                  if ind(s) == child:
                      m = re.match(r"\s*(?:-\s+)?(['\"]?)([^'\":#]+)\1\s*(?::\s*(.*))?$", s)
                      if m:
                          out.append((j, m.group(2).strip(), m.group(3) or ""))
              return out


          def triggers(lines):
              for i, s in enumerate(lines):
                  m = re.match(r"(['\"]?)(on|true)\1\s*:\s*(.*)$", s)
                  if m:
                      v = strip_comment(m.group(3)).strip()
                      if v.startswith("{"):  # a flow mapping: its keys, nested ones too
                          return set(re.findall(r"([A-Za-z_]+)['\"]?\s*:", v))
                      if v:
                          return {unquote(x) for x in re.split(r"[\s,\[\]]+", v) if x}
                      return {k for _, k, _ in keys_under(lines, i)}
              return set()


          # v1.43: the standard GitHub-hosted images, free on a public
          # repository; a larger runner (cores, large, xlarge, gpu) bills even there.
          STANDARD = re.compile(r"(ubuntu-(latest|24\.04|22\.04)(-arm)?|ubuntu-slim)")
          LARGER = re.compile(r"(cores|xlarge|large|gpu)", re.I)
          WAIVER = re.compile(r"#\s*self-hosted:\s*(hardware|oversize|credential)\s*:\s*\S")
          BARE = re.compile(r"#\s*self-hosted:")  # v1.46: a waiver whose reason names no category
          # v1.47: a review-only label runs only in code-review.yml, and
          # only with its own category; credential: is the codex job's alone.
          REVIEW = {"codex": "credential", "qwen": "hardware"}
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          REVIEW_TOKEN = re.compile(r"(?<![\w.-])['\"]?(codex|qwen)['\"]?(?![\w-])", re.I)
          GH = "https://github.com"
          # v1.48: the template's ci.yml preflight outputs runs-on JSON (this
          # repository's jobs name ubuntu-latest directly), "ubuntu-latest" by default and the
          # self-hosted overflow list when the hosted pool is full. In ci.yml only, a
          # runs-on that reads exactly these outputs is checked under both: the
          # default must be a standard image, as (c) asks of every job, and the
          # overflow may also be exactly the list its output names. Any other
          # self-hosted value still needs its waiver.
          SEL_FILES = {"ci.yml", "ci.yaml"}
          SEL_OUT = {"needs.preflight.outputs.runner": "bigdisk",
                     "needs.preflight.outputs.runner_docker": "bigdisk-docker"}
          OVERFLOW = [["self-hosted", "linux", "x64", v] for v in SEL_OUT.values()]
          # v1.49: ci.yml's preflight job alone may read the repository
          # variable CI_PREFLIGHT_RUNS_ON. Its runs-on is checked in two
          # states of its own, in place of the selection's: unset, where
          # exactly [self-hosted, linux, x64, bigdisk] passes too (never for a
          # pull request from a fork, which must get a standard image), and set to
          # the fallback `"ubuntu-latest"`, where it must give a standard image
          # on every event. Another job that reads the variable reads an unknown.
          PRE_JOB = "preflight"
          PRE_VAR = "vars.ci_preflight_runs_on"
          PRE_READ = re.compile(r"(?<![\w.])vars\.CI_PREFLIGHT_RUNS_ON(?![\w-])", re.I)
          HOSTED_CTX = [  # (event, ref, head repo) on github.com; o/r is this repository
              ("push", "refs/heads/main", None), ("push", "refs/heads/feature", None),
              ("pull_request", "refs/pull/1/merge", "o/r"), ("pull_request", "refs/pull/1/merge", "fork/r"),
              ("workflow_dispatch", "refs/heads/main", None), ("schedule", "refs/heads/main", None),
              # v1.51: the base-defined PR event code-review.yml and signatures.yml run on.
              ("pull_request_target", "refs/heads/main", "o/r"), ("pull_request_target", "refs/heads/main", "fork/r"),
          ]


          def hosted_get(ev, ref, head, sel=None):
              def get(path):
                  p = path.lower()
                  if sel and p in SEL_OUT:  # v1.48: the selection output, as JSON text
                      # v1.52: the step outputs the hosted default for a fork's head under pull_request.
                      fork_pr = ev == "pull_request" and head == "fork/r"
                      return json.dumps("ubuntu-latest" if sel == "default" or fork_pr else ["self-hosted", "linux", "x64", SEL_OUT[p]])
                  if sel in ("unset", "set") and p == PRE_VAR:  # v1.49: unset, or the fallback switch
                      return None if sel == "unset" else json.dumps("ubuntu-latest")
                  if p == "github.server_url":
                      return GH
                  if p == "github.repository":
                      return "o/r"
                  if p == "github.event.pull_request.head.repo.full_name":
                      return head if ev in PR else None
                  if p == "github.event.pull_request.draft":
                      return False if ev in PR else None
                  return ctx_get(ev, ref, path)
              return get


          def labels(value):
              # A runs-on value's labels: a string, a list, or an expression's result.
              if value is U or value is None or isinstance(value, Cls):
                  return None
              if isinstance(value, list):
                  return [str(x) for x in value]
              return [str(value)]


          def runs_on_labels(text, ev, ref, head, sel=None):
              t = text.strip()
              if t.startswith("group:") or t.startswith("labels:") or " labels:" in t:
                  m = re.search(r"labels:\s*(\[[^\]]*\]|\S+)", t)
                  t = m.group(1) if m else ""
              m = re.fullmatch(r"\$\{\{(.*)\}\}", unquote(t), re.S)
              if m:
                  return labels(P(lex(m.group(1)), hosted_get(ev, ref, head, sel)).parse())
              if t.startswith("["):
                  return [unquote(x) for x in re.split(r"\s*,\s*", t.strip("[] ")) if x]
              if t.startswith("- "):
                  return [unquote(x) for x in re.split(r"\s*-\s+", " " + t) if x.strip()]
              return [unquote(t)]


          def review_labels(text):
              # The review-only labels a runs-on names, in its text or in what an
              # expression there yields on any github.com event.
              found = {m.lower() for m in REVIEW_TOKEN.findall(text)}
              for ev, ref, head in HOSTED_CTX:
                  try:
                      got = runs_on_labels(text, ev, ref, head)
                  except ValueError:
                      continue
                  found |= {g.lower() for g in got or [] if g.lower() in REVIEW}
              return sorted(found)


          def review_finding(path, where, ro, ro_line):
              # v1.47: label and category together, whatever the waiver says.
              names = review_labels(ro)
              m = WAIVER.search(ro_line)
              cat = m.group(1) if m else None
              base = path.replace("\\", "/").rsplit("/", 1)[-1]
              if names and base not in REVIEW_FILES:
                  return (f"{where}: (f) names the review-only label {', '.join(names)}; the template reserves codex and "
                          f"qwen to code-review.yml whatever the `# self-hosted:` waiver says")
              if names:
                  wrong = [n for n in names if cat != REVIEW[n]]
                  if len(names) > 1 or wrong:
                      return (f"{where}: (f) runs on {', '.join(names)} with the category {cat or 'none'}; the template pairs "
                              f"codex with `credential:` and qwen with `hardware:`, one review label per job")
                  return None
              if cat == "credential":
                  return (f"{where}: (f) uses the `credential:` category without the codex label; the template keeps it "
                          f"for code-review.yml's Codex review job alone")
              return None


          def names_release(text):
              # LOCAL (security): runner labels match case-insensitively, so RELEASE and Release are the release label
              return re.search(r"(?<![\w.-])['\"]?release['\"]?(?![\w-])", text, re.I) is not None


          def condition(text):
              t = unquote(text) if text else ""
              m = re.fullmatch(r"\s*\$\{\{(.*)\}\}\s*", t, re.S)
              if m and OPEN not in m.group(1):
                  return m.group(1)
              if OPEN in t:
                  raise ValueError("text around the expression makes it a string, which is always true")
              return t


          TOP_KEY = re.compile(r"(['\"]?)([A-Za-z0-9_-]+)\1\s*:(?:\s+(.*))?$")
          JOB_KEY = re.compile(r"([A-Za-z0-9_-]+)\s*:(?:\s+(.*))?$")
          YAML_NODE = re.compile(r"(?:^|[\s,\[{:])[*&!]")  # an alias, anchor or tag


          def block_children(lines, i):
              """(line, text) for each line at the first child indent under line i."""
              base, child, out = ind(lines[i]), None, []
              for j in range(i + 1, len(lines)):
                  s = lines[j]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  if ind(s) <= base:
                      break
                  child = ind(s) if child is None else child
                  if ind(s) < child:
                      return None
                  if ind(s) == child:
                      out.append((j, strip_comment(s).strip()))
              return out


          def jobs_block(lines):
              """The line of the one block-style `jobs:` key, or why the jobs cannot be read.

              LOCAL (fail closed): the validator reads YAML by its lines, so a
              jobs block in any other form (a quoted key, a flow mapping, an
              explicit or merge key, an alias, anchor or tag) is a finding,
              never skipped into the final OK.
              """
              at = []
              for i, s in enumerate(lines):
                  if not s.strip() or s.lstrip().startswith("#") or ind(s) > 0:
                      continue
                  t = strip_comment(s).strip()
                  if t in ("---", "..."):
                      continue
                  m = TOP_KEY.match(t)
                  if not m:
                      return None, f"line {i + 1} is not a block-style top-level key"
                  if m.group(2) == "jobs":
                      if m.group(1):
                          return None, f"line {i + 1} quotes the jobs key"
                      if m.group(3):
                          return None, f"line {i + 1} gives jobs an inline value (a flow mapping, alias or scalar)"
                      at.append(i)
              if len(at) != 1:
                  return None, ("it has no block-style jobs key" if not at else "it has more than one jobs key")
              jobs = block_children(lines, at[0])
              if not jobs:
                  return None, "its jobs key opens no block mapping of jobs"
              for j, t in jobs:
                  m = JOB_KEY.match(t)
                  if not m or m.group(2):
                      return None, f"line {j + 1} is not a job opening a block mapping"
                  keys = block_children(lines, j)
                  if not keys:
                      return None, f"job {m.group(1)} opens no block mapping"
                  for k, kt in keys:
                      km = TOP_KEY.match(kt)
                      if not km and not kt.startswith("<<"):
                          return None, f"line {k + 1} in job {m.group(1)} is not a block-style key"
                      if not km or re.match(r"[*&!]", km.group(3) or ""):
                          return None, f"line {k + 1} in job {m.group(1)} uses a merge key, alias, anchor or tag"
                      if km.group(2) == "runs-on":
                          ro = re.sub(r"\$\{\{.*?\}\}", "", body(lines, k, km.group(3) or ""), flags=re.S)
                          if YAML_NODE.search(ro):
                              return None, f"line {k + 1} in job {m.group(1)} gives runs-on through an alias, anchor or tag"
              return at[0], None


          def check(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              on = triggers(lines)
              bad = []
              ji, why = jobs_block(lines)
              if why:
                  return [f"{path}: (g) its jobs cannot be read: {why}; the runner-label check reads only "
                          f"block-style YAML and fails closed on any other form"]
              for i, s in enumerate(lines):
                  if i == ji:
                      for j, job, _ in keys_under(lines, ji):
                          ro = cond = ro_line = None
                          for k, key, inline in keys_under(lines, j):
                              if key == "runs-on":
                                  ro, ro_line = body(lines, k, inline), lines[k]
                              elif key == "if":
                                  cond = body(lines, k, inline)
                          where = f"{path}:{job}"
                          if ro is not None and not names_release(ro):
                              # v1.43: hosted first.
                              if LARGER.search(ro) and re.search(r"ubuntu|windows|macos", ro):
                                  bad.append(f"{where}: (d) names a larger GitHub-hosted runner ({ro}); it bills on a public repository")
                                  continue
                              rf = review_finding(path, where, ro, ro_line)
                              if rf:
                                  bad.append(rf)
                                  continue
                              if WAIVER.search(ro_line):
                                  continue
                              off = []
                              sels = ("default", "overflow") if path.replace("\\", "/").rsplit("/", 1)[-1] in SEL_FILES else (None,)
                              if sels[0] is not None and job == PRE_JOB and PRE_READ.search(ro):
                                  sels = ("unset", "set")  # v1.49: its own two states, no selection output
                              for ev, ref, head in HOSTED_CTX:
                                  # v1.51: under pull_request_target, a fork's head never
                                  # reaches a self-hosted runner, overflow or not.
                                  # v1.52: under pull_request too.
                                  fork_target = ev in PR and head == "fork/r" and ev in on
                                  for sel in sels:
                                      try:
                                          got = runs_on_labels(ro, ev, ref, head, sel)
                                      except ValueError as e:
                                          off.append(f"{ev} ({ref}): cannot be read ({e})")
                                          continue
                                      if got is not None and sel == "overflow" and got in OVERFLOW and not fork_target:
                                          continue
                                      if (sel == "unset" and got == OVERFLOW[0] and not fork_target
                                              and not (ev == "pull_request" and head == "fork/r")):
                                          continue  # a fork pull request's head never takes the pool
                                      if got is None or len(got) != 1 or not STANDARD.fullmatch(got[0]):
                                          what = "an unknown label" if got is None else ", ".join(got)
                                          note = ", runner selection overflow" if sel == "overflow" else ""
                                          if sel in ("unset", "set"):
                                              note = ", CI_PREFLIGHT_RUNS_ON " + ("unset" if sel == "unset" else 'set to "ubuntu-latest"')
                                          if fork_target and got is not None:
                                              note += f", {ev}: a fork never reaches a self-hosted runner"
                                          off.append(f"{ev} ({ref}{', fork' if head == 'fork/r' else ''}{note}): {what}")
                              if off and BARE.search(ro_line):
                                  bad.append(f"{where}: (e) its `# self-hosted:` reason names no category; the template allows a self-hosted job "
                                             f"only as `# self-hosted: hardware: <reason>` or `# self-hosted: oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                              elif off:
                                  bad.append(f"{where}: (c) does not run on a standard GitHub-hosted image on github.com and its runs-on "
                                             f"line gives no `# self-hosted: hardware|oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                              continue
                          if ro is None:
                              continue
                          if cond is None:
                              if on & PR:
                                  bad.append(f"{where}: (a) names `release` in a workflow with a pull_request trigger, and has no `if:`")
                              bad.append(f"{where}: (b) names `release` and has no `if:` restricting it to {ALLOWED}")
                              continue
                          try:
                              expr = condition(cond)
                              toks = lex(expr)
                              runs = []
                              for ev, ref in CTX:
                                  r = truthy(P(toks, lambda p: ctx_get(ev, ref, p)).parse())
                                  if r is not False:
                                      runs.append((ev, ref))
                          except ValueError as e:
                              bad.append(f"{where}: (b) names `release` and its `if:` cannot be read ({e})")
                              continue
                          pr = [c for c in runs if c[0] in PR and c[0] in on]
                          if pr:
                              bad.append(f"{where}: (a) names `release` and a {pr[0][0]} event can run it")
                          rest = [c for c in runs if c not in pr]
                          if rest:
                              bad.append(f"{where}: (b) names `release` and its `if:` does not restrict it to {ALLOWED}; it can run on "
                                         + ", ".join(dict.fromkeys(f"{ev} ({ref})" for ev, ref in rest)))
              return bad


          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          bad = []
          for f in files:
              try:
                  bad += check(f)
              except (OSError, UnicodeError) as e:
                  bad.append(f"{f}: cannot be read ({e})")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              print(f"{len(bad)} runner-label finding(s) in {len(files)} workflow file(s): a `release` job runs only on {ALLOWED}, never for a pull request; every other job runs on a standard GitHub-hosted image, or its runs-on line names a hardware or oversize reason; codex and qwen run only in code-review.yml, with their own category")
              sys.exit(1)
          print(f"OK: {len(files)} workflow file(s); every job that names `release` runs only on {ALLOWED}, and every other job on a standard GitHub-hosted image or with a hardware or oversize reason")
          PY

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # v1.30: lint_gates is false only on a PR whose changed files all
          # miss LINT_GATES_PATTERN; any doubt runs the job. A ci:full
          # PR keeps both scopes off. LOCAL: the template's CI_FULL_LABEL is
          # CI_FULL_TIER here, which on a PR is exactly the ci:full label.
          docs_only=false lint_gates=true
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files" | grep -qE "$LINT_GATES_PATTERN" || lint_gates=false
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only; lint-gates: $lint_gates"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "lint_gates=$lint_gates" >> "$GITHUB_OUTPUT"

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # v1.38: `[self-hosted, linux, x64,
  # release]`, the only label a publish job takes, and never a pull request
  # (the preflight step `Runner labels` fails CI otherwise). On
  # GitHub the job runs only when the repository variable RELEASE_RUNNER is
  # `true`, which a repository sets once Infrastructure reports the release
  # pools live; until then it skips, and no run waits on a label with no
  # runner. On Gitea it runs on every push to main, as in v1.37.
  # v1.30 (fix 1): the toolchain image is built once per content hash, here,
  # and every other job pulls it (scripts/ci-image-cache.sh v1, ships beside
  # this file). On a push to main only, on the release runner, which alone
  # holds the registry credential (rulings 169 and 173): when the registry
  # lacks `<repo>-toolchain:<hash>-main` under CI_IMAGE_NAMESPACE, it builds
  # the image and pushes it; otherwise it does nothing. The integration image
  # stays keyed by the tree (ruling 220(5)) and is built where it runs.
  # This job is not in CI Gate's needs: a registry fault must not turn main
  # red, and every consumer falls back to a local build. CUSTOMIZE: a
  # repository whose forge has no `release` runner sets `if: false` and says
  # so in its adoption PR, because a job no runner takes keeps the run in
  # progress and the schedule guard reads main as busy.
  publish-images:
    name: Publish CI images
    # >>> CUSTOMIZE (go-quicraft)
    # #503: no release runner serves this repository, so the job is off. A
    # literal `if: false` fails actionlint (constant condition), so it is
    # gated on the CI_PUBLISH_IMAGES repository variable, unset here, ANDed
    # with the template's condition. The job runs on the hosted runner, and
    # its `if:` keeps it off on github.com.
    runs-on: ubuntu-latest
    if: ${{ vars.CI_PUBLISH_IMAGES == 'true' && github.server_url != 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # A job with no `needs` goes straight to a runner, which is what
    # evaluates its `if`; with no release runner it would stay queued and
    # hold every run pending. Needing preflight makes the server
    # evaluate the `if` when that job ends and mark this one skipped.
    needs: [preflight]
    # <<< CUSTOMIZE
    timeout-minutes: 60       # CUSTOMIZE: ceil(1.5 x a cold toolchain build's p95)
    env:
      CI_IMAGE_NAMESPACE: ci-images   # ci-standard.md §9 (ruling 217(4))
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the release runner is a pool host; the LAN addresses are
      # masked before ci-image-cache.sh publish builds and prints.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      # v1.42 (ruling 742 (1)): ci-image-cache.sh v3 scans the toolchain
      # image it built with `trivy image` (--ignore-unfixed, --skip-dirs
      # /opt/go/mod, CRITICAL and HIGH) before it pushes it, and refuses the
      # push on a finding (devops.md §8: trivy image blocks before any push).
      # This job runs on a push to main on the release runner, never on a PR,
      # and is not in CI Gate's needs, so the PR gate stays hermetic.
      - name: Publish the toolchain image when the registry lacks its hash
        env:
          IN_IMAGE_NETWORK: bridge   # v1.42: the scan reads the trivy database
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          scripts/ci-image-cache.sh publish ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # v1.30 (fix 1, parallel jobs; fix 5, gosec on the PR tier): the
  # lint-class stages, moved from the image job, in a job of their own that
  # needs the toolchain image alone, so they run beside build and make
  # coverage and not in series before them. The PR tier runs `make gosec`
  # here; the full tier runs gosec in the image job's `make security`, so it
  # runs once per event. It runs on a docs-only PR, as lint did. v1.42
  # (ruling 742 (1)): `make gosec` runs here on every event but a docs-only
  # PR, and deps-check left this job, so every step reads only the tree.
  lint:
    name: Lint [lint, gosec, build tags]
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 60
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      CI_IMAGE_NAMESPACE: ci-images
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      # v1.30 (fix 1): the registry cache first. A miss, or an unreachable
      # registry, falls through to the local build below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      # v1.30: the toolchain image alone (`make docker-build-toolchain`,
      # devcontainer.md §6), which skips when the daemon holds its tag.
      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # Ruling 901: the images the job built or pulled carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # make lint: gofmt, vet, golangci-lint, actionlint with shellcheck
      # (devops.md §4). .golangci.yml enables staticcheck, errcheck, unused,
      # ineffassign, misspell and gocritic (devops.md §8). v1.27: a repo's
      # `make lint-gates` runs in the lint-gates job beside this one, never
      # here and never as a prerequisite of lint. v1.30: in this job, moved
      # from the image job.
      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        # >>> CUSTOMIZE (go-quicraft)
        # make lint runs golangci-lint in every module; the nested modules'
        # dependencies are not in the image's module cache.
        env:
          IN_IMAGE_NETWORK: bridge
        # <<< CUSTOMIZE
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.26.1 (Tenant Agent m1128 (9)): a docs-only PR skips make coverage, so
      # it runs the releasability test alone; any other run gets it from make
      # coverage.
      - name: Releasability test (docs-only PR)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.RELEASABILITY_TEST != '' && needs.preflight.outputs.docs_only == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go test -count=1 -tags '$GO_BUILD_TAGS' $RELEASABILITY_TEST"

      # v1.9.2, now in the image: the declared tag set must select code. Each
      # tag is checked by removal: if dropping it changes no selected file
      # (tests included), it is misspelled or dead. Compares files, not
      # packages, and a tag may swap files (a `!foo` stub for a `foo` body).
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "GO_BUILD_TAGS='$GO_BUILD_TAGS' sh scripts/assert-build-tags.sh"

      # v1.30 (fix 5): gosec on the PR tier, through the developers' target,
      # with no network. v1.42 (ruling 742 (1)): make security left the image
      # job, so gosec runs here on every event but a docs-only PR. It reads
      # only the tree, so the gate stays hermetic.
      - name: make gosec
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make gosec GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.42 (ruling 742 (1)): `Base commit for deps-check (ruling 640)` and
      # `make deps-check` left this job. deps-check reads the module proxy and
      # the vulnerability database, so its answer changes with no change to
      # the tree; scans.yml's bump runs its full gate on a schedule (ruling 640).

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). One image job (Company Agent
  # m601 (a)) builds the images once from build/docker/devcontainer/Dockerfile
  # at this commit (`make docker-build`) and runs each stage's `make` target in
  # the toolchain image as its own step, through scripts/in-toolchain-image.sh
  # (ships beside this file), which copies the checkout into the container: a
  # runner reaches its daemon through a socket, so a bind mount would resolve
  # on the daemon's host. A failed step names its stage; `if: !cancelled()`
  # runs every stage after a failed one, so one run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (devcontainer.md §2) decides every version, and the Makefile carries every
  # flag set (devops.md §4; §8: CI runs gosec through the developers' target).
  # GO_BUILD_TAGS reaches every target as a make variable, so the tag set is
  # still written once. build, test and lint run with no network, on the
  # image's module cache; security and deps-check get one (IN_IMAGE_NETWORK=
  # bridge) for the vulnerability databases and the module proxy. v1.42
  # (ruling 742 (1)): security and deps-check run in scans.yml, so no ci.yml
  # stage needs the network for an advisory or a version lookup.
  #
  # v1.23: lint, assert-build-tags, build and coverage are the PR tier and run
  # on every event. security and trivy image are full tier only
  # (env.CI_FULL_TIER); v1.41: the full tier is every event, every PR too.
  # v1.28: deps-check is a lint-class gate on the PR tier and runs on every
  # event (ruling 219(3)).
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (in-toolchain-image.sh v2, ci-standard.md §6), so a stage writes its
  # caches there and not into its container's layer.
  #
  # v1.29 (ruling 220(5)): the job reads the Alpine package
  # indexes the build resolves against (scripts/apk-index-sum.sh, ships beside
  # this file) into APK_INDEX_SUM, which the integration image's tag hashes and
  # its build takes as a build argument (ci-standard.md §9, devcontainer.md
  # §6). A new Alpine package release, a CVE fix among them, changes the tag,
  # so the next run rebuilds the image rather than reuse a cached one with the
  # old package (go-enclave main fd83b79ce, CVE-2026-92392).
  #
  # The forge credentials reach the image build only as the gomodauth BuildKit
  # secret, from a file outside the context that the job removes.
  # No step and no make target prints that file, the job environment (`env`,
  # `printenv`, `set -x`) or a matched line: `make stage-gomodauth` and the
  # file writes run silent, and lint steps and `make check-public-literals`
  # report path and line only (ci-standard.md §5, Tenant Agent m605 item 8).
  #
  # Runners: every job in this workflow runs on GitHub-hosted ubuntu-latest
  # (4 vCPU, 16 GB, about 14 GB free disk, a 6 h job limit), which has
  # Docker. Each job is a fresh VM, so it builds the images it needs and
  # frees the runner's preinstalled toolchains first ("Free runner disk").
  #
  # v1.30: lint, the build-tag assertion, the releasability test and
  # deps-check moved to the lint job. This job runs build and, on the full
  # tier, make security and trivy image; it skips on a docs-only PR, which
  # runs none of them, and CI Gate reads that skip as passed. The unit test
  # stage (make coverage) moved to the `unit` shards and the `coverage` merge
  # below, so no single job runs the whole -race suite on a 4-core runner.
  image:
    name: Devcontainer image [build]
    runs-on: ubuntu-latest
    needs: [preflight]   # v1.24 (CA m749, m751 (a)); v1.29.3
    # v1.29.3: on a schedule run, only on the schedule guard's `run`. v1.30:
    # on every event only on `run` (not `refused`, not `proven`), and never
    # on a docs-only PR.
    if: ${{ needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    timeout-minutes: 120     # hosted runner: both image builds cold, build, security and trivy image (6 h cap)
    env:
      CI_IMAGE_NAMESPACE: ci-images   # v1.30
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: the nightly schedule runs
      # on main, so it writes main's set too.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Tenant Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23 (Tenant Agent m674 item 3, 2026-10-18): the integration image is named by its content,
      # <repo>-ci-it:<hash> (`make -s it-image`, ci-standard.md §9), so every
      # job of every run on this runner names the same image for the same
      # tree, builds it once and reuses it. No job removes it; the reap step does.
      # v1.29 (ruling 220(5)): the Alpine package index checksum joins the
      # integration image's tag hash (scripts/apk-index-sum.sh). A base image
      # the script cannot read fails the step. CUSTOMIZE (go-quicraft): the
      # base image comes from scripts/tool-pins.sh as APK_BASE_IMAGES, since the
      # Dockerfile's GO_IMAGE ARG has no default.
      - name: Read the Alpine package index
        run: |
          sum=$(. scripts/tool-pins.sh && APK_BASE_IMAGES="$GO_IMAGE" scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning a test needs (e.g. QUIC UDP buffers:
      # sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032)
      # goes here; the container shares the runner's kernel.
      # >>> CUSTOMIZE (go-quicraft)
      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"
      # <<< CUSTOMIZE

      # v1.30 (fix 1): the toolchain image from the registry cache first, so
      # make docker-build builds the integration image alone.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the devcontainer images
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: the build's module fetches go through Athens first when
          # the runner sets DEVCACHE_GOPROXY and the cache answers, with the
          # proxy.golang.org fallback. v1.29.5: the separator is `|`, so any
          # error falls through, and "$bp" is one quoted make argument; the
          # Makefile quotes it on the docker build line.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          # >>> CUSTOMIZE (go-quicraft)
          # Only the full tier uses the integration image (the trivy image
          # step here, the integration and soak jobs), so a PR-tier run, a
          # docs-only PR included, builds the toolchain image alone. The
          # integration image's tag hashes pkg/ and test/, so building it on
          # a PR rebuilt an image nothing in the run read.
          target=docker-build-toolchain
          [ "$CI_FULL_TIER" != true ] || target=docker-build
          make "$target" ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          # <<< CUSTOMIZE
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          if docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
            docker create --name "$lease" "$IT_IMAGE" true >/dev/null && echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          fi

      # The images the job built carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE"

      # The integration image the build step made, checked the same way. A
      # pull request without ci:full builds only the toolchain image, and the
      # lease step leases only an image that is present, so the check runs
      # only on a lease (as the integration job runs only on its lease).
      - name: Check the integration image carries no private address
        if: ${{ !cancelled() && env.IT_IMAGE != '' && env.IT_LEASE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$IT_IMAGE"

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # CUSTOMIZE: nested modules (sdk/go, xkey) and variants (FIPS) are built
      # by `make build` itself, never by an extra step here.
      - name: make build
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make build GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.42 (ruling 742 (1)): `make security` (gosec, govulncheck, go mod
      # verify, trivy fs) and `trivy image (integration image)` left this job.
      # Both read an advisory database that changes with no change to the
      # tree. scans.yml runs them on main and opens or updates ONE issue on a
      # finding; gosec runs in the lint job on every event.

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # The test stage (m601 (c)), sharded for hosted runners: the whole unit
  # suite with -race (make test's flags) was one ~40-minute run on a large
  # runner and does not fit a 4-core one with headroom. `make coverage-shard`
  # deals the packages over UNIT_SHARDS shards by test-file size, heaviest
  # first, so each shard runs a disjoint quarter with -race and writes its
  # own profile. Tags matter here too: without them tag-gated packages are
  # neither tested nor counted. The PR tier's unit test and race checks;
  # `code` tier, so a docs-only PR skips it. CI Gate needs the matrix as one
  # entry, whose result is success only when every shard succeeded.
  unit:
    name: Unit tests [-race, coverage, shard ${{ matrix.shard }}/4]
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # 0..UNIT_SHARDS-1
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # >>> CUSTOMIZE (go-quicraft)
      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"
      # <<< CUSTOMIZE

      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # The container gets a copy of the checkout, so the profile comes back
      # on stdout: make's own output goes to stderr, then the profile is cat.
      - name: make coverage-shard
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: |
          out="coverage-shard-$SHARD-of-$UNIT_SHARDS.out"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            "make coverage-shard SHARD=$SHARD SHARDS=$UNIT_SHARDS COVER_TIMEOUT=$COVER_TIMEOUT GO_BUILD_TAGS='$GO_BUILD_TAGS' 1>&2 && cat build/coverage/$out" > "$out"
          test -s "$out"

      # Gitea's artifact server takes only the v3 protocol (as in batch.yml).
      - name: Upload the shard profile (Gitea)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}-of-${{ env.UNIT_SHARDS }}.out
          if-no-files-found: error
          retention-days: 3

      - name: Upload the shard profile
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}-of-${{ env.UNIT_SHARDS }}.out
          if-no-files-found: error
          retention-days: 3

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # The coverage threshold over the merged unit profiles: `make
  # coverage-merge` requires all UNIT_SHARDS profiles, joins them and fails
  # when total coverage, or any package under pkg/, is below
  # COVERAGE_THRESHOLD (testing-guidelines.md). It runs only when every
  # shard passed; a red shard leaves it skipped, and CI Gate fails on the
  # shard. `code` tier, like the shards.
  coverage:
    name: Coverage [merge, threshold]
    runs-on: ubuntu-latest
    needs: [preflight, unit]
    if: ${{ needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    timeout-minutes: 60      # hosted runner: a cold toolchain image build, then the merge (6 h cap)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # GitHub fails the whole job when any step names download-artifact v3,
      # even one its condition skips, so there is no v3 download step here.
      # The move below flattens the profiles into build/coverage, where
      # `make coverage-merge` reads them.
      - name: Download the shard profiles
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-shards

      - name: Collect the shard profiles
        run: |
          mkdir -p build/coverage
          find "$RUNNER_TEMP/coverage-shards" -type f -name 'coverage-shard-*-of-*.out' -exec mv -t build/coverage {} +
          ls -l build/coverage

      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make coverage-merge (the threshold)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage-merge SHARDS=$UNIT_SHARDS COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # v1.27 (Company Agent m1192 (6), item 27): a repository's `make lint-gates`
  # (its own gates beside `make lint`: script, workflow, generated-code and
  # module checks) runs in this job, in parallel with the image job's
  # `make lint`, not in series after it, so Lint's wall time is the longer of
  # the two and not their sum. It runs only when the Makefile (or a tracked
  # *.mk) defines a lint-gates target; a repository without one gets an OK and
  # a green job, with no image built. `make lint` and `go vet` stay where they
  # are. A repository whose `make lint` lists lint-gates as a prerequisite
  # removes it from lint in the PR that adopts v1.27, or the gates run twice.
  # The toolchain image comes from `make docker-build`, as in the image job,
  # which builds only a tag the daemon does not already hold (devcontainer.md
  # §6). A lint-class check, so it is on the PR tier and runs on a docs-only PR.
  # v1.29.1 (ruling 226(15), 108 repair): the step fails fast. `make
  # lint-gates` runs without `-k`, so the first failing gate ends the step
  # and the job; the gates after it run on the next push.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ubuntu-latest
    needs: [preflight]     # v1.29.3; v1.30
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`. v1.30: only on `run` on every event, and on a PR
    # only when a changed file matches LINT_GATES_PATTERN (fix 3).
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.lint_gates != 'false' }}
    timeout-minutes: 90      # hosted runner: a cold toolchain image build, then the gates (6 h cap)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      CI_IMAGE_NAMESPACE: ci-images   # v1.30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # CUSTOMIZE (go-quicraft): the API check's base is `git describe --tags`

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        run: scripts/ci-mask-lan.sh

      # The Runner labels step's rejection cases, on the runner's python3
      # (the toolchain image has none): stdlib only, no make recipe.
      - name: Runner labels tests
        run: python3 -I test/buildgates/testdata/runner-labels-tests.py

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.30 (fix 1): the registry cache first, then the toolchain image
      # alone (`make docker-build-toolchain`); this job never builds the
      # integration image.
      - name: Pull the toolchain image from the registry cache
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # Ruling 901: the images the job built or pulled carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # v1.29.1: no -k; the first failing gate ends the step (ruling 226(15)).
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge   # CUSTOMIZE: bridge when a gate needs the module proxy or a network
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # Integration tests run in the integration image (ci-standard.md §2), as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, the job reaps stale stacks
  # first (v1.18) and keeps its own teardown last under `if: always()`.
  # v1.23: full tier only (CI_FULL_TIER's expression); never on a plain PR.
  #
  # Hosted runners: the suite is dealt over IT_SHARDS shards by test-file
  # size (`make it-shard-packages`), each its own compose stack (IT_PROJECT
  # carries the shard) under the same 8g integration cap (compose.yaml).
  integration:
    name: Integration [integration image, shard ${{ matrix.shard }}/2]
    # v1.26: never on a draft PR, ci:full or not. v1.29.3: on a schedule run,
    # only on the schedule guard's `run`. v1.30: only on `run` on every event
    # (a proven main push and a refused run skip it).
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ubuntu-latest
    # >>> CUSTOMIZE (go-quicraft)
    # Behind the image job: it was the other multi-node QUIC load on a shared
    # runner host. Kept so a forge whose ubuntu-latest runners share a host
    # still serializes them; on hosted runners it costs wall time only.
    needs: [image, preflight]
    # <<< CUSTOMIZE
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]   # 0..IT_SHARDS-1
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Tenant Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(. scripts/tool-pins.sh && APK_BASE_IMAGES="$GO_IMAGE" scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # The image job built this image on its own runner, so a runner that
      # has not got it (a cache miss) builds it here first, with the module
      # credentials as the BuildKit secret, as the image job does. Then the
      # lease: the step fails without one, so IT_LEASE is always set after it.
      - name: Lease the integration image
        run: |
          if ! docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            # As in the image job: Athens first when the runner sets
            # DEVCACHE_GOPROXY and the cache answers, then proxy.golang.org.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            rc=0
            make docker-build-it ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::could not build the integration image $IT_IMAGE (exit $rc)"
              exit "$rc"
            fi
          fi
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          if ! docker create --name "$lease" "$IT_IMAGE" true >/dev/null; then
            echo "::error::could not lease the integration image $IT_IMAGE"
            exit 1
          fi
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.
      # >>> CUSTOMIZE (go-quicraft)
      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"
      # <<< CUSTOMIZE

      # The integration image the job found or built carries no private
      # address in its history or config, checked before any use. The lease
      # step built a missing image, so the check runs on every pool run, and
      # the suite runs only when it passed.
      - name: Check the integration image carries no private address
        id: it-history
        if: ${{ !cancelled() && env.IT_IMAGE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$IT_IMAGE"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # Its docker-build-it finds the tag the lease step found or built and
      # builds nothing.
      - name: make integration-test (integration image)
        if: ${{ success() && (runner.environment == 'github-hosted' || steps.it-history.outcome == 'success') }}
        run: |
          pkgs=$(make -s it-shard-packages SHARD="$SHARD" SHARDS="$IT_SHARDS" | tr '\n' ' ')
          [ -n "${pkgs// /}" ] || { echo "FAIL: integration shard $SHARD of $IT_SHARDS has no packages"; exit 1; }
          echo "integration shard $SHARD of $IT_SHARDS: $pkgs"
          make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" IT_PKGS="$pkgs"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          GO_QUICRAFT_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24 (owner ruling 2026-10-19, Tenant Agent m751 (e)): nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  soak:
    name: Soak [integration image]
    # v1.30: a dispatch off main is refused, so soak runs only on `run`.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ubuntu-latest
    # >>> CUSTOMIZE (go-quicraft)
    # Behind the integration job, as integration is behind the image job: one
    # multi-node QUIC load at a time, and a red integration run is not soaked.
    # v1.29.3: and on a schedule run, only on the schedule guard's `run`.
    needs: [integration, preflight]
    # <<< CUSTOMIZE
    timeout-minutes: 180     # hosted runner: a cold image build, SOAK_MINUTES, then one iteration (6 h cap)
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(. scripts/tool-pins.sh && APK_BASE_IMAGES="$GO_IMAGE" scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          if docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
            docker create --name "$lease" "$IT_IMAGE" true >/dev/null && echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          fi

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.
      # >>> CUSTOMIZE (go-quicraft)
      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"
      # <<< CUSTOMIZE

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            GO_QUICRAFT_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            GO_QUICRAFT_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # CUSTOMIZE: further stages run in the image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.
  # v1.29.2 (ruling 239(8)): a CUSTOMIZE job that runs only when certain
  # paths change (the preflight job gains an output for them, `optee` here)
  # needs the image job as well, and its `if:` tests an image job output
  # that its build step sets (here `built`, which the image job declares in
  # `outputs:` when a repository adds such a job), never `needs.<job>.result`
  # and never the preflight job's outputs alone. Reading `needs.preflight.outputs.*`
  # in the same `if:` is fine:
  #   needs: [preflight, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) }}

  # >>> CUSTOMIZE (go-quicraft)
  # Full-tier suites the unit run does not reach. Each command is the
  # matching ci-* target in the Makefile; `make ci-full` reproduces them.
  # Every job here sets the image job's CI_CACHE_CLASS (v1.22), so its stages
  # share the image job's cache volumes for the same trust class. They do not
  # trim: they run on the same runner label, so the image job's trim step
  # bounds the volumes on every host they reach.
  netfault:
    name: Network partitions [build tag quicraft_netfault, toolchain image]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.preflight.outputs.verdict == 'run' }}
    needs: [image, integration, preflight]
    timeout-minutes: 90      # hosted runner: a cold toolchain image build, then the suite (6 h cap)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"

      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # The only tests that construct a live leader deposed by a quorum it
      # cannot reach; everything else stops nodes outright. The suite asserts
      # its faults are installed, so a missing build tag fails the job.
      - name: make ci-netfault
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-netfault

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # The WAL under injected I/O failures.
  errfs:
    name: ErrorFS injection [build tag quicraft_errfs, toolchain image]
    runs-on: ubuntu-latest
    # v1.26: never on a draft PR, ci:full or not. v1.29.3, v1.30: only on the
    # schedule guard's `run`.
    needs: [preflight]
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
