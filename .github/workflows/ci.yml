  # The 0-RTT replay policy, the one suite run without -race.
  zero-rtt:
    name: 0-RTT replay policy [no -race, toolchain image]
    runs-on: ubuntu-latest
    # v1.26: never on a draft PR, ci:full or not. v1.29.3, v1.30: only on the
