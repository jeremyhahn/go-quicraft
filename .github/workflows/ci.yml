    # v1.26: never on a draft PR, ci:full or not. v1.29.3, v1.30: only on the
    # schedule guard's `run`.
    needs: [preflight]
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 60      # hosted runner: a cold toolchain image build, then the builds (6 h cap)
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 is the second 64-bit production target. linux/386
        # catches untyped constants that overflow int on 32-bit, which often
        # hide in test files, so this vets as well as builds. windows, darwin
        # and freebsd catch Unix-only syscalls and build constraints that
        # leave a symbol undefined on one OS.
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # Builds and vets every module (MODULE_FLOOR) for the platform. The
      # nested modules' dependencies are fetched, so the step has a network.
      - name: make ci-cross for ${{ matrix.goos }}/${{ matrix.goarch }}
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make ci-cross CROSS_PLATFORMS=$PLATFORM"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # Every module in the tree, discovered rather than declared.
