name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.6"
  COVERAGE_THRESHOLD: 91
  # Builds never resolve through a workspace: modules come from tags
  # (dependency-resolution.md §2). CI checks out this repo alone so no go.work
  # exists here today, but the module matrix below walks into nested modules
  # that a developer's workspace does cover, and a stray go.work landing in the
  # tree would silently change what every job compiles. Same rationale as
  # `export GOWORK=off` in the Makefile and the GOWORK=off in release.yml.
  GOWORK: "off"

jobs:
  # lint / security / trivy live in quality.yml so the RELEASE pipeline runs
  # the identical gates. They were defined here, and release.yml never called
  # them: a tag push ran no gosec, govulncheck, Trivy, gofmt, vet or lint at
  # all. See quality.yml.
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    with:
      go-version: "1.26.6"


  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build ./...

      - name: Build FIPS variant
        run: |
          GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

  # The untagged suite. Every job below this one exists because `go test ./...`
  # with NO build tags silently excludes whole test suites: the Go toolchain
  # does not warn that a constrained file was skipped, it simply compiles a
  # smaller program. In this repository that hid, by construction,
  #   * 147 test functions behind `//go:build integration` in test/integration/
  #     — every multi-node, election, partition, snapshot-catch-up and
  #     linearizability test there is,
  #   * 21 fault-injection tests behind `quicraft_errfs`,
  #   * 35 fuzz targets behind `quicraft_fuzz`,
  # and the COVERAGE_THRESHOLD below was being computed over the remainder.
  # `go vet` passes under each tag, so the excluded code could rot semantically
  # with nothing in CI noticing.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [quality, build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run tests with coverage
        run: |
          go test -race -count=1 -timeout=900s -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) -eq 1 ]; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

  # ==========================================================================
  # Tagged suites
  #
  # These three gate a PR rather than running nightly. The trade is CI latency
  # against the class of bug each one catches, and for a consensus engine that
  # four other repositories depend on the latency loses:
  #
  #   integration  ~9 min. It is the ONLY thing in CI that starts more than one
  #                node, holds an election, partitions a cluster or streams a
  #                snapshot. A merge that breaks leader election is not a defect
  #                to find the next morning, it is a defect that must never
  #                reach main. 9 min also fits inside the 30 min the `test` job
  #                was already budgeted, so the pipeline's critical path is
  #                unchanged (it runs in parallel with `test`).
  #   errfs        seconds. Fault injection on the WAL write path. No excuse.
  #   fuzz-seeds   seconds. Runs every fuzz target against its f.Add seeds and
  #                the committed corpus under pkg/*/testdata/fuzz/. This is a
  #                deterministic regression test, NOT fuzzing.
  #
  # Mutation fuzzing (`-fuzz`, unbounded and nondeterministic) is deliberately
  # NOT here: a newly discovered crash would fail an unrelated PR at random.
  # It runs on a schedule in fuzz.yml, and both it and all three jobs below are
  # required before a tag can publish (see release.yml).
  #
  # Keep each command byte-identical to the matching `ci-*` target in the
  # Makefile; `make ci-full` is how a developer reproduces this locally.
  # ==========================================================================

  integration:
    name: Integration [build tag integration]
    runs-on: ubuntu-latest
    # `needs: test` is for ISOLATION, not ordering: it keeps the two heaviest
    # jobs off the runner at the same time. Each of these jobs already
    # serialises internally with -p 1 because concurrent multi-node QUIC
    # packages under -race starve each other — but nothing was stopping the
    # JOBS from overlapping, and on a 20-core self-hosted runner they did. In
    # run 418, Integration (547s) overlapped the full unit suite (188s) AND
    # contrib/dragonboat's own multi-node integration suite (130s), and a 30s
    # snapshot-catch-up wait expired inside that window. The run before it lost
    # a 30s rolling-restart wait the same way. Neither reproduces on a quiet
    # machine — the rolling-restart case survived thirty local runs, twenty of
    # them under deliberate twenty-way CPU contention.
    #
    # This serialises the three heavy jobs and costs a few minutes of wall
    # clock. The short jobs (errfs, fuzz seeds) stay parallel; they finish in
    # seconds and contend with nothing.
    needs: [quality, build, test]
    # 45, not 30: the suite is ~9 min on a quiet machine but every package runs
    # under -race with -p 1, so a loaded runner stretches it considerably. The
    # -timeout=1800s below is the real budget; this is only the outer backstop.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # -p 1 is load-bearing, not caution. Each of the four packages spins up
      # multi-node QUIC clusters under -race; running them concurrently starves
      # runner CPU enough that the snapshot catch-up tests (30s waits) flake.
      # Every package is stable standalone. Do not drop it to shorten the job.
      - name: Run integration suite
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  errfs:
    name: ErrorFS injection [build tag quicraft_errfs]
    runs-on: ubuntu-latest
    needs: [quality, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # -race is kept: these tests drive the WAL through injected I/O failures
      # from concurrent goroutines, which is precisely where a torn recovery
      # path shows up as a race rather than as a wrong answer.
      - name: Run errfs suite
        run: go test -race -count=1 -tags=quicraft_errfs ./test/errfs/...

  fuzz-seeds:
    name: Fuzz seeds [build tag quicraft_fuzz]
    runs-on: ubuntu-latest
    needs: [quality, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # -run=Fuzz without -fuzz executes each target once per seed and once per
      # file in its testdata/fuzz/<Target>/ corpus, then exits. That proves the
      # 35 targets still COMPILE under the tag and still pass every input a
      # previous fuzzing run found interesting — which is the part of fuzzing
      # that belongs in a PR gate.
      - name: Run fuzz targets against seeds and committed corpus
        run: go test -race -count=1 -tags=quicraft_fuzz -run=Fuzz ./...

  # ==========================================================================
  # Multi-module build
  #
  # This repository is not one Go module. The root module plus contrib/ and the
  # benchmark harnesses under test/performance/ are separately versioned, and
  # every one of them `replace`s or requires the root. Building only the root
  # meant a root-module change could break a sibling silently: contrib/dragonboat
  # sat broken because its `go 1.26.5` directive was below what the parent it
  # replaces requires, and nothing in CI compiled it.
  #
  # The module list is DISCOVERED, not declared, so adding a go.mod anywhere in
  # the tree enrolls it automatically. A static list would drift back into
  # exactly the state this job exists to prevent.
  #
  # This was a `discover-modules` job feeding
  # `matrix: ${{ fromJSON(needs.discover-modules.outputs.modules) }}`, and it
  # never ran. The runner does not expand a matrix sourced from another job's
  # output, so it scheduled ONE job literally named `Module ${{ matrix.module }}`
  # whose `working-directory` interpolated to the empty string — the repository
  # root. Every run since was green because it built the root module a second
  # time and not one of the five nested modules; the first honest run of the
  # equivalent loop in release.yml failed on the first tag. A shell loop
  # expands identically on every runner, and MODULE_FLOOR makes a repeat of
  # that silent collapse fail the job instead of passing it.
  # ==========================================================================

  modules:
    name: Nested module build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # GOWORK=off (workflow env) matters most here: with a workspace active
      # these modules resolve the root through the workspace and the `go`
      # directive mismatch that broke contrib/dragonboat would not reproduce.
      - name: Build and vet every module in the tree
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          # Collected rather than fail-fast: one broken sibling must not hide
          # a second one. This is what `fail-fast: false` did for the matrix.
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            # `go vet -tags=benchmark` as well as the untagged pass. Three
            # benchmark_test.go files under test/performance/ sit behind
            # //go:build benchmark, and NOTHING passed that tag anywhere —
            # not the Makefile, not this workflow — so they were never
            # compiled OR vetted and could rot to a build error with CI green.
            # That is the exact failure this job's own comment exists to
            # prevent, one build tag over.
            #
            # `go test ./...` runs the 114 test functions in
            # test/performance/perfresult and benchutil, which gate
            # `make bench-compare` — the RELEASE performance comparison. They
            # were only built and vetted, never run, so a regression in the
            # comparison logic would silently pass or fail that gate.
            # The ROOT module is built and vetted here but NOT tested: it has
            # its own `test` job with -race, the UDP tuning the QUIC tests
            # need, and the coverage gate. Running its suite again here ran it
            # CONCURRENTLY with that job and reintroduced exactly the runner
            # contention the `needs:` chain on `integration` exists to prevent
            # — a timing-sensitive assertion in TestStartShard_FreshStart_NoSeed
            # (it reads ns.lastApplied straight after StartShard, while the
            # index-1 membership entry is still being applied) lost the race
            # and failed a job that had found nothing wrong.
            TEST_CMD="true"
            if [ "${dir}" != "." ]; then
              TEST_CMD="go test -count=1 ./..."
            fi
            if ! (cd "${dir}" && go build ./... && go vet ./... \
                  && go vet -tags=benchmark ./... \
                  && eval "${TEST_CMD}"); then
              FAILED="${FAILED} ${dir}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: module(s) did not build or vet cleanly:${FAILED}"
            exit 1
          fi

  # ==========================================================================
  # contrib/dragonboat test suites
  #
  # The `modules` matrix above only BUILDS and VETS every nested module. That
  # left contrib/dragonboat's ~560 tests — including a full integration suite
  # that starts multi-node QUIC clusters through the dragonboat compatibility
  # API — running nowhere at all: the adapter could regress in any way that
  # still compiles and CI stayed green.
  #
  # This job is deliberately separate from the matrix rather than a `go test`
  # step added to it. The other nested modules (test/performance/*) are
  # benchmark harnesses with no test functions worth gating a PR on, and the
  # integration suite needs the UDP tuning and the -p 1 the matrix does not.
  #
  # Keep each command byte-identical to the matching `ci-*` target in
  # contrib/dragonboat/Makefile.
  # ==========================================================================

  contrib-dragonboat:
    name: contrib/dragonboat [unit + integration]
    runs-on: ubuntu-latest
    # Last of the three heavy jobs; see the note on `integration`. This one
    # stands up multi-node QUIC clusters through the dragonboat compatibility
    # API, so running it beside the main integration suite is the same mistake
    # twice.
    needs: [quality, build, integration]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run contrib/dragonboat unit tests
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -timeout=900s ./...

      # -p 1 is load-bearing, not caution: every package here spins up
      # multi-node QUIC clusters under -race, and running them concurrently
      # starves runner CPU enough to flake the tests with 30s waits.
      - name: Run contrib/dragonboat integration suite
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...
