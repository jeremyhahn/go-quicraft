      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # contrib/ and the benchmark harnesses under test/performance/ are separate
      # Go modules that replace or require the root, so a root change can break
      # them. The module list is discovered, and MODULE_FLOOR fails the target
      # if discovery comes back short. Their dependencies are fetched.
      - name: make ci-modules
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-modules

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # The Dragonboat-compatible API module, its own Go module.
  contrib-dragonboat:
    name: contrib/dragonboat [unit + integration, toolchain image]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.preflight.outputs.verdict == 'run' }}
    needs: [integration, preflight]
    timeout-minutes: 60      # hosted runner: a cold toolchain image build, then the suite (6 h cap)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the image
      # builds and the stages' caches need. It is a fresh VM per job, so
      # nothing removed here is shared: the .NET, Android and GHC toolchains
      # and the preloaded images free well over 20 GB.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Tune QUIC UDP buffers
        run: |
          sudo -n sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032 \
            || echo "::warning::could not raise the UDP buffer limits; quic-go runs with the kernel default"

      # v1.30 (fix 1): the registry cache first; a miss builds it below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: contrib/dragonboat unit tests
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -C contrib/dragonboat ci-test"

      # -p 1 is required: every package here starts multi-node QUIC clusters
      # under -race, and running them concurrently flakes the 30s waits.
      - name: contrib/dragonboat integration suite
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -C contrib/dragonboat ci-integration"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

