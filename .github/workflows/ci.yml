# ci-template: v1.9 (customized) — staged fail-fast pipeline.
#
# v1.9 (2026-08-20, owner ruling — FAIL-FAST STAGED PIPELINE, adopted here via
# go-quicraft#22): a fast tier (lint + build, ~minutes) gates the expensive
# tier (security, test, integration, netfault, errfs, fuzz-seeds,
# contrib-dragonboat): a broken push reports in minutes and burns nothing
# downstream; a green push pays one fast-tier of extra latency. Ordering and
# the `concurrency:` block below are complementary, not alternatives —
# ordering stops a BROKEN push from spending the expensive tier, cancellation
# stops a SUPERSEDED push from spending anything at all. `fips` and `trivy`
# move to nightly.yml (schedule +
# workflow_dispatch, gating nothing): both were known-red on every push here
# (fips: go-quicraft#24's runner-contention flake under GODEBUG=fips140=on;
# trivy: shared the same class of concern portfolio-wide), and a known-red job
# burning tens of runner-minutes per push verifies nothing.
#
# `quality.yml` (the old lint+security+trivy reusable workflow, called by both
# this file and release.yml) is RETIRED by this change. A workflow_call is one
# opaque unit from the caller's perspective — `needs: quality` waited for
# lint, security AND trivy together, so nothing downstream could ever start
# before the slowest of the three finished. That defeats the entire point of
# staged fail-fast: lint and security are flattened directly into this file
# instead, matching the template, so `needs: [lint, build]` genuinely gates on
# the FAST tier alone. release.yml gained its own inline lint/security/trivy
# steps in the same change, so a tag push keeps exactly the gates it had
# before, without the now-removed indirection.
#
# CUSTOMIZE blocks preserved from the pre-v1.9 file: the `integration` /
# `netfault` / `errfs` / `fuzz-seeds` tagged-suite jobs, the `modules`
# nested-module matrix, and `contrib-dragonboat` (now BLOCKING — go-quicraft#3
# re-armed the gate on 2026-08-21 after both defects that justified the
# report-only flag were fixed and the suite was measured stable under load;
# see that job's own comment for the evidence).
# `integration`/`netfault`/`contrib-dragonboat` also keep their EXTRA
# self-imposed `needs: [..., test]` / `needs: [..., integration]` ordering on
# top of the fast-tier gate: multiple multi-node QUIC suites under `-race`
# starve a contended runner if they overlap (see each job's own comment),
# which is a repo-specific constraint the vanilla template does not have.
#
# Source of truth: software/templates/github-actions/ci.yml in the
# automatethethings repo (v1.9, commit 2732bc0). Pushed directly per the
# workflow/CI-configuration carve-out (conventions/sdlc.md §"What requires a
# PR").

name: CI

on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created

# Cancel superseded runs (go-quicraft#166). The runner pool is `capacity: 3`
# for the WHOLE portfolio, so a run whose head has already moved on is a slot
# no other repo can use — this one took 29 runs on `ci.yml@refs/heads/main` in
# a five-hour window. Measured working on Gitea 1.27.1 (older run cancelled,
# newest completes); piloted in go-truststrap#49.
#
# Three things this shape gets right, each of which has been got wrong:
#
#   - Keyed on the REF, so a branch supersedes only itself. e61a9d3 ("ci: drop
#     concurrency from workflows") removed a block keyed on
#     `${{ github.repository }}` with NO ref component and
#     `cancel-in-progress: false`, at JOB level, on task-worker.yml: every
#     worker shared one group, and Gitea cannot QUEUE, so siblings that could
#     not cancel each other saturated it. That is not evidence about this.
#   - The literal `true`. `cancel-in-progress` does not evaluate expressions on
#     1.27.1 — any non-empty value is truthy, so `${{ ... }}` here would mean
#     `true` whatever it rendered.
#   - Workflow level, not per-job, so the whole superseded pipeline goes.
#
# There is still no `cancel` REST route on this Gitea (checked against
# swagger.v1.json), which is exactly why `concurrency:` is the only mechanism:
# nothing can cancel a run after the fact, so the successor does it on arrival.
# `ci-gate` below correctly treats `cancelled` as not-`success`; that cannot
# block a merge, because the required context is `CI / CI Gate (pull_request)`
# and a cancellation only lands on a superseded sha the head has moved past.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # Pinned to an EXACT patch, never "stable" — that alias flipped to 1.27.0
  # mid-campaign and broke every repo riding it (issue #23).
  #
  # 1.27.0 since the toolchain wave landed (issue #19, owner ruling 2026-09-03).
  # The swiss compile failure that held the portfolio at 1.26 was cleared
  # upstream on 2026-08-20; what actually forced the move here is go-enclave
  # v0.5.0-alpha, whose own `go` directive is 1.27.0, so this repository could
  # not consume the sealing seam and stay behind.
  #
  # The `go` directive in every go.mod moved WITH this, which it did not use to.
  # It is the LANGUAGE FLOOR embedders must satisfy and was deliberately kept
  # looser than the toolchain CI tests with — but a floor cannot sit below a
  # dependency's own, and Go evaluates the language version from the MAIN
  # module, so a nested module left behind fails with "module ../.. requires
  # go >= 1.27.0" rather than upgrading. All six move together or none do.
  GO_VERSION: "1.27.0"
  # Lowered 91 -> 90 on the owner's ruling, 2026-09-02, for a reason that is
  # about SIGNAL rather than standards. Measured total is 91.3%, so the old gate
  # left 0.30 points of headroom — and a `go test ./...` run where any package
  # FAILS contributes NO coverage for that package. One flaked test therefore
  # failed CI twice: once on the test result, and again as a "coverage
  # regression" that did not exist. A gate that cannot absorb a single package's
  # variance reports a fault it invented, and trains readers to disbelieve it.
  #
  # This does not license a decline. 90 is a floor, not a target; the measured
  # figure stays above 91 and the flakes it was masking are tracked at #71.
  COVERAGE_THRESHOLD: 90
  # Builds never resolve through a workspace: modules come from tags
  # (dependency-resolution.md §2). CI checks out this repo alone so no go.work
  # exists here today, but the module matrix below walks into nested modules
  # that a developer's workspace does cover, and a stray go.work landing in the
  # tree would silently change what every job compiles. Same rationale as
  # `export GOWORK=off` in the Makefile and the GOWORK=off in release.yml.
  GOWORK: "off"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The analysis tools are BAKED INTO THE RUNNER IMAGE at pinned versions
      # (`/etc/ci-runner-tools.txt`; the image build fails closed if any tool's
      # self-report disagrees with its pin), so there is nothing to install.
      #
      # This replaces `go install` steps that fetched over the network at job
      # time. They were a live flake, not a theoretical one: DNS returns an AAAA
      # record for sum.golang.org and the runner hosts have no default IPv6
      # route, so the fallback occasionally fails to complete and the install
      # dies with ENETUNREACH. Each had grown a hand-rolled 3-attempt retry loop
      # — the flake worked around locally instead of removed. Two of the three
      # also installed `@latest`, so a scan could not be attributed to a scanner
      # version at all (gosec@latest self-reports "dev").
      #
      # THIS STEP IS PER-JOB ON PURPOSE. Each job gets its own runner, and
      # nothing guarantees two jobs land on the same machine or the same image
      # instance. A verification performed in `lint` says nothing about the
      # environment `security` actually runs its scanners in — that job could
      # find no tool at all, or a different version, with the assertion never
      # applying. So every job asserts exactly the tools it itself runs.
      #
      # To change a version, do NOT add a `go install` back: ask agent-company
      # to rebuild the image, then update the pins here and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in golangci-lint; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check golangci-lint v2.13.2 "$(modver golangci-lint)"
          exit $rc

      # THE PUBLIC GITHUB MIRROR is a different machine entirely. There
      # `ubuntu-latest` resolves to GitHub's stock Ubuntu image, which bakes none
      # of these, so the verification above would fail before any analysis ran
      # and the mirror's CI would be a false negative on every push. Provision
      # them there, at the SAME pins, so the mirror gates on the same rule set.
      #
      # No retry loop, deliberately: the flake these steps were removed for is
      # the AAAA-record/no-IPv6-route defect on OUR runner hosts, which is not a
      # property of GitHub-hosted runners. Re-adding a retry here would be
      # cargo-culting a workaround into the one environment that never had the
      # problem.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST (v1.9): gated on the fast tier like test/integration —
    # a push that cannot lint or build should not spend a heavy gosec/
    # govulncheck pass.
    needs: [lint, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6


      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The analysis tools are BAKED INTO THE RUNNER IMAGE at pinned versions
      # (`/etc/ci-runner-tools.txt`; the image build fails closed if any tool's
      # self-report disagrees with its pin), so there is nothing to install.
      #
      # This replaces `go install` steps that fetched over the network at job
      # time. They were a live flake, not a theoretical one: DNS returns an AAAA
      # record for sum.golang.org and the runner hosts have no default IPv6
      # route, so the fallback occasionally fails to complete and the install
      # dies with ENETUNREACH. Each had grown a hand-rolled 3-attempt retry loop
      # — the flake worked around locally instead of removed. Two of the three
      # also installed `@latest`, so a scan could not be attributed to a scanner
      # version at all (gosec@latest self-reports "dev").
      #
      # THIS STEP IS PER-JOB ON PURPOSE. Each job gets its own runner, and
      # nothing guarantees two jobs land on the same machine or the same image
      # instance. A verification performed in `lint` says nothing about the
      # environment `security` actually runs its scanners in — that job could
      # find no tool at all, or a different version, with the assertion never
      # applying. So every job asserts exactly the tools it itself runs.
      #
      # To change a version, do NOT add a `go install` back: ask agent-company
      # to rebuild the image, then update the pins here and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in gosec govulncheck; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check gosec        v2.29.0 "$(modver gosec)"
          check govulncheck  v1.7.0  "$(modver govulncheck)"
          exit $rc

      # THE PUBLIC GITHUB MIRROR is a different machine entirely. There
      # `ubuntu-latest` resolves to GitHub's stock Ubuntu image, which bakes none
      # of these, so the verification above would fail before any analysis ran
      # and the mirror's CI would be a false negative on every push. Provision
      # them there, at the SAME pins, so the mirror gates on the same rule set.
      #
      # No retry loop, deliberately: the flake these steps were removed for is
      # the AAAA-record/no-IPv6-route defect on OUR runner hosts, which is not a
      # property of GitHub-hosted runners. Re-adding a retry here would be
      # cargo-culting a workaround into the one environment that never had the
      # problem.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Writes SARIF (uploaded below) and still exits non-zero on findings to
      # gate the build. Tests, examples and contrib adapters are excluded.
      #
      # Every -exclude rule below was checked against the code; record the
      # reason here so the next person does not have to re-derive it. Keep this
      # list identical to GOSEC_EXCLUDE in the Makefile.
      #   G103 unsafe: the proto codec is a fixed-layout zero-copy encoding.
      #   G104 unhandled error: fires on hash.Write, which never returns one.
      #   G115 integer overflow on conversion: the conversions it flags sit
      #        behind an explicit bounds check on the same value (frame and
      #        entry sizes are validated against MaxFrameSize /
      #        MaxReplicationPayloadBytes before the narrowing conversion).
      #        NOT a blanket "we accept overflow" — a NEW conversion without a
      #        preceding bound is a real finding this exclusion will hide, so
      #        review narrowing conversions by hand.
      #   G301/G306 file and directory permissions: 0755/0644 on data
      #        directories and data files is the intended posture; secret
      #        material is written 0600 explicitly.
      #   G304 file inclusion via variable: every snapshot/WAL path is
      #        constructed internally from (shard, replica, index), never from
      #        a request.
      #   G404 weak random: false positive. The only math/rand use is election
      #        jitter in pkg/internal/raft/raft.go, and newRaft seeds it from
      #        crypto/rand. Jitter must be fast and unpredictable-enough to
      #        desynchronize campaigns; it is not a security primitive.
      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec.sarif -exclude=G103,G104,G115,G301,G304,G306,G404 -exclude-dir=test -exclude-dir=examples -exclude-dir=contrib -severity=medium -confidence=medium ./...

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        run: govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build ./...

      - name: Build FIPS variant
        run: |
          GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

  # The untagged suite. Every job below this one exists because `go test ./...`
  # with NO build tags silently excludes whole test suites: the Go toolchain
  # does not warn that a constrained file was skipped, it simply compiles a
  # smaller program. In this repository that hid, by construction,
  #   * 147 test functions behind `//go:build integration` in test/integration/
  #     — every multi-node, election, partition, snapshot-catch-up and
  #     linearizability test there is,
  #   * 21 fault-injection tests behind `quicraft_errfs`,
  #   * 35 fuzz targets behind `quicraft_fuzz`,
  # and the COVERAGE_THRESHOLD below was being computed over the remainder.
  # `go vet` passes under each tag, so the excluded code could rot semantically
  # with nothing in CI noticing.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # THREE STEPS, NOT ONE, AND THE SPLIT IS THE POINT (#81).
      #
      # This job used to run the suite and gate coverage in a single step, so it
      # reported one undifferentiated "failure" for three unrelated conditions: a
      # real regression, a flaked test, or a coverage shortfall. Worse, the three
      # were not independent — a `go test ./...` run where any package FAILS
      # contributes NO coverage for that package, so one flake in a large package
      # failed the step twice: once on the test result, and again as a "coverage
      # regression" that did not exist. A gate that reports a fault it invented
      # teaches readers to discount it.
      #
      # It also cost real diagnosis time. The runner's logs are NOT reachable
      # from an agent token on this Gitea (`actions/{tasks,runs,jobs}/<id>/logs`
      # all answer 404), so an agent seeing "CI / Test: failure" could not learn
      # which test failed; one occurrence on 2026-09-02 is permanently
      # unattributable for that reason. Hence: classify in-band, print the failing
      # test names into the job output, and upload the log as an artifact.
      #
      # continue-on-error on the run step is load-bearing: it lets the classify
      # step below decide the verdict instead of the job dying with a bare status.
      # The classify step is what fails the job, and because a failed step stops
      # the ones after it, the coverage gate CANNOT run on a broken suite — which
      # is what stops a test failure masquerading as a coverage regression.
      - name: Run tests with coverage
        id: gotest
        continue-on-error: true
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=900s -coverprofile=coverage.out ./... 2>&1 | tee test-output.log

      - name: Classify the test result
        run: |
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            echo "VERDICT: TESTS_PASSED"
            exit 0
          fi
          echo "VERDICT: TEST_FAILURE"
          echo "----- failing tests -----"
          grep -E '^--- FAIL|^FAIL[[:space:]]' test-output.log | head -40 \
            || echo "(no '--- FAIL' lines: the run panicked, timed out, or failed to build)"
          echo "----- panics, races and timeouts -----"
          grep -nE 'panic:|test timed out|DATA RACE|build failed' test-output.log | head -20 || true
          echo
          echo "The full log is attached to this run as the 'test-output' artifact."
          exit 1

      # Reached only when the suite passed, so COVERAGE is computed over a
      # complete profile and a shortfall here means what it says.
      #
      # The guards around the comparison mirror check-coverage in the Makefile,
      # and for the same reason: with an empty or missing profile COVERAGE is
      # the empty string, bc fails and prints nothing, the test degenerates to
      # `[ -eq 1 ]`, and the shell error sends the if down the else branch — so
      # the gate used to PASS exactly when it had no coverage data to judge.
      - name: Gate on coverage
        run: |
          if [ ! -s coverage.out ]; then
            echo "VERDICT: NO_COVERAGE_DATA"
            echo "FAIL: coverage.out is missing or empty; the test run produced no coverage data"
            exit 1
          fi
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          case "${COVERAGE}" in
            '' | *[!0-9.]* )
              echo "VERDICT: NO_COVERAGE_DATA"
              echo "FAIL: coverage could not be read from coverage.out (got '${COVERAGE}')"
              exit 1 ;;
          esac
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) -eq 1 ]; then
            echo "VERDICT: COVERAGE_BELOW_THRESHOLD"
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
          echo "VERDICT: COVERAGE_OK"

      # always(), not failure(): a passing run's log is what you compare the next
      # failure against.
      #
      # GUARDED TO github.com, and this is the same lesson fuzz.yml already
      # carries: actions/upload-artifact@v4 refuses to run against a
      # non-github.com server (devops.md §1) and this Gitea runner serves no
      # artifact endpoint at all, so the step emits `::error::Failed to
      # CreateArtifact ... ECONNREFUSED` and exits 1. Under `if: always()` that
      # failed EVERY Test job on the dev runner, including runs whose own output
      # said `VERDICT: TESTS_PASSED` and `VERDICT: COVERAGE_OK` — it broke main
      # at aca95e7 (run 10459) and every PR opened after it. An upload step must
      # never be the thing that decides whether the suite passed.
      #
      # What the artifact was for is not lost here. The classify step above
      # prints the `--- FAIL` lines and the panic/race/timeout greps into the JOB
      # LOG, which the Gitea API serves at
      # /api/v1/repos/:owner/:repo/actions/jobs/:id/logs — reachable by an agent
      # without an artifact endpoint. The upload adds retention and the full
      # untruncated file where the server supports it, and adds nothing where it
      # does not.
      - name: Upload the test log
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14
          if-no-files-found: warn

  # ==========================================================================
  # Tagged suites
  #
  # These three gate a PR rather than running nightly. The trade is CI latency
  # against the class of bug each one catches, and for a consensus engine that
  # four other repositories depend on the latency loses:
  #
  #   integration  ~9 min. It is the ONLY thing in CI that starts more than one
  #                node, holds an election, partitions a cluster or streams a
  #                snapshot. A merge that breaks leader election is not a defect
  #                to find the next morning, it is a defect that must never
  #                reach main. 9 min also fits inside the 30 min the `test` job
  #                was already budgeted, so the pipeline's critical path is
  #                unchanged (it runs in parallel with `test`).
  #   errfs        seconds. Fault injection on the WAL write path. No excuse.
  #   fuzz-seeds   seconds. Runs every fuzz target against its f.Add seeds and
  #                the committed corpus under pkg/*/testdata/fuzz/. This is a
  #                deterministic regression test, NOT fuzzing.
  #
  # Mutation fuzzing (`-fuzz`, unbounded and nondeterministic) is deliberately
  # NOT here: a newly discovered crash would fail an unrelated PR at random.
  # It runs on a schedule in fuzz.yml, and both it and all three jobs below are
  # required before a tag can publish (see release.yml).
  #
  # Keep each command byte-identical to the matching `ci-*` target in the
  # Makefile; `make ci-full` is how a developer reproduces this locally.
  # ==========================================================================

  integration:
    name: Integration [build tag integration]
    runs-on: ubuntu-latest
    # `needs: test`, on top of the fast-tier gate, is for ISOLATION, not
    # ordering: it keeps the two heaviest jobs off the runner at the same
    # time. Each of these jobs already serialises internally with -p 1
    # because concurrent multi-node QUIC packages under -race starve each
    # other — but nothing was stopping the JOBS from overlapping, and on a
    # 20-core self-hosted runner they did. In run 418, Integration (547s)
    # overlapped the full unit suite (188s) AND contrib/dragonboat's own
    # multi-node integration suite (130s), and a 30s snapshot-catch-up wait
    # expired inside that window. The run before it lost a 30s
    # rolling-restart wait the same way. Neither reproduces on a quiet
    # machine — the rolling-restart case survived thirty local runs, twenty
    # of them under deliberate twenty-way CPU contention.
    #
    # This serialises the three heavy jobs and costs a few minutes of wall
    # clock. The short jobs (errfs, fuzz seeds) stay parallel; they finish in
    # seconds and contend with nothing.
    needs: [lint, build, test]
    # 45, not 30: the suite is ~9 min on a quiet machine but every package runs
    # under -race with -p 1, so a loaded runner stretches it considerably. The
    # -timeout=1800s below is the real budget; this is only the outer backstop.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # -p 1 is load-bearing, not caution. Each of the four packages spins up
      # multi-node QUIC clusters under -race; running them concurrently starves
      # runner CPU enough that the snapshot catch-up tests (30s waits) flake.
      # Every package is stable standalone. Do not drop it to shorten the job.
      - name: Run integration suite
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  netfault:
    name: Network partitions [build tag quicraft_netfault]
    runs-on: ubuntu-latest
    # Serialised behind the same three heavy jobs as `integration`, and for the
    # same reason: these stand up 3-to-5-node QUIC clusters under -race and wait
    # on election timeouts, so a contended runner turns a real timing assertion
    # into a flake.
    needs: [lint, build, test, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # These are the only tests in the repository that can construct a LIVE
      # leader deposed by a quorum it cannot reach. Everything else calls
      # stopNode, which is a process kill. Without this lane, weakening the
      # election quorum from a strict majority to n/2 passed 18 of 19
      # linearizability tests.
      #
      # The suite asserts its own faults are installed, so a missing build tag
      # fails the job rather than silently testing a healthy cluster.
      - name: Run network-partition suite
        run: make ci-netfault

  errfs:
    name: ErrorFS injection [build tag quicraft_errfs]
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # -race is kept: these tests drive the WAL through injected I/O failures
      # from concurrent goroutines, which is precisely where a torn recovery
      # path shows up as a race rather than as a wrong answer.
      - name: Run errfs suite
        run: go test -race -count=1 -tags=quicraft_errfs ./test/errfs/...

  zero-rtt:
    name: 0-RTT replay policy [no -race]
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The ONLY job that drops -race, and it drops it for one reason: the
      # detector fires on quic-go's own client connection, which
      # TestSnapshotOver0RTTRejected must drive through DialAddrEarly to make
      # its bytes early data. quic-go writes Conn.peerParams from the
      # connection's run goroutine (connection.go:2375) and reads it when a
      # stream is opened (connection.go:2932) with nothing guarding the
      # field; v0.62.0 is the newest release and the field is private, so the
      # race is neither fixable nor synchronizable from here (#199). No
      # production path is exposed: dialConnection uses Dial, never
      # DialEarly, and Enable0RTT is default-off.
      #
      # Without this job the policy would go untested everywhere, since every
      # other test command in this file and in the Makefile uses -race. The
      # test itself skips under the detector, so `-run` matching it in the
      # race-enabled Test job is a no-op rather than a duplicate.
      - name: Run the 0-RTT tests without the race detector
        run: go test -count=1 -run '0RTT' ./pkg/internal/transport/

  fuzz-seeds:
    name: Fuzz seeds [build tag quicraft_fuzz]
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # -run=Fuzz without -fuzz executes each target once per seed and once per
      # file in its testdata/fuzz/<Target>/ corpus, then exits. That proves the
      # 35 targets still COMPILE under the tag and still pass every input a
      # previous fuzzing run found interesting — which is the part of fuzzing
      # that belongs in a PR gate.
      - name: Run fuzz targets against seeds and committed corpus
        run: go test -race -count=1 -tags=quicraft_fuzz -run=Fuzz ./...

  # ==========================================================================
  # Multi-module build
  #
  # This repository is not one Go module. The root module plus contrib/ and the
  # benchmark harnesses under test/performance/ are separately versioned, and
  # every one of them `replace`s or requires the root. Building only the root
  # meant a root-module change could break a sibling silently: contrib/dragonboat
  # sat broken because its `go 1.26.5` directive was below what the parent it
  # replaces requires, and nothing in CI compiled it.
  #
  # The module list is DISCOVERED, not declared, so adding a go.mod anywhere in
  # the tree enrolls it automatically. A static list would drift back into
  # exactly the state this job exists to prevent.
  #
  # This was a `discover-modules` job feeding
  # `matrix: ${{ fromJSON(needs.discover-modules.outputs.modules) }}`, and it
  # never ran. The runner does not expand a matrix sourced from another job's
  # output, so it scheduled ONE job literally named `Module ${{ matrix.module }}`
  # whose `working-directory` interpolated to the empty string — the repository
  # root. Every run since was green because it built the root module a second
  # time and not one of the five nested modules; the first honest run of the
  # equivalent loop in release.yml failed on the first tag. A shell loop
  # expands identically on every runner, and MODULE_FLOOR makes a repeat of
  # that silent collapse fail the job instead of passing it.
  # ==========================================================================

  # ==========================================================================
  # CROSS-ARCHITECTURE BUILD
  #
  # Every job in this workflow runs on amd64, and nothing here had ever
  # compiled this tree for anything else. #102 is what that cost: shamir's
  # MaxShareSetBytes was a fixed byte count derived for a 4 KiB page, so the
  # primitive's headline operation -- the 255-share split of a root key -- was
  # REFUSED on a 16 KiB- or 64 KiB-page host. RHEL and CentOS Stream arm64
  # kernels ship 64 KiB pages, and it fails at a recovery ceremony, which is
  # the worst possible moment to discover it.
  #
  # WHAT THIS JOB DOES AND DOES NOT CATCH, because the difference matters and a
  # job that is believed to cover more than it does is worse than none (see the
  # dependabot.yml note for the last time that happened here).
  #
  #   CATCHES: anything that fails to COMPILE or vet for the target -- a build
  #   tag that only exists for amd64, an assembly file, a type whose size is
  #   assumed, a syscall or cgo path that is not portable.
  #
  #   DOES NOT CATCH: a runtime value that differs by architecture. #102 itself
  #   would have compiled cleanly here. That class is caught by writing the
  #   test against the PARAMETER rather than the host -- shamir's budget test
  #   evaluates its derivation at 4 KiB, 16 KiB and 64 KiB and needs no arm64
  #   machine at all -- and that is the pattern to copy, not this job.
  #
  # Cross-compilation rather than an arm64 runner: no arm64 host is registered
  # with this Gitea, `go build` needs no emulation, and the alternative (QEMU)
  # would multiply every test's wall clock for a class this cannot see anyway.
  # If an arm64 runner is ever registered, running the fast tier on it
  # supersedes this job rather than joining it.
  # ==========================================================================

  cross-arch:
    name: Cross-architecture build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Same staged fail-fast as the rest: a push that cannot lint or build for
    # the host has nothing to say about another architecture.
    needs: [lint, build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # arm64 is the second 64-bit production target. 386 is the 32-bit
        # canary the security-review checklist names: an untyped constant
        # such as 2654435761 or 2*1024*1024*1024 in an int context compiles
        # on amd64 and fails here, and the test files are where they hide,
        # which is why this vets rather than only builds (#197).
        goarch: [arm64, "386"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same discovery loop and floor as the modules job, for the same
      # reason: a `find` that silently matches nothing would make this job pass
      # by checking an empty set.
      - name: Build and vet every module for linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s) for ${GOOS}/${GOARCH}:"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            ( cd "${dir}" && go build ./... && go vet ./... ) || FAILED="${FAILED} ${dir}"
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: ${GOOS}/${GOARCH} build or vet failed in:${FAILED}"
            exit 1
          fi
          echo "every module builds and vets for ${GOOS}/${GOARCH}"

  modules:
    name: Nested module build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # GOWORK=off (workflow env) matters most here: with a workspace active
      # these modules resolve the root through the workspace and the `go`
      # directive mismatch that broke contrib/dragonboat would not reproduce.
      - name: Build and vet every module in the tree
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          # Collected rather than fail-fast: one broken sibling must not hide
          # a second one. This is what `fail-fast: false` did for the matrix.
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            # `go vet -tags=benchmark` as well as the untagged pass. Three
            # benchmark_test.go files under test/performance/ sit behind
            # //go:build benchmark, and NOTHING passed that tag anywhere —
            # not the Makefile, not this workflow — so they were never
            # compiled OR vetted and could rot to a build error with CI green.
            # That is the exact failure this job's own comment exists to
            # prevent, one build tag over.
            #
            # `go test ./...` runs the 114 test functions in
            # test/performance/perfresult and benchutil, which gate
            # `make bench-compare` — the RELEASE performance comparison. They
            # were only built and vetted, never run, so a regression in the
            # comparison logic would silently pass or fail that gate.
            # The ROOT module is built and vetted here but NOT tested: it has
            # its own `test` job with -race, the UDP tuning the QUIC tests
            # need, and the coverage gate. Running its suite again here ran it
            # CONCURRENTLY with that job and reintroduced exactly the runner
            # contention the `needs:` chain on `integration` exists to prevent
            # — a timing-sensitive assertion in TestStartShard_FreshStart_NoSeed
            # (it reads ns.lastApplied straight after StartShard, while the
            # index-1 membership entry is still being applied) lost the race
            # and failed a job that had found nothing wrong.
            TEST_CMD="true"
            if [ "${dir}" != "." ]; then
              TEST_CMD="go test -count=1 ./..."
            fi
            if ! (cd "${dir}" && go build ./... && go vet ./... \
                  && go vet -tags=benchmark ./... \
                  && eval "${TEST_CMD}"); then
              FAILED="${FAILED} ${dir}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: module(s) did not build or vet cleanly:${FAILED}"
            exit 1
          fi

  # ==========================================================================
  # contrib/dragonboat test suites
  #
  # The `modules` matrix above only BUILDS and VETS every nested module. That
  # left contrib/dragonboat's ~560 tests — including a full integration suite
  # that starts multi-node QUIC clusters through the dragonboat compatibility
  # API — running nowhere at all: the adapter could regress in any way that
  # still compiles and CI stayed green.
  #
  # This job is deliberately separate from the matrix rather than a `go test`
  # step added to it. The other nested modules (test/performance/*) are
  # benchmark harnesses with no test functions worth gating a PR on, and the
  # integration suite needs the UDP tuning and the -p 1 the matrix does not.
  #
  # Keep each command byte-identical to the matching `ci-*` target in
  # contrib/dragonboat/Makefile.
  # ==========================================================================

  contrib-dragonboat:
    name: contrib/dragonboat [unit + integration]
    runs-on: ubuntu-latest
    # Last of the three heavy jobs; see the note on `integration`. This one
    # stands up multi-node QUIC clusters through the dragonboat compatibility
    # API, so running it beside the main integration suite is the same mistake
    # twice.
    needs: [lint, build, integration]
    # BLOCKING. This job was report-only (`continue-on-error: true`) from
    # 2026-08-17 until go-quicraft#3 re-armed it on 2026-08-21.
    #
    # That flag was an owner-approved SCOPING correction, not a silenced test:
    # contrib/dragonboat is a separate Go module that nothing in the portfolio
    # consumes — go-qrdb, the only direct consumer of this repo, imports
    # root-module packages only — so gating the ROOT module's release on it
    # held qrdb, xkms, quicbaas and trusted-platform behind a failure none of
    # them could be affected by. It was granted on the explicit condition that
    # it be reverted, which #3 tracked.
    #
    # Both defects that justified it are fixed and merged:
    #   * go-quicraft#2  — snapshot transfer left the new replica with an apply
    #                      gap (PR #4, commit 5bab86b).
    #   * go-quicraft#13 — TestRequestState_ResultC_AggregatesCommittedThenApplied
    #                      failed 1.33% of runs on a lost notification in the
    #                      adapter's ResultC aggregator (PR #25). The fix is
    #                      causal, not a timing tweak: the aggregator now reads
    #                      the inner commit source directly instead of racing a
    #                      since-removed relay bridge's output.
    #
    # #3 required the suite be shown "genuinely stable, not merely passing
    # once", under contention. Measured 2026-08-21 on a host under real load
    # (loadavg 31 -> 43 from concurrent CI), all under -race:
    #
    #   | scope                          | runs | failures |
    #   | previously-flaky ResultC test  | 3200 |        0 |
    #   | full contrib unit suite        |   15 |        0 |
    #   | contrib integration suite      |    8 |        0 |
    #
    # 3200 clean runs put the 95% upper bound on that test's failure rate at
    # 0.094%, and make the old 1.33% rate essentially impossible (p ~ 2e-19).
    # One green run would have proven very little here — the failures are
    # load-sensitive and do not reproduce on a quiet machine — which is why
    # the count is what it is.
    #
    # Do NOT drop this comment as "stale": the history is what justifies the
    # gate being armed, and what a future report-only request must argue against.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run contrib/dragonboat unit tests
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -timeout=900s ./...

      # -p 1 is load-bearing, not caution: every package here spins up
      # multi-node QUIC clusters under -race, and running them concurrently
      # starves runner CPU enough to flake the tests with 30s waits.
      - name: Run contrib/dragonboat integration suite
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  # ==========================================================================
  # The gate
  #
  # Branch protection can require exactly ONE status context, so a pipeline of
  # eleven jobs needs a single place that speaks for all of them. Without this,
  # `enable_status_check` cannot be turned on at all: requiring a context that
  # is never published blocks every merge, and requiring one leg leaves the
  # other ten advisory (go-quicraft#47). Every peer repo already has this job —
  # go-frostdkg is the reference and this follows its shape.
  #
  # `if: always()` is what makes it a gate rather than a formality. Without it
  # the job is SKIPPED when a dependency fails, a skipped required context
  # never reports, and the merge blocks on silence instead of failing on a
  # verdict — indistinguishable, from the outside, from a pipeline that never
  # ran.
  #
  # FAIL-CLOSED: the check treats anything that is not `success` as failure,
  # including `skipped` and `cancelled`. A job skipped because its own
  # dependency failed has not passed, and neither has a cancelled one; reading
  # either as acceptable is how a red pipeline reports green.
  #
  # Adding a job to this workflow means adding it BOTH to `needs` and to a
  # `check` line. That duplication is deliberate — a job named in `needs` but
  # not checked would gate nothing, silently — and the pairing is asserted by
  # test/buildgates so a new job cannot be added to only one of them.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, build, test, integration, netfault, errfs, zero-rtt, fuzz-seeds, modules, cross-arch, contrib-dragonboat]
    steps:
      - name: Fail closed on any non-success
        run: |
          BAD=0
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          check lint              "${{ needs.lint.result }}"
          check security          "${{ needs.security.result }}"
          check build             "${{ needs.build.result }}"
          check test              "${{ needs.test.result }}"
          check integration       "${{ needs.integration.result }}"
          check netfault          "${{ needs.netfault.result }}"
          check errfs             "${{ needs.errfs.result }}"
          check zero-rtt          "${{ needs.zero-rtt.result }}"
          check fuzz-seeds        "${{ needs.fuzz-seeds.result }}"
          check modules           "${{ needs.modules.result }}"
          check cross-arch        "${{ needs.cross-arch.result }}"
          check contrib-dragonboat "${{ needs.contrib-dragonboat.result }}"
          exit $BAD
