  # <<< CUSTOMIZE

  # v1.35 (Company Agent m2557, owner ruling on commit signing, 2026-11-11):
  # every commit that reaches main is signed by a registered identity. Each
  # agent keeps its own App identity (<repo>-agent[bot]) and its own SSH
  # signing key, and agent work is never attributed to the owner's account.
  # The registry is .github/allowed_signers (ssh allowed_signers format: the
  # principal is the exact committer email, then the public key), synced from
  # the handbook's software/templates/signing/<repo>.allowed_signers. The job
  # reads it from the BASE commit, so a pull request cannot add the key that
  # signs it; only the first adoption, with no registry at the base, reads it
  # from the head, with a warning. It checks every commit in the range: base..head
  # on a pull request, before..after on a push to main, the one commit on a
  # schedule or dispatch run or a new branch. A commit passes when
  # `git verify-commit` (gpg.format=ssh, gpg.ssh.allowedSignersFile) accepts it
  # AND the key's registered principal is the committer email; a commit GitHub
  # made (committer noreply@github.com: a squash merge, an update-branch merge)
  # passes when the API reports it verified with committer web-flow. It fails
  # closed on an unsigned commit, an unknown key, a principal mismatch and an
  # unreadable API, printing the commit and why; an email outside the registry
  # and GitHub's noreply forms is never printed. Nothing but git and the API
  # runs: no repository code, no token beyond github.token (contents: read).
  signatures:
    name: Signatures
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit signatures against .github/allowed_signers
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          zero() { [ -z "$1" ] || printf '%s' "$1" | grep -qE '^0+$'; }
          isrev() { ! zero "$1" && git cat-file -e "$1^{commit}" 2>/dev/null; }
          ASF="${RUNNER_TEMP:-/tmp}/allowed_signers"
          # The registry is read from the base, so a pull request cannot add the key
          # that signs it. Only the first adoption, with no registry at the base,
          # reads it from the head.
          REG=""
          if [ "$EVENT" = pull_request ]; then REG="$BASE_SHA"; elif [ "$EVENT" = push ]; then REG="$BEFORE"; fi
          # v1.35.1: a named base that is not in the clone (a push after a force
          # push, a base the checkout did not bring) is fetched; if it still cannot
          # be read the job fails, never falling back to the head's registry or to
          # the head commit alone.
          if [ "$EVENT" = pull_request ] && [ -z "$REG" ]; then
            echo "FAIL a pull_request run with no base SHA"; exit 1
          fi
          if ! zero "$REG" && ! isrev "$REG"; then
            git fetch -q --no-tags origin "$REG" 2>/dev/null || true
            isrev "$REG" || { echo "FAIL the base ${REG:0:12} cannot be read, so neither the registry nor the range can be checked"; exit 1; }
          fi
          if isrev "$REG" && git cat-file -e "$REG:.github/allowed_signers" 2>/dev/null; then
            git show "$REG:.github/allowed_signers" > "$ASF"
            echo "registry: .github/allowed_signers at ${REG:0:12}"
          elif git cat-file -e "$HEAD_SHA:.github/allowed_signers" 2>/dev/null; then
            git show "$HEAD_SHA:.github/allowed_signers" > "$ASF"
            echo "::warning::no registry at the base: .github/allowed_signers read from the head (first adoption only)"
          else
            echo "FAIL no .github/allowed_signers in this repository"; exit 1
          fi
          # The range: base..head on a pull request, before..after on a push to main,
          # and the one commit otherwise (a new branch, a schedule or dispatch run).
          if [ "$EVENT" = pull_request ] && isrev "$BASE_SHA"; then RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = push ] && isrev "$BEFORE"; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="$HEAD_SHA -1"; fi
          # shellcheck disable=SC2086 # RANGE is one or two words on purpose
          COMMITS=$(git rev-list --reverse $RANGE) || { echo "FAIL cannot list the range $RANGE"; exit 1; }
          N=$(printf '%s\n' "$COMMITS" | grep -c . || true)
          echo "checking $N commit(s) in $RANGE"
          reg_principals=$(awk '!/^[[:space:]]*(#|$)/ {print $1}' "$ASF")
          shown() { # print an email only when it is public: a registry principal or a GitHub noreply
            if printf '%s\n' "$reg_principals" | grep -qxF -- "$1" || printf '%s' "$1" | grep -qE '@users\.noreply\.github\.com$|^noreply@github\.com$'; then
              printf '%s' "$1"; else printf 'an address not in the registry'; fi
          }
          BAD=0
          for c in $COMMITS; do
            ce=$(git log -1 --format=%ce "$c")
            s=$(git log -1 --format=%s "$c" | cut -c1-60)
            if [ "$ce" = noreply@github.com ]; then
              # GitHub made it (a squash merge, an update-branch merge): accept it only
              # when the API says GitHub signed and verified it as web-flow.
              v=$(curl -fsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                  "${API}/repos/${REPO}/commits/${c}" | jq -r '[(.commit.verification.verified|tostring), .commit.verification.reason, (.committer.login // "none")] | @tsv') \
                || { echo "FAIL ${c:0:12} committed by GitHub, and the API could not be read: $s"; BAD=1; continue; }
              IFS=$'\t' read -r ok reason login <<<"$v"
              if [ "$ok" = true ] && [ "$login" = web-flow ]; then
                echo "OK   ${c:0:12} GitHub web-flow, verified: $s"
              else
                echo "FAIL ${c:0:12} committed as GitHub but not verified (verified=$ok reason=$reason committer=$login): $s"; BAD=1
              fi
              continue
            fi
            # v1.35.1: grep reads the whole object (no -q), so under pipefail a
            # long commit message never ends the pipeline with SIGPIPE.
            if ! git cat-file commit "$c" | grep '^gpgsig' >/dev/null; then
              echo "FAIL ${c:0:12} unsigned, committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            g() { git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$ASF" "$@"; }
            if ! g verify-commit "$c" >/dev/null 2>&1; then
              echo "FAIL ${c:0:12} signed by a key not in the registry (or a bad signature), committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            signer=$(g log -1 --format=%GS "$c")
            if [ "$signer" != "$ce" ]; then
              echo "FAIL ${c:0:12} principal mismatch: the key is registered to $signer, the committer is $(shown "$ce"): $s"; BAD=1; continue
            fi
            echo "OK   ${c:0:12} signed by $signer: $s"
          done
          exit $BAD

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # Every job, CI Gate included, runs on GitHub-hosted ubuntu-latest. A matrix
  # job (unit, integration) is one needs entry whose result is success only
  # when every shard succeeded. trivy and fips are in nightly.yml (v1.9,
  # devops.md §8a: the alpha regime).
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.preflight.outputs.verdict != 'busy') }}
    timeout-minutes: 5        # v1.30
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs. v1.30: lint
    # joins; publish-images is the one job outside the gate (see its comment).
    needs: [preflight, lint, image, unit, coverage, lint-gates, integration, soak, netfault, errfs, zero-rtt, fuzz-seeds, cross-arch, modules, contrib-dragonboat, fips, signatures]
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.preflight.outputs.verdict }}
          # v1.30: the proving run of a proven main push, the docs-only PR
          # flag (a `code` job skips on it) and the lint-gates path scope (a
          # `scoped` job skips when no file matched).
          PROOF: ${{ needs.preflight.outputs.proof }}
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only == 'true' }}
          LINT_GATES_SEL: ${{ needs.preflight.outputs.lint_gates != 'false' }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          check() { # <job> <result> <pr|code|scoped|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "${SCHEDULE_GUARD}" = proven ] && [ -n "${PROOF}" ] && [ "$3" != nightly ]; then
                  echo "SKIP $1 (tree proven by run ${PROOF})"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                elif [ "$3" = scoped ] && [ "${LINT_GATES_SEL}" != true ]; then
                  echo "SKIP $1 (no changed file matches LINT_GATES_PATTERN)"
                elif [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          # v1.30: a refused run (a dispatch off main, a checkpoint-branch PR) fails.
          if [ "${SCHEDULE_GUARD}" = refused ]; then
            echo "FAIL preflight (schedule guard refused: a workflow_dispatch off main or a PR from lane-ckpt/*; see its log)"; BAD=1
          fi
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL preflight (schedule guard verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr. v1.30: a job
          # that skips on a docs-only PR is code, and lint-gates is scoped.
          check preflight   "${{ needs.preflight.result }}" pr
          check lint        "${{ needs.lint.result }}" pr
          check image       "${{ needs.image.result }}" code
          check unit        "${{ needs.unit.result }}" code
          check coverage    "${{ needs.coverage.result }}" code
          check lint-gates  "${{ needs.lint-gates.result }}" scoped
          check integration "${{ needs.integration.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          check signatures  "${{ needs.signatures.result }}" pr
          # >>> CUSTOMIZE (go-quicraft)
          check netfault    "${{ needs.netfault.result }}" full
          check errfs       "${{ needs.errfs.result }}" full
          check zero-rtt    "${{ needs.zero-rtt.result }}" full
          check fuzz-seeds  "${{ needs.fuzz-seeds.result }}" nightly
          check cross-arch  "${{ needs.cross-arch.result }}" full
          check modules     "${{ needs.modules.result }}" full
          check contrib-dragonboat "${{ needs.contrib-dragonboat.result }}" full
          check fips        "${{ needs.fips.result }}" full
          # <<< CUSTOMIZE
          exit $BAD
