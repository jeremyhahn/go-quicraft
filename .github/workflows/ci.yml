# ci-template: v1.19 (customized)
#
# v1.19: the image job's trivy image takes --ignore-unfixed (a fixed CVE still
# blocks; an advisory with no fixed package does not), and the github.com
# gosec install builds the latest gosec tag against the latest x/tools
# (handbook devcontainer.md §2). v1.18: the integration and image jobs run
# scripts/reap-stale-ci-stacks.sh first. v1.17: third-party actions pinned by
# commit, the tag in a trailing comment. v1.16: Gitea jobs use the runner
# image's baked analysis tools; installs run on github.com only.
#
# Every job starts at once (ci-template v1.14, automatethethings#207/#209), so a
# run takes as long as its slowest job; ci-gate, the one required check, needs
# every job and fails closed on any result but success. push runs on main only:
# automerge.yml's merge trains are PRs from merge-train/* and get their CI from
# pull_request (v1.15).
#
# The one ordering kept is isolation, not staging: integration waits on test,
# and netfault and contrib-dragonboat wait on integration, because multi-node
# QUIC suites under -race starve a shared runner when they overlap (4dc5bfd,
# run 418). None of those jobs consumes another's output.
#
# Two tiers (#293; handbook sdlc.md §5a, devops.md §1/§5):
#
#   PR tier    every run. lint, security, build, test, cross-arch, modules.
#   Full tier  push to main, workflow_dispatch, or a pull_request carrying
#              the label `ci:full`. integration, netfault, errfs, zero-rtt,
#              fuzz-seeds, contrib-dragonboat, fips.
#
# Each full-tier job carries the same `if:`, spelled out per job because
# Gitea's workflow parser does not expand YAML anchors. ci-gate passes a
# full-tier job that its tier skipped and nothing else that skipped. A
# full-tier job may need a PR-tier one; never the reverse.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so that adding `ci:full` starts a full-tier run. Any other
    # label also starts a run, which re-runs the PR tier on the same commit.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel superseded runs. Keyed on the ref so a branch only supersedes itself,
# and set at workflow level so the whole superseded pipeline goes.
# cancel-in-progress is the literal `true` because Gitea does not evaluate
# expressions there. ci-gate treats `cancelled` as a failure, which never
# blocks a merge: only a superseded commit gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # An exact patch release, never "stable", so an upstream release cannot change
  # the toolchain under a running pipeline. The `go` directive in every go.mod
  # must not exceed this, and nested modules must match the root's.
  GO_VERSION: "1.27.2"
  # 90 is a floor, not a target. A failing package contributes no coverage, so
  # the gate needs some headroom over the measured total to avoid reporting a
  # flaky test as a coverage regression.
  COVERAGE_THRESHOLD: 90
  # Modules resolve from tags, never from a workspace. A stray go.work in the
  # tree would silently change what every job compiles (the Makefile and
  # release.yml set the same).
  GOWORK: "off"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # On the self-hosted runners the analysis tools are baked into the runner
      # image at pinned versions. Each job verifies the tools it runs itself,
      # because jobs do not share a machine. To change a version, rebuild the
      # image and update the pins here and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in golangci-lint; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check golangci-lint v2.14.0 "$(modver golangci-lint)"
          exit $rc

      # GitHub-hosted runners bake none of these tools, so install them at the
      # same pins.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # Every module, not only the root: contrib/ and test/performance/ are
      # separate modules that `./...` from the root never enters. They share
      # the root's config. -tags=benchmark brings in the harness entry points
      # under test/performance (the tag selects nothing in the root), without
      # which their helpers read as unused. Same discovery loop and floor as
      # the modules job; mirrors `make lint`.
      - name: golangci-lint (every module)
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          CONFIG="${PWD}/.golangci.yml"
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            ( cd "${dir}" && golangci-lint run --timeout=5m --config "${CONFIG}" --build-tags benchmark ./... ) || FAILED="${FAILED} ${dir}"
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: golangci-lint reported issues in:${FAILED}"
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    # No `needs` (v1.14): starts with lint and build, not after them.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0


      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Verify the tools baked into the runner image; see the lint job.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in gosec govulncheck; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check gosec        v2.29.0 "$(modver gosec)"
          check govulncheck  v1.8.0  "$(modver govulncheck)"
          exit $rc

      # GitHub-hosted runners bake none of these tools, so install them.
      # v1.19 (handbook devcontainer.md §2): the latest gosec tag, built in a
      # throwaway module against the latest x/tools. A release's own x/tools
      # can trail the toolchain's export data (gosec v2.29.0 carries x/tools
      # v0.49.0, which cannot read Go 1.27's version 5). Drop the x/tools
      # argument once a gosec release reads it. Retried for the sum.golang.org
      # flake class; full sumdb verification kept.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            ( cd "$(mktemp -d)" && go mod init gosec-build &&
              go get github.com/securego/gosec/v2/cmd/gosec@latest golang.org/x/tools@latest &&
              go install github.com/securego/gosec/v2/cmd/gosec ) && break
            if [ "$i" -lt 3 ]; then echo "install attempt $i failed; retrying"; sleep 10; else echo "tool install failed after 3 attempts"; exit 1; fi
          done
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Writes SARIF (uploaded below) and still exits non-zero on findings to
      # gate the build. Tests, examples and contrib adapters are excluded.
      #
      # Every -exclude rule below was checked against the code; record the
      # reason here so the next person does not have to re-derive it. Keep this
      # list identical to GOSEC_EXCLUDE in the Makefile.
      #   G103 unsafe: the proto codec is a fixed-layout zero-copy encoding.
      #   G104 unhandled error: fires on hash.Write, which never returns one.
      #   G115 integer overflow on conversion: the conversions it flags sit
      #        behind an explicit bounds check on the same value (frame and
      #        entry sizes are validated against MaxFrameSize /
      #        MaxReplicationPayloadBytes before the narrowing conversion).
      #        NOT a blanket "we accept overflow" — a NEW conversion without a
      #        preceding bound is a real finding this exclusion will hide, so
      #        review narrowing conversions by hand.
      #   G301/G306 file and directory permissions: 0755/0644 on data
      #        directories and data files is the intended posture; secret
      #        material is written 0600 explicitly.
      #   G304 file inclusion via variable: every snapshot/WAL path is
      #        constructed internally from (shard, replica, index), never from
      #        a request.
      #   G404 weak random: false positive. The only math/rand use is election
      #        jitter in pkg/internal/raft/raft.go, and newRaft seeds it from
      #        crypto/rand. Jitter must be fast and unpredictable-enough to
      #        desynchronize campaigns; it is not a security primitive.
      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec.sarif -exclude=G103,G104,G115,G301,G304,G306,G404 -exclude-dir=test -exclude-dir=examples -exclude-dir=contrib -severity=medium -confidence=medium ./...

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        run: govulncheck ./...

  # CUSTOMIZE (ci-template v1.18, image job): builds the devcontainer images
  # from build/docker/devcontainer/Dockerfile at this commit, runs the
  # toolchain stages in the toolchain image (handbook ci-standard.md §1-§2),
  # and gates the integration image with trivy image --ignore-unfixed (v1.19:
  # an advisory with no fixed package does not block; a fixed CVE does, and
  # make security's trivy fs never takes the flag). The checkout is copied
  # into each toolchain container (scripts/in-toolchain-image.sh): the daemon
  # is reached through a socket, so a bind mount would resolve on its host.
  # make security and make deps-check get a network, for the vulnerability
  # databases and the module proxy; build and test run without one. The scan
  # is a gate only: nothing is uploaded to code scanning.
  image:
    name: Devcontainer image [build, test, security, deps-check, trivy image]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IT_IMAGE: go-quicraft-ci-it:${{ github.run_id }}-${{ github.run_attempt }}-image
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-quicraft-ci-

      # As in the integration job: the forge credentials reach the build only
      # as the gomodauth BuildKit secret, from a file outside the context.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Build the toolchain and integration images
        run: |
          make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make build (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make build

      - name: make test (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test

      - name: make security (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make security

      - name: make deps-check (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      - name: trivy image (integration image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            trivy image --input it-image.tar --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          docker image rm "$IT_IMAGE" || true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build ./...

      - name: Build FIPS variant
        run: |
          GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

  # The untagged suite. The jobs after this one exist because `go test ./...`
  # without build tags silently skips the integration, errfs and fuzz suites,
  # and `go vet` cannot catch the excluded code rotting.
  test:
    name: Test
    runs-on: ubuntu-latest
    # No `needs` (v1.14): every job starts at once.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # Three steps: run, classify, gate coverage. A failing package contributes
      # no coverage, so a single combined step would report one flaky test as
      # both a test failure and a coverage regression.
      #
      # continue-on-error lets the classify step decide the verdict and print
      # the failing test names into the job log. The classify step fails the
      # job, so the coverage gate never runs on a broken suite.
      - name: Run tests with coverage
        id: gotest
        continue-on-error: true
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=900s -coverprofile=coverage.out ./... 2>&1 | tee test-output.log

      - name: Classify the test result
        run: |
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            echo "VERDICT: TESTS_PASSED"
            exit 0
          fi
          echo "VERDICT: TEST_FAILURE"
          echo "----- failing tests -----"
          grep -E '^--- FAIL|^FAIL[[:space:]]' test-output.log | head -40 \
            || echo "(no '--- FAIL' lines: the run panicked, timed out, or failed to build)"
          echo "----- panics, races and timeouts -----"
          grep -nE 'panic:|test timed out|DATA RACE|build failed' test-output.log | head -20 || true
          echo
          echo "The full log is attached to this run as the 'test-output' artifact."
          exit 1

      # Reached only when the suite passed, so the profile is complete. The
      # guards mirror check-coverage in the Makefile: without them an empty
      # profile makes the bc comparison error out and the gate pass.
      - name: Gate on coverage
        run: |
          if [ ! -s coverage.out ]; then
            echo "VERDICT: NO_COVERAGE_DATA"
            echo "FAIL: coverage.out is missing or empty; the test run produced no coverage data"
            exit 1
          fi
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          case "${COVERAGE}" in
            '' | *[!0-9.]* )
              echo "VERDICT: NO_COVERAGE_DATA"
              echo "FAIL: coverage could not be read from coverage.out (got '${COVERAGE}')"
              exit 1 ;;
          esac
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l)" -eq 1 ]; then
            echo "VERDICT: COVERAGE_BELOW_THRESHOLD"
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
          echo "VERDICT: COVERAGE_OK"

      # The total can clear its floor while one package sits far below it, so
      # apply the same threshold to each package under pkg/.
      # `make coverage-packages` enforces the 91% target locally.
      - name: Gate on per-package coverage
        run: scripts/check-coverage-packages.sh coverage.out ${{ env.COVERAGE_THRESHOLD }} github.com/jeremyhahn/go-quicraft/pkg

      # always(), not failure(): a passing run's log is what you compare the next
      # failure against. Limited to github.com because upload-artifact fails on
      # servers without an artifact endpoint, which would fail a passing suite.
      # The classify step already prints the failures into the job log.
      - name: Upload the test log
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14
          if-no-files-found: warn

  # ==========================================================================
  # Tagged suites
  #
  # The full tier. These gate every push to main, and a PR labelled
  # `ci:full`:
  #
  #   integration  ~9 min. The only CI job that starts more than one node,
  #                holds an election, partitions a cluster or streams a
  #                snapshot. A change that breaks leader election must not
  #                reach main.
  #   errfs        seconds. Fault injection on the WAL write path.
  #   fuzz-seeds   seconds. Runs every fuzz target against its f.Add seeds and
  #                the committed corpus under pkg/*/testdata/fuzz/. This is a
  #                deterministic regression test, not fuzzing.
  #
  # Mutation fuzzing is not here because a newly found crash would fail an
  # unrelated PR at random. It runs on dispatch in fuzz.yml, and release.yml
  # requires it and all three jobs below before a tag can publish.
  #
  # Keep each command byte-identical to the matching `ci-*` target in the
  # Makefile; `make ci-full` reproduces this locally.
  # ==========================================================================

  integration:
    name: Integration [build tag integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # `needs: test` keeps the heavy jobs off the runner at the same time.
    # Overlapping multi-node QUIC suites under -race starve each other and
    # expire 30s snapshot and rolling-restart waits. The short jobs (errfs,
    # fuzz seeds) stay parallel.
    needs: [test]
    # The suite is ~9 min on a quiet machine but runs under -race with -p 1.
    # IT_CMD's -timeout=1800s is the real budget; this is the outer backstop,
    # with room for building the integration image.
    timeout-minutes: 60
    # CUSTOMIZE (ci-template v1.18, integration job that starts containers):
    # the suite runs in the devcontainer `integration` image built at this
    # commit, under the hardened compose service in
    # build/docker/devcontainer/compose.yaml (handbook ci-standard.md §2).
    # The compose project is go-quicraft-ci-<run>-<attempt>, the reaper runs
    # first, and the teardown runs last under if: always().
    env:
      IT_PROJECT: go-quicraft-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IT_IMAGE: go-quicraft-ci-it:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-quicraft-ci-

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # The forge credentials the runner injects (dependency-resolution.md §6)
      # reach the image build only as the gomodauth BuildKit secret, from a
      # file outside the build context. `docker build` does not inherit the
      # job's environment.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # -p 1 is required (IT_CMD in the Makefile): each package starts
      # multi-node QUIC clusters under -race, and running them concurrently
      # flakes the 30s snapshot catch-up waits.
      - name: Run integration suite in the integration image
        run: make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          GO_QUICRAFT_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          docker image rm "$IT_IMAGE" || true

  netfault:
    name: Network partitions [build tag quicraft_netfault]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # Serialised behind the heavy jobs for the same reason as `integration`:
    # 3-to-5-node QUIC clusters under -race wait on election timeouts.
    needs: [test, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # The only tests that construct a live leader deposed by a quorum it
      # cannot reach; everything else stops nodes outright. The suite asserts
      # its faults are installed, so a missing build tag fails the job.
      - name: Run network-partition suite
        run: make ci-netfault

  errfs:
    name: ErrorFS injection [build tag quicraft_errfs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # -race is kept: these tests drive the WAL through injected I/O failures
      # from concurrent goroutines, where a torn recovery path shows up as a
      # race.
      - name: Run errfs suite
        run: go test -race -count=1 -tags=quicraft_errfs ./test/errfs/...

  zero-rtt:
    name: 0-RTT replay policy [no -race]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The only job without -race. TestSnapshotOver0RTTRejected drives quic-go's
      # DialAddrEarly, and quic-go has an unsynchronised private field on that
      # path that the detector reports. No production path uses DialEarly, and
      # Enable0RTT is off by default.
      #
      # The test skips under the detector, so it is a no-op in the Test job.
      - name: Run the 0-RTT tests without the race detector
        run: go test -count=1 -run '0RTT' ./pkg/internal/transport/

  fuzz-seeds:
    name: Fuzz seeds [build tag quicraft_fuzz]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # -run=Fuzz without -fuzz runs each target once per seed and once per
      # file in its testdata/fuzz/<Target>/ corpus, then exits.
      - name: Run fuzz targets against seeds and committed corpus
        run: go test -race -count=1 -tags=quicraft_fuzz -run=Fuzz ./...

  # ==========================================================================
  # Multi-module build
  #
  # contrib/ and the benchmark harnesses under test/performance/ are separate
  # Go modules that replace or require the root, so a root change can break
  # them. The module list is discovered rather than declared, so a new go.mod
  # is enrolled automatically, and MODULE_FLOOR fails the job if discovery
  # comes back short. A shell loop is used because the runner does not expand
  # a matrix built from another job's output.
  # ==========================================================================

  # ==========================================================================
  # Cross-architecture build
  #
  # Every other job runs on linux/amd64. This catches what fails to compile or
  # vet on another architecture or OS: arch- and OS-specific build tags,
  # assembly, assumed type sizes, non-portable syscalls (a socket handle is an
  # int on Unix and a Handle on Windows). It does not catch a runtime value
  # that differs by platform (such as page size); test those against the
  # parameter, as shamir's budget test does for 4, 16 and 64 KiB pages.
  #
  # Cross-compiled because no arm64, macOS, Windows or FreeBSD runner is
  # available and QEMU would multiply every test's wall clock.
  # ==========================================================================

  cross-arch:
    name: Cross-architecture build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 is the second 64-bit production target. linux/386
        # catches untyped constants that overflow int on 32-bit, which often
        # hide in test files, so this vets as well as builds. windows, darwin
        # and freebsd catch Unix-only syscalls and build constraints that
        # leave a symbol undefined on one OS.
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Same discovery loop and floor as the modules job.
      - name: Build and vet every module for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s) for ${GOOS}/${GOARCH}:"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            ( cd "${dir}" && go build ./... && go vet ./... ) || FAILED="${FAILED} ${dir}"
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: ${GOOS}/${GOARCH} build or vet failed in:${FAILED}"
            exit 1
          fi
          echo "every module builds and vets for ${GOOS}/${GOARCH}"

  modules:
    name: Nested module build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # GOWORK=off (workflow env) matters most here: with a workspace active,
      # these modules would resolve the root through it and hide `go` directive
      # mismatches.
      - name: Build and vet every module in the tree
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          # Collected rather than fail-fast: one broken sibling must not hide
          # a second one. This is what `fail-fast: false` did for the matrix.
          FAILED=""
          for dir in ${MODULES}; do
            echo "::group::${dir}"
            # Also vet with -tags=benchmark, which nothing else compiles.
            #
            # Nested modules run `go test` (perfresult and benchutil gate
            # `make bench-compare`). The root module is not tested here: its
            # own `test` job does that, and running it twice concurrently
            # causes runner contention.
            TEST_CMD="true"
            if [ "${dir}" != "." ]; then
              TEST_CMD="go test -count=1 ./..."
            fi
            if ! (cd "${dir}" && go build ./... && go vet ./... \
                  && go vet -tags=benchmark ./... \
                  && eval "${TEST_CMD}"); then
              FAILED="${FAILED} ${dir}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: module(s) did not build or vet cleanly:${FAILED}"
            exit 1
          fi

  # ==========================================================================
  # contrib/dragonboat test suites
  #
  # The modules job only builds and vets contrib/dragonboat. This runs its unit
  # tests and the integration suite that starts multi-node QUIC clusters
  # through the dragonboat compatibility API. It is a separate job because the
  # integration suite needs the UDP tuning and -p 1.
  #
  # Keep each command byte-identical to the matching `ci-*` target in
  # contrib/dragonboat/Makefile.
  # ==========================================================================

  contrib-dragonboat:
    name: contrib/dragonboat [unit + integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # Last of the three heavy jobs; see the note on `integration`.
    needs: [integration]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run contrib/dragonboat unit tests
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -timeout=900s ./...

      # -p 1 is required: every package here starts multi-node QUIC clusters
      # under -race, and running them concurrently flakes the 30s waits.
      - name: Run contrib/dragonboat integration suite
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  # ==========================================================================
  # FIPS (full tier; moved from nightly.yml in #293)
  #
  # The Makefile's two-tier verification: `make build-fips`, `make verify-fips`
  # (GODEBUG=fips140=only over every package except
  # pkg/internal/transport/revocation) and `make verify-fips-exempt`
  # (fips140=on for the revocation tree, whose OCSP CertID is SHA-1 by protocol
  # definition). See the FIPS block in the Makefile and
  # docs/quic-transport/architecture.md.
  # ==========================================================================

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # Behind integration with netfault and contrib-dragonboat: the transport
    # suite starts real QUIC listeners and is the slowest part of the run.
    needs: [integration]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Compile under the module, tagged and untagged
        run: make build-fips

      # GODEBUG=fips140=only over every package except
      # pkg/internal/transport/revocation, including the QUIC transport.
      # release.yml runs the same gate.
      - name: Approved-only gate
        run: make verify-fips

      # pkg/internal/transport/revocation under GODEBUG=fips140=on. The OCSP
      # CertID (RFC 6960 s4.1.1) is SHA-1 by protocol definition, inside
      # golang.org/x/crypto/ocsp; docs/quic-transport/architecture.md records
      # the exemption. This keeps the exempt tree tested rather than excluded.
      - name: Exempt revocation tree, FIPS mode
        run: make verify-fips-exempt

  # ==========================================================================
  # The gate
  #
  # Branch protection requires a single status context, and this job speaks
  # for the whole pipeline. `if: always()` makes it report when a dependency
  # fails instead of being skipped. Anything other than `success`, including
  # `cancelled`, is a failure, with one exception: `skipped` passes for a job
  # tagged `full` when this run did not select the full tier (FULL_TIER is
  # the same expression as the full-tier jobs' `if:`). A PR-tier job never
  # skips legitimately, and in a full-tier run neither does a full-tier job,
  # so `skipped` there still fails.
  #
  # A new job must be added both to `needs` and to a `check` line, tagged
  # `pr` or `full`; test/buildgates asserts the pairing.
  # ==========================================================================

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, build, test, integration, netfault, errfs, zero-rtt, fuzz-seeds, modules, cross-arch, contrib-dragonboat, fips, image]
    steps:
      - name: Fail closed on any non-success
        env:
          FULL_TIER: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          BAD=0
          echo "full tier selected: ${FULL_TIER}"
          check() { # <job> <result> <pr|full>
            case "$2" in success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          check lint              "${{ needs.lint.result }}" pr
          check security          "${{ needs.security.result }}" pr
          check build             "${{ needs.build.result }}" pr
          check test              "${{ needs.test.result }}" pr
          check modules           "${{ needs.modules.result }}" pr
          check cross-arch        "${{ needs.cross-arch.result }}" pr
          check image             "${{ needs.image.result }}" pr
          check integration       "${{ needs.integration.result }}" full
          check netfault          "${{ needs.netfault.result }}" full
          check errfs             "${{ needs.errfs.result }}" full
          check zero-rtt          "${{ needs.zero-rtt.result }}" full
          check fuzz-seeds        "${{ needs.fuzz-seeds.result }}" full
          check contrib-dragonboat "${{ needs.contrib-dragonboat.result }}" full
          check fips              "${{ needs.fips.result }}" full
          exit $BAD
