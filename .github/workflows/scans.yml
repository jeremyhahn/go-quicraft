# scans-template: v1.0.0 (customized) — the scheduled scans on main and their
# ONE fix PR. ci-template v1.42 makes the CI Gate hermetic, so the checks
# that fail on the state of the world rather than on a change run here, and
# only here, on a schedule and on workflow_dispatch on main, never on a
# pull_request or a push: `make deps-check` as the full gate, `make security`
# (gosec, govulncheck, go mod verify, trivy fs) and `trivy image` of the
# integration image. This workflow is not the one named CI, so a finding
# never reads as a red main and never blocks a PR.
#
#   - scans: `make security` and `trivy image`. A finding opens or updates
#     ONE issue, found by its fixed title (SCAN_ISSUE_TITLE), with the run
#     link, and fails this job, so the Actions run is red; a run with no
#     finding closes that issue.
#   - bump: the shared depscheck's `make deps-bump` in the toolchain image,
#     verified with `make deps-check` (the full gate, no base) and
#     `make build`; the go.mod and go.sum changes land as ONE commit on the
#     fixed branch ci/deps-bump, with ONE pull request into main labelled
#     `code-review` and `task:ready`, so the normal review and auto-merge
#     land it.
#   - The commit is made by GitHub (GraphQL createCommitOnBranch), so it is
#     signed and the Signatures check reads it as a `web-flow` commit.
#   - With an open PR on the branch, the bump first calls
#     PUT pulls/N/update-branch and builds on the PR's new tip. It never
#     force-updates a ref: a branch left behind by an unmerged closed PR
#     fails the job, for a person to close. The branch of a merged PR, still
#     at that PR's head, is deleted and re-created from main, which loses
#     nothing. A branch with no open PR whose tip is its merge base with main
#     (a placeholder a failed run created at the base) is reused: the bump
#     builds on its tip. So is a branch with no open PR whose every commit
#     main lacks is this job's own verified web-flow bump commit (a run that
#     committed and failed before it opened the PR): the bump builds on its
#     tip and the PR is opened only while the branch is at the head
#     expected. The commit step deletes a branch it created when the commit
#     fails. Every deletion is a push that names the tip read as the
#     expected old value (--force-with-lease), so a commit pushed since is
#     never removed.
#   - A govulncheck finding on the standard library, the toolchain or an
#     indirect-only module is reported, not failed, by deps-check, so it does
#     not stop the verify.
#   - A PR or push made with GITHUB_TOKEN starts no pull_request run, so the
#     bump dispatches ci.yml on ci/deps-bump and its CI Gate check attaches
#     to the head. code-review.yml runs on pull_request_target, which a
#     GITHUB_TOKEN PR or label change does not start either: re-apply the
#     `code-review` label with another token to start the review.
#
# GitHub only (the API calls are GitHub's). The Makefile needs `deps-bump`,
# `deps-check`, `security`, `build`, `docker-build`, `docker-build-toolchain`,
# `toolchain-image` and `it-image`.
#
# CUSTOMIZE (go-quicraft), against the template:
#   - Two jobs, scans and bump, not one: the bump keeps its own verify (no
#     commit unless `make deps-check` and `make build` pass) rather than the
#     template's fix PR listing the findings, its GraphQL web-flow commit
#     rather than the git data API, and its placeholder and orphaned-commit
#     recovery; scripts/depscheck/workflow_test.go runs the bump's steps.
#   - The cron minute: off ci.yml's Thursday 05:00.

name: Scheduled Scans

on:
  schedule:
    - cron: '41 6 * * *'   # CUSTOMIZE: the minute, per repository
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # the one issue for a finding
  actions: write

# One run at a time per repository; a newer run waits, never cancels one
# halfway through its ref update.
concurrency:
  group: scans-${{ github.repository }}
  cancel-in-progress: false

env:
  BRANCH: ci/deps-bump
  PR_TITLE: 'deps: bump dependencies to latest (ruling 640)'
  GO_BUILD_TAGS: ""   # CUSTOMIZE: ci.yml's GO_BUILD_TAGS
  SCAN_ISSUE_TITLE: 'scans: findings the scheduled scans report on main (ruling 742)'

jobs:
  scans:
    name: Scheduled scans
    if: ${{ github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: pr
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner starts with about 14 GB free, less than the two image
      # builds and the stages' caches need (ci.yml's image job does the same).
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      # The toolchain and integration images, as ci.yml's image job builds
      # them (APK_INDEX_SUM, IT_IMAGE), so trivy image scans what CI would
      # publish from this tree.
      - name: Build the devcontainer images
        run: |
          # As ci.yml: the Dockerfile's GO_IMAGE ARG has no default, so the base
          # image comes from scripts/tool-pins.sh as APK_BASE_IMAGES.
          APK_INDEX_SUM=$(. scripts/tool-pins.sh && APK_BASE_IMAGES="$GO_IMAGE" scripts/apk-index-sum.sh)
          export APK_INDEX_SUM
          echo "APK_INDEX_SUM=$APK_INDEX_SUM" >> "$GITHUB_ENV"
          it=$(make -s it-image)
          echo "IT_IMAGE=$it" >> "$GITHUB_ENV"
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$it"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # The checks that left ci.yml. Each runs to the end; FIRED lists the
      # ones that fail, and the step's own log keeps their output. trivy
      # image keeps ci.yml's former flags.
      - name: Scans (make security, trivy image)
        id: scans
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          fired=
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security GO_BUILD_TAGS='$GO_BUILD_TAGS'" || fired="$fired security"
          if docker save -o it-image.tar "$IT_IMAGE"; then
            scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
              trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1 || fired="$fired trivy-image"
          else
            fired="$fired trivy-image"
          fi
          rm -f it-image.tar
          fired=${fired# }
          echo "scans: ${fired:-none fired}"
          echo "fired=$fired" >> "$GITHUB_OUTPUT"

      # ONE issue for the findings, found by its exact title among the open
      # issues (pull requests excluded): created when none is open, its body
      # replaced when one is, and closed with a comment by the first run with
      # no finding.
      - name: Open, update or close the scan issue
        if: ${{ !cancelled() && steps.scans.outcome == 'success' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$SCAN_ISSUE_TITLE\") | .number" | head -n1)
          if [ -z "$FIRED" ]; then
            if [ -n "$issue" ]; then
              gh api "repos/$REPO/issues/$issue/comments" -f body="The scheduled scans found nothing. Run: $RUN_URL" >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null
              echo "closed #$issue"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            'The scheduled scans on main (scans.yml, ruling 742 (1)) fired: a vulnerable version or an image package. Each needs a fix PR or a documented reason (devops.md §9). The Scans step log of the run names each finding.' \
            "Firing: $FIRED." \
            "Run: $RUN_URL")
          if [ -z "$issue" ]; then
            issue=$(jq -n --arg t "$SCAN_ISSUE_TITLE" --arg b "$body" '{title: $t, body: $b}' | gh api "repos/$REPO/issues" --input - --jq .number)
            echo "opened #$issue"
          else
            jq -n --arg b "$body" '{body: $b}' | gh api -X PATCH "repos/$REPO/issues/$issue" --input - >/dev/null
            echo "updated #$issue"
          fi

      # A finding fails the run, after the issue is open, so it is seen and
      # fixed. This is not CI: no PR and no main commit status reads it.
      - name: Fail on a finding
        if: ${{ !cancelled() && steps.scans.outputs.fired != '' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
        run: |
          echo "::error title=scheduled scans::firing: $FIRED (see the Scans step log)"
          exit 1

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar

  bump:
    name: Deps bump and full deps-check
    if: ${{ github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: pr
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      # The commit to build on: the open PR's tip after update-branch, or
      # main's tip when there is no open PR.
      - name: Find the base commit
        id: base
        run: |
          set -euo pipefail
          owner=${REPO%%/*}
          stale=
          recover=
          # Succeeds when every commit in $1..$2 is one this workflow's
          # commit step makes, read back as that step reads its own commit:
          # verified, committer noreply@github.com with login web-flow, and
          # the bump's headline. The list is pinned to the tip read, not
          # the branch, so a commit pushed since is not vouched for.
          owned() {
            local list n s v ok email login msg
            local -a shas
            if ! list=$(gh api "repos/$REPO/compare/$1...$2" --jq '.total_commits, .commits[].sha'); then
              return 1
            fi
            mapfile -t shas <<<"$list"
            n=${shas[0]:-0}
            shas=("${shas[@]:1}")
            if [ "$n" -lt 1 ] || [ "${#shas[@]}" -ne "$n" ]; then
              echo "$BRANCH: $n commits beyond $1, ${#shas[@]} listed: not recovered"
              return 1
            fi
            for s in "${shas[@]}"; do
              if ! v=$(gh api "repos/$REPO/commits/$s" --jq '[(.commit.verification.verified|tostring), .commit.committer.email, (.committer.login // "none"), (.commit.message|split("\n")[0])] | @tsv'); then
                return 1
              fi
              IFS=$'\t' read -r ok email login msg <<<"$v"
              if [ "$ok" != true ] || [ "$email" != noreply@github.com ] || [ "$login" != web-flow ] || [ "$msg" != 'deps: bump dependencies to latest (ruling 640)' ]; then
                echo "$BRANCH: $s is not this workflow's commit (verified=$ok committer=$email login=$login): not recovered"
                return 1
              fi
            done
          }
          pr=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$BRANCH&base=main" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            # 202 starts the merge of main into the branch; 422 means there
            # is nothing to merge. Either way read the tip it leaves.
            if gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head" >/dev/null 2>&1; then
              for _ in $(seq 1 24); do
                read -r -t 5 < /dev/zero || true
                now=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
                [ "$now" != "$head" ] && break
              done
            fi
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            echo "open PR #$pr on $BRANCH; building on its tip $sha"
          else
            sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            if tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null); then
              closed="repos/$REPO/pulls?state=closed&head=$owner:$BRANCH&base=main&sort=updated&direction=desc"
              merged=$(gh api "$closed" --jq '.[0].merged_at // empty')
              mhead=$(gh api "$closed" --jq '.[0].head.sha // empty')
              # A branch whose tip is its merge base with main carries no
              # commit main lacks: the placeholder a run leaves when it
              # created the branch at the base and then failed before the
              # commit (the commit step deletes it, but a cancelled or
              # killed runner cannot). It is reused, never deleted: the
              # bump builds on the tip read above, and the commit's
              # expectedHeadOid is that tip, so a commit pushed since makes
              # the commit fail instead of being lost. This holds whatever
              # the last closed PR was: an earlier merged PR does not make a
              # later run's placeholder anything but a placeholder.
              mbase=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq .merge_base_commit.sha)
              if [ "$tip" = "$mbase" ]; then
                sha=$tip
                echo "$BRANCH at $tip has no open PR and no commit main lacks: a leftover placeholder, reused; the commit fails if it moves"
              elif [ -n "$merged" ] && [ "$tip" = "$mhead" ]; then
                # Deleted after checkout, and only while it is still at $tip.
                stale=$tip
                echo "$BRANCH belonged to a merged PR at $tip: deleted while still there, re-created from main"
              elif [ "$tip" != "$mhead" ] && owned "$mbase" "$tip"; then
                # Every commit main lacks is one this workflow made, and no
                # PR was ever closed at this tip: a run whose commit landed
                # and that failed or was cancelled before it opened the PR.
                # The bump builds on the tip, the commit's expectedHeadOid
                # is that tip, and the PR step opens the missing PR only
                # while the branch is still at the head it expects.
                sha=$tip
                recover=$tip
                echo "$BRANCH at $tip has no open PR and carries only this workflow's verified commits: recovered, its PR is opened"
              elif [ -z "$merged" ]; then
                echo "::error::$BRANCH exists with no open PR and its last PR was not merged; close or delete it by hand (this job never force-updates a ref)"
                exit 1
              else
                echo "::error::$BRANCH is at $tip, not at the head $mhead of its merged PR: it carries later commits; close or delete it by hand"
                exit 1
              fi
            fi
            echo "no open PR on $BRANCH; building on main $sha"
          fi
          {
            echo "pr=$pr"
            echo "sha=$sha"
            echo "stale=$stale"
            echo "recover=$recover"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.base.outputs.sha }}

      # The push names the tip the base step read as the ref's expected old
      # value, which the server checks under the ref lock: the deletion
      # applies only while the branch is still there, so a commit pushed
      # since is never removed.
      - name: Delete the merged PR's branch
        if: ${{ steps.base.outputs.stale != '' }}
        env:
          STALE: ${{ steps.base.outputs.stale }}
        run: |
          set -euo pipefail
          if ! git push --force-with-lease="refs/heads/$BRANCH:$STALE" origin ":refs/heads/$BRANCH"; then
            echo "::error::$BRANCH moved from $STALE since it was read: left as it is; close or delete it by hand"
            exit 1
          fi

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # in-toolchain-image.sh runs on a copy of the checkout, so the bump,
      # the full deps-check and the build run in one container, their output
      # on stderr, and the go.mod and go.sum diff comes back on stdout.
      - name: make deps-bump, then make deps-check and make build
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # expands in the container
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            '{ make deps-bump && make deps-check && make build; } >&2 && git -c safe.directory="*" diff --binary -- ":(glob)**/go.mod" ":(glob)**/go.sum" | base64 -w0' \
            > "$RUNNER_TEMP/bump.b64"
          base64 -d "$RUNNER_TEMP/bump.b64" > "$RUNNER_TEMP/bump.patch"
          if [ ! -s "$RUNNER_TEMP/bump.patch" ]; then
            echo "deps-bump: nothing moved"
            echo "CHANGED=" >> "$GITHUB_ENV"
            exit 0
          fi
          git apply --index "$RUNNER_TEMP/bump.patch"
          git diff --cached --stat
          echo "CHANGED=$(git diff --cached --name-only | tr '\n' ' ')" >> "$GITHUB_ENV"

      # One commit through GraphQL createCommitOnBranch. GitHub makes that
      # commit itself: committer GitHub <noreply@github.com> (login web-flow),
      # signed with GitHub's key and verified, with the App bot as author.
      # That is the one GitHub-made identity ci.yml's Signatures job accepts
      # (committer email noreply@github.com, API verified, committer login
      # web-flow). The REST git/commits call would make github-actions[bot]
      # the committer, which the job rejects. The branch is created at the
      # base when missing; expectedHeadOid makes the commit fail, not race,
      # if the branch moved since the base was read. The last check reads the
      # commit back and fails here, not in the dispatched CI, if GitHub ever
      # makes it otherwise.
      - name: Commit to ci/deps-bump
        if: ${{ env.CHANGED != '' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # File contents go through a file, not an argument: a go.sum in
          # base64 can pass the 128 KiB single-argument limit.
          add="$RUNNER_TEMP/bump-additions.jsonl"
          : > "$add"
          deletions='[]'
          for f in $CHANGED; do
            if [ -f "$f" ]; then
              base64 -w0 "$f" | jq -Rsc --arg p "$f" '{path: $p, contents: .}' >> "$add"
            else
              deletions=$(jq -c --arg p "$f" '. + [{path: $p}]' <<<"$deletions")
            fi
          done
          # A branch this run creates and then fails to commit to is
          # deleted on the way out, so a failed mutation leaves no
          # placeholder for the next run's guard. The push names BASE_SHA
          # as the ref's expected old value, which the server checks under
          # the ref lock: a branch that moved since is left as it is.
          created=
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -n "$created" ]; then
              if git push --force-with-lease="refs/heads/$BRANCH:$BASE_SHA" origin ":refs/heads/$BRANCH"; then
                echo "::warning::commit failed: deleted $BRANCH, created by this run at $BASE_SHA"
              else
                echo "::warning::commit failed and $BRANCH was not deleted (it moved from $BASE_SHA, or the push failed); the next run reuses or refuses it"
              fi
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
            created=1
          fi
          body=$(git diff --cached --stat)
          # shellcheck disable=SC2016 # GraphQL variables, not shell
          query='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
          commit=$(jq -n --arg q "$query" --arg repo "$REPO" --arg br "$BRANCH" --arg head "$BASE_SHA" \
              --arg h 'deps: bump dependencies to latest (ruling 640)' --arg b "$body" \
              --slurpfile add "$add" --argjson del "$deletions" \
              '{query: $q, variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $br}, expectedHeadOid: $head, message: {headline: $h, body: $b}, fileChanges: {additions: $add, deletions: $del}}}}' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid)
          [ -n "$commit" ] || { echo "::error::createCommitOnBranch returned no commit"; exit 1; }
          v=$(gh api "repos/$REPO/commits/$commit" --jq '[(.commit.verification.verified|tostring), .commit.committer.email, (.committer.login // "none"), (.commit.message|split("\n")[0])] | @tsv')
          IFS=$'\t' read -r ok email login _ <<<"$v"
          if [ "$ok" != true ] || [ "$email" != noreply@github.com ] || [ "$login" != web-flow ]; then
            echo "::error::$commit is not a verified web-flow commit (verified=$ok committer=$email login=$login): the Signatures job would reject it"
            exit 1
          fi
          # The head the PR step opens the PR at.
          echo "HEAD_SHA=$commit" >> "$GITHUB_ENV"
          echo "deps-bump: $commit on $BRANCH (GitHub web-flow, verified)"

      - name: Open the PR and label it
        id: pr
        if: ${{ env.CHANGED != '' || steps.base.outputs.pr != '' || steps.base.outputs.recover != '' }}
        env:
          PR: ${{ steps.base.outputs.pr }}
          # This run's commit, or with none the recovered tip.
          EXPECT: ${{ env.HEAD_SHA || steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            # A PR opens on the branch by name, so the head is checked
            # before and read back after: a branch that moved from the
            # head this run made or recovered gets no PR, and a PR that
            # opened on a moved head is closed before it is labelled.
            tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)
            if [ "$tip" != "$EXPECT" ]; then
              echo "::error::$BRANCH is at $tip, not at $EXPECT: it moved; no PR opened, close or delete it by hand"
              exit 1
            fi
            changed=${CHANGED:-}
            [ -n "$changed" ] || changed="nothing new; the commits already on the branch, whose run did not open this PR"
            # shellcheck disable=SC2016 # backquotes are markdown, not a command
            body=$(printf '%s\n\n%s\n' \
              'The daily dependency bump (scans.yml, bump job): every go.mod requirement behind its latest release, with no reason comment and past the 7-day window, moved to latest, then `make deps-check` and `make build` passed.' \
              "Changed: $changed")
            PR=$(jq -n --arg t "$PR_TITLE" --arg h "$BRANCH" --arg b "$body" '{title: $t, head: $h, base: "main", body: $b}' | gh api "repos/$REPO/pulls" --input - --jq .number)
            head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            if [ "$head" != "$EXPECT" ]; then
              gh api -X PATCH "repos/$REPO/pulls/$PR" -f state=closed >/dev/null || true
              echo "::error::#$PR opened at $head, not at $EXPECT: $BRANCH moved; the PR is closed, close or delete the branch by hand"
              exit 1
            fi
            echo "opened #$PR at $EXPECT"
          fi
          gh api "repos/$REPO/issues/$PR/labels" -f 'labels[]=code-review' -f 'labels[]=task:ready' >/dev/null
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push or PR starts no pull_request run.
      - name: Dispatch CI on ci/deps-bump
        if: ${{ steps.pr.outputs.number != '' }}
        run: gh api "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref="$BRANCH"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/bump.b64" "$RUNNER_TEMP/bump.patch" "$RUNNER_TEMP/bump-additions.jsonl"
