# TEMPORARY: the ci-template v1.23 workflow_run probe, removed by the PR
# that follows the adoption. Gitea runs a workflow_run workflow only from the
# default branch's definition, so the workflow_run payload, one of the four
# items the template leaves "untested live" (ci-standard.md §8), can be proven
# only once this file is on main. The other three were proven on the adoption
# branch. Every API call is revert-red-main.yml's own, so the probe proves
# that workflow's code. Log text is never printed.

name: v1.23 Probe

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One group per triggering CI run: every completion is read, none cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: v1.23 workflow_run probe
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    env:
      BOT: ${{ secrets.AGENT_TOKEN }}
      REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      - name: workflow_run payload
        env:
          RED_RUN: ${{ github.event.workflow_run.id }}
          P_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          P_BRANCH: ${{ github.event.workflow_run.head_branch }}
          P_SHA: ${{ github.event.workflow_run.head_sha }}
          P_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          [ -n "${BOT:-}" ] || { echo "::error::AGENT_TOKEN is not set on this repository"; exit 1; }
          api() { # method path [body] -> http code; body in /tmp/api.json
            curl -sS -o /tmp/api.json -w '%{http_code}' -X "$1" \
              -H @<(printf 'Authorization: token %s\n' "$BOT") -H 'Content-Type: application/json' \
              ${3:+-d "$3"} "$REPO_API$2"
          }
          echo "payload: id=$RED_RUN conclusion=$P_CONCLUSION head_branch=$P_BRANCH head_sha=$P_SHA event=$P_EVENT"
          code=$(api GET "/actions/runs/$RED_RUN")
          echo "GET /actions/runs/$RED_RUN -> HTTP $code"
          [ "$code" = 200 ] || exit 1
          event=$(jq -r '.event // ""' /tmp/api.json)
          branch=$(jq -r '.head_branch // ""' /tmp/api.json)
          conclusion=$(jq -r '.conclusion // ""' /tmp/api.json)
          sha=$(jq -r '.head_sha // ""' /tmp/api.json)
          id=$(jq -r '.id // ""' /tmp/api.json)
          echo "api read: id=$id conclusion=$conclusion head_branch=$branch head_sha=$sha event=$event"

      - name: job-logs route
        env:
          RED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          [ -n "${BOT:-}" ] || { echo "::error::AGENT_TOKEN is not set on this repository"; exit 1; }
          api() { # method path [body] -> http code; body in /tmp/api.json
            curl -sS -o /tmp/api.json -w '%{http_code}' -X "$1" \
              -H @<(printf 'Authorization: token %s\n' "$BOT") -H 'Content-Type: application/json' \
              ${3:+-d "$3"} "$REPO_API$2"
          }
          [[ $RED_RUN =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number: $RED_RUN"; exit 1; }
          code=$(api GET "/actions/runs/$RED_RUN/jobs?limit=100")
          echo "GET /actions/runs/$RED_RUN/jobs -> HTTP $code"
          [ "$code" = 200 ] || exit 1
          cp /tmp/api.json /tmp/jobs.json
          # The log text is never printed: id, HTTP code and byte count only.
          for id in $(jq -r '.jobs[].id' /tmp/jobs.json); do
            rm -f /tmp/job.log
            code=$(curl -fsS -H @<(printf 'Authorization: token %s\n' "$BOT") "$REPO_API/actions/jobs/$id/logs" -o /tmp/job.log \
              -w '%{http_code}' 2>/dev/null || true)
            bytes=$( [ -f /tmp/job.log ] && wc -c < /tmp/job.log || echo 0 )
            echo "job $id: HTTP ${code:-none}, ${bytes// /} bytes"
          done
          rm -f /tmp/job.log
