name: Release

# go-quicraft is a LIBRARY: it has no cmd/ directory and no package main, so a
# release ships no binaries. What a Go module release actually consists of is
# the tag itself — `go get github.com/jeremyhahn/go-quicraft@vX.Y.Z` resolves
# straight from the VCS and the module proxy. This workflow therefore validates
# that the tag is releasable and publishes the GitHub release notes; it does
# not build, checksum or upload artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qEi '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A malformed tag is published forever: the module proxy caches it and it
      # cannot be retracted by deleting the tag. Validate before anything else.
      - name: Validate tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: tag v$VERSION is not a semantic version"
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "FAIL: VERSION file says '$FILE_VERSION' but the tag says '$VERSION'"
            exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          # A v2+ module must carry the major suffix in its module path, or
          # every `go get` of it silently resolves to the v1 line.
          MAJOR="${VERSION%%.*}"
          # GOWORK=off: inside a Go workspace `go list -m` prints EVERY module
          # in it, and the comparison below would then test the wrong string. CI
          # checks out this repo alone so no workspace exists there, but a
          # release cut from a developer machine inside one would misfire.
          MODULE="$(GOWORK=off go list -m)"
          if [ "$MAJOR" -ge 2 ] && [ "${MODULE##*/}" != "v$MAJOR" ]; then
            echo "FAIL: module path '$MODULE' lacks the required /v$MAJOR suffix"
            exit 1
          fi

      # Smoke check only. The full gate (lint, gosec, govulncheck, trivy,
      # -race tests, coverage threshold) runs in ci.yml on the commit this tag
      # points at; repeating it here would double a 30-minute pipeline. What
      # this catches is a tag placed on a commit that does not build.
      - name: Build
        run: go build ./...

      - name: Build FIPS variant
        run: GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout=900s ./...

      # Consumers read the release page, not the repository, so the notes have
      # to carry the section verbatim — including the on-disk break warnings,
      # which are the whole upgrade procedure for this project today.
      - name: Extract changelog section
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/       { exit }
            inside                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "FAIL: changelog section for $VERSION is empty"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "\`\`\`"
            echo "go get github.com/jeremyhahn/go-quicraft@v$VERSION"
            echo "\`\`\`"
            echo ""
            echo "See [docs/operations/compatibility.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/docs/operations/compatibility.md) for the API-stability guarantee and the upgrade path."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
