name: Release

# go-quicraft is a LIBRARY: it has no cmd/ directory and no package main, so a
# release ships no binaries. What a Go module release actually consists of is
# the tag itself — `go get github.com/jeremyhahn/go-quicraft@vX.Y.Z` resolves
# straight from the VCS and the module proxy. This workflow therefore validates
# that the tag is releasable and publishes the GitHub release notes; it does
# not build, checksum or upload artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by the inlined lint/security/trivy jobs' SARIF uploads
  # (github/codeql-action/upload-sarif), copied here from the retired
  # quality.yml's own permissions block when those jobs moved into this file
  # (go-quicraft#22).
  security-events: write

env:
  # Kept in lockstep with ci.yml's pin (issue #23). This workflow ships no
  # binaries (see the header): its job is to prove the tag is releasable. That
  # proof is only meaningful if it runs on the same toolchain the push gate
  # used — otherwise the tag is certified against a Go version nothing else
  # verified. Must never drift from ci.yml.
  GO_VERSION: "1.26.7"
  # Same rationale as the GOWORK=off inside the tag validation below, applied
  # to every job: nothing here may resolve through a workspace.
  GOWORK: "off"

jobs:
  # Split out of the old single `release` job so that a malformed tag fails in
  # seconds instead of after the ~10 minutes of gates below it. The step bodies
  # are unchanged — this is the same semver / VERSION / CHANGELOG / v2-suffix
  # validation, just hoisted into a job the gates and the publish depend on.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qEi '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A malformed tag is published forever: the module proxy caches it and it
      # cannot be retracted by deleting the tag. Validate before anything else.
      - name: Validate tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: tag v$VERSION is not a semantic version"
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "FAIL: VERSION file says '$FILE_VERSION' but the tag says '$VERSION'"
            exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          # A v2+ module must carry the major suffix in its module path, or
          # every `go get` of it silently resolves to the v1 line.
          MAJOR="${VERSION%%.*}"
          # GOWORK=off: inside a Go workspace `go list -m` prints EVERY module
          # in it, and the comparison below would then test the wrong string. CI
          # checks out this repo alone so no workspace exists there, but a
          # release cut from a developer machine inside one would misfire.
          MODULE="$(GOWORK=off go list -m)"
          if [ "$MAJOR" -ge 2 ] && [ "${MODULE##*/}" != "v$MAJOR" ]; then
            echo "FAIL: module path '$MODULE' lacks the required /v$MAJOR suffix"
            exit 1
          fi

  # ==========================================================================
  # Release gates
  #
  # The old comment here said the full gate "runs in ci.yml on the commit this
  # tag points at". That was an assumption, not a guarantee: ci.yml triggers on
  # pushes and pull requests against master/main/develop, never on a tag, so a
  # tag placed on any other commit — a release branch, a cherry-pick, a commit
  # that was force-pushed away — published with nothing but this job's smoke
  # check behind it. And even a tag on main had only the UNTAGGED suite behind
  # it, because until now that was all ci.yml ran.
  #
  # A module tag cannot be retracted, so these run here, on the exact tagged
  # tree, and `release` cannot start until every one of them is green. They are
  # the same commands as the corresponding ci.yml jobs; keep them in step.
  # ==========================================================================

  # The lint / security / trivy gates, on the EXACT commit being released.
  #
  # These ran only in ci.yml, which triggers on branches; release.yml triggers
  # on tags, so a tag published with no gosec, govulncheck, Trivy, gofmt, vet
  # or golangci-lint having run on that commit. Advisories are time-sensitive:
  # one published after the last branch build shipped unseen.
  #
  # Inlined rather than a `uses: ./.github/workflows/quality.yml` call
  # (go-quicraft#22, adopting ci-template v1.9): ci.yml's own quality.yml call
  # was retired in the same change because a workflow_call is one opaque unit
  # from the caller's side, which defeated ci.yml's staged fail-fast ordering.
  # release.yml has no such ordering to protect — nothing here needs to start
  # before lint/security/trivy finish — so these three are copied verbatim
  # from the retired quality.yml rather than kept behind an indirection only
  # one remaining caller uses.
  lint:
    name: Gate - lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The analysis tools are BAKED INTO THE RUNNER IMAGE at pinned versions
      # (`/etc/ci-runner-tools.txt`; the image build fails closed if any tool's
      # self-report disagrees with its pin), so there is nothing to install.
      #
      # This replaces `go install` steps that fetched over the network at job
      # time. They were a live flake, not a theoretical one: DNS returns an AAAA
      # record for sum.golang.org and the runner hosts have no default IPv6
      # route, so the fallback occasionally fails to complete and the install
      # dies with ENETUNREACH. Each had grown a hand-rolled 3-attempt retry loop
      # — the flake worked around locally instead of removed. Two of the three
      # also installed `@latest`, so a scan could not be attributed to a scanner
      # version at all (gosec@latest self-reports "dev").
      #
      # THIS STEP IS PER-JOB ON PURPOSE. Each job gets its own runner, and
      # nothing guarantees two jobs land on the same machine or the same image
      # instance. A verification performed in `lint` says nothing about the
      # environment `security` actually runs its scanners in — that job could
      # find no tool at all, or a different version, with the assertion never
      # applying. So every job asserts exactly the tools it itself runs.
      #
      # A tag push is the worst place to lose a run to a network blip: the tag is
      # the artifact and it is permanent, so a spurious gate failure blocks a
      # release that is actually sound.
      #
      # To change a version, do NOT add a `go install` back: ask agent-company
      # to rebuild the image, then update the pins here and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in golangci-lint; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check golangci-lint v2.13.2 "$(modver golangci-lint)"
          exit $rc

      # THE PUBLIC GITHUB MIRROR is a different machine entirely. There
      # `ubuntu-latest` resolves to GitHub's stock Ubuntu image, which bakes none
      # of these, so the verification above would fail before any analysis ran
      # and the mirror's CI would be a false negative on every push. Provision
      # them there, at the SAME pins, so the mirror gates on the same rule set.
      #
      # No retry loop, deliberately: the flake these steps were removed for is
      # the AAAA-record/no-IPv6-route defect on OUR runner hosts, which is not a
      # property of GitHub-hosted runners. Re-adding a retry here would be
      # cargo-culting a workaround into the one environment that never had the
      # problem.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  security:
    name: Gate - security
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6


      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The analysis tools are BAKED INTO THE RUNNER IMAGE at pinned versions
      # (`/etc/ci-runner-tools.txt`; the image build fails closed if any tool's
      # self-report disagrees with its pin), so there is nothing to install.
      #
      # This replaces `go install` steps that fetched over the network at job
      # time. They were a live flake, not a theoretical one: DNS returns an AAAA
      # record for sum.golang.org and the runner hosts have no default IPv6
      # route, so the fallback occasionally fails to complete and the install
      # dies with ENETUNREACH. Each had grown a hand-rolled 3-attempt retry loop
      # — the flake worked around locally instead of removed. Two of the three
      # also installed `@latest`, so a scan could not be attributed to a scanner
      # version at all (gosec@latest self-reports "dev").
      #
      # THIS STEP IS PER-JOB ON PURPOSE. Each job gets its own runner, and
      # nothing guarantees two jobs land on the same machine or the same image
      # instance. A verification performed in `lint` says nothing about the
      # environment `security` actually runs its scanners in — that job could
      # find no tool at all, or a different version, with the assertion never
      # applying. So every job asserts exactly the tools it itself runs.
      #
      # A tag push is the worst place to lose a run to a network blip: the tag is
      # the artifact and it is permanent, so a spurious gate failure blocks a
      # release that is actually sound.
      #
      # To change a version, do NOT add a `go install` back: ask agent-company
      # to rebuild the image, then update the pins here and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in gosec govulncheck; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check gosec        v2.29.0 "$(modver gosec)"
          check govulncheck  v1.7.0  "$(modver govulncheck)"
          exit $rc

      # THE PUBLIC GITHUB MIRROR is a different machine entirely. There
      # `ubuntu-latest` resolves to GitHub's stock Ubuntu image, which bakes none
      # of these, so the verification above would fail before any analysis ran
      # and the mirror's CI would be a false negative on every push. Provision
      # them there, at the SAME pins, so the mirror gates on the same rule set.
      #
      # No retry loop, deliberately: the flake these steps were removed for is
      # the AAAA-record/no-IPv6-route defect on OUR runner hosts, which is not a
      # property of GitHub-hosted runners. Re-adding a retry here would be
      # cargo-culting a workaround into the one environment that never had the
      # problem.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Keep this exclude list identical to ci.yml's security job and to
      # GOSEC_EXCLUDE in the Makefile; see ci.yml for the per-rule
      # justifications.
      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec.sarif -exclude=G103,G104,G115,G301,G304,G306,G404 -exclude-dir=test -exclude-dir=examples -exclude-dir=contrib -severity=medium -confidence=medium ./...

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec-release

      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    name: Gate - trivy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs-release

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

  integration:
    name: Gate - integration suite
    runs-on: ubuntu-latest
    # Runs alone, for the same reason ci.yml chains its heavy jobs:
    # this suite stands up multi-node QUIC clusters under -race, and its waits
    # are measured in seconds. Fanned out beside six fuzz gates, the errfs
    # suite and the module build on one 20-core self-hosted runner, it lost a
    # 30-second replication wait — which is exactly how the v0.4.0-alpha
    # release gate failed. The fuzz, errfs and module gates are cheap and
    # stay parallel with each other; nothing here needs their OUTPUT, so the
    # dependency is purely to keep them off the runner at the same time.
    # `netfault` is chained AFTER this job for the same reason, so the two heavy
    # QUIC lanes never share the runner either.
    needs: [validate, errfs, fuzz, modules]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # -p 1: see the identical step in ci.yml. Concurrent multi-node QUIC
      # packages under -race starve the runner and flake snapshot catch-up.
      - name: Run integration suite
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  # The one lane that can construct a LIVE network partition.
  #
  # This gate existed in ci.yml but not here, so it ran on branches and pull
  # requests and NOT on the tag pipeline that publishes — and a tag can sit on a
  # commit ci.yml never saw (release branch, cherry-pick, force-push), which is
  # the whole reason the other gates were moved into this file.
  #
  # What it protects is not incremental. Every other "partition" test in the
  # repository calls stopNode, which is a process kill, so a quorum weakened
  # from a strict majority to n/2 passed 18 of 19 linearizability tests. This
  # suite catches that mutant in about 1.1 seconds because it deposes a leader
  # that is still RUNNING and still believes it leads.
  #
  # Serialised behind `integration`, exactly as in ci.yml. `integration` already
  # waits on errfs/fuzz/modules, so by the time this starts the runner is empty:
  # adding it lengthens the pipeline by one job but puts nothing new beside the
  # heavy QUIC lanes. That ordering is deliberate — these tests wait on election
  # timeouts, and a contended 20-core self-hosted runner turns a real timing
  # assertion into a flake, which is how the v0.4.0-alpha release gate failed.
  netfault:
    name: Gate - network partitions [build tag quicraft_netfault]
    runs-on: ubuntu-latest
    needs: [validate, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # Same Makefile target ci.yml and a developer run. The suite is
      # self-guarding: every test asserts netfault.BlockedCount() is non-zero,
      # so a missing build tag fails the job instead of silently exercising a
      # healthy cluster.
      - name: Run network-partition suite
        run: make ci-netfault

  errfs:
    name: Gate - errfs injection
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run errfs suite
        run: go test -race -count=1 -tags=quicraft_errfs ./test/errfs/...

  fuzz:
    name: Gate - fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Go's fuzzing engine starts one worker per CPU, so six of these jobs at
      # once put ~24 workers on a 20-core runner. That does not corrupt a
      # result — a fuzz worker has no timing assertions — but it does starve
      # the coordinator's shutdown RPC, which surfaces as a bare
      # "context deadline exceeded" AFTER the full -fuzztime has elapsed and
      # reads exactly like a crash. It is not one; it is the gate failing on
      # its own scheduling.
      #
      # max-parallel is declared for hosts that honour it. Gitea's act_runner
      # does NOT: on release 424 all six jobs started within the same second
      # with this set to 3. The enforceable half of the fix is -parallel on the
      # fuzz command itself, below, which Go applies rather than the runner.
      # The integration gate no longer overlaps these at all (see its `needs`).
      max-parallel: 3
      matrix:
        package:
          - ./pkg/proto
          - ./pkg/internal/transport
          - ./pkg/internal/session
          - ./pkg/internal/raft
          - ./pkg/logdb/waldb
          - ./pkg/seal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Two passes with different jobs to do. The seed pass is the gate: it is
      # deterministic, it covers every target, and it must pass. The bounded
      # mutation pass afterwards is a last look for a crash that the committed
      # corpus does not already encode — 10s per target, not a real fuzzing
      # budget (that is fuzz.yml's nightly schedule), but a release is the one
      # moment where spending a couple of extra minutes is obviously correct.
      - name: Seed and committed-corpus pass
        run: go test -race -count=1 -tags=quicraft_fuzz -run=Fuzz '${{ matrix.package }}'

      # Runs the same Makefile target a developer runs (devops.md §4). This was
      # inline shell, which meant the release gate could not be reproduced
      # locally at all — and it failed release 425 on the coordinator shutdown
      # artefact, not on a finding. ci-fuzz-mutation separates the two on the
      # signal Go itself gives: a crash always writes a reproducer, so only the
      # no-reproducer deadline case is retried, and a real crash cannot be
      # retried away.
      - name: Bounded mutation pass
        run: make ci-fuzz-mutation FUZZ_MUT_PKGS='${{ matrix.package }}'

  modules:
    name: Gate - sibling modules build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Discovered rather than listed: a go.mod nobody remembered to enrol is
      # precisely the failure being prevented. ci.yml runs the same loop — it
      # used to fan out across a matrix instead, which turned out never to
      # expand, leaving this job as the only one that has ever built a nested
      # module. Keep the two in step, MODULE_FLOOR included: without the floor
      # a discovery that returns nothing reads as a clean gate.
      - name: Build and vet every module in the tree
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          FAILED=""
          for dir in ${MODULES}; do
            echo "==> ${dir}"
            if ! (cd "${dir}" && go build ./... && go vet ./...); then
              FAILED="${FAILED} ${dir}"
            fi
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: module(s) did not build or vet cleanly:${FAILED}"
            exit 1
          fi

  contrib-dragonboat:
    name: Gate - contrib/dragonboat compatibility [unit + integration]
    runs-on: ubuntu-latest
    # Runs after the other heavy suites rather than beside them: this stands up
    # multi-node QUIC clusters through the dragonboat compatibility API under
    # -race, and sharing a runner with `integration`/`netfault` starves CPU
    # enough to flake 30s waits. Same reasoning as ci.yml's chaining.
    needs: [validate, integration, netfault]
    timeout-minutes: 45
    # WHY THIS EXISTS (go-quicraft#3). CI proves the compatibility API works on
    # a commit; this proves it for the ARTIFACT being shipped. The two are not
    # the same claim — a tag is built from a tree that no CI run necessarily
    # examined in this exact combination, and for a compatibility shim the
    # thing consumers depend on is precisely that it still behaves like
    # dragonboat at the released version.
    #
    # It runs the SAME two suites as ci.yml's contrib-dragonboat job, not a
    # reduced smoke subset: a release gate that verifies less than the push
    # gate would let a defect through exactly when it is most expensive to fix.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run contrib/dragonboat unit tests
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -timeout=900s ./...

      # -p 1 is load-bearing, not caution: every package here spins up
      # multi-node QUIC clusters under -race, and running them concurrently
      # starves runner CPU enough to flake the tests with 30s waits.
      - name: Run contrib/dragonboat integration suite
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  release:
    name: Publish
    runs-on: ubuntu-latest
    # Nothing publishes until every gate above is green. This is the whole
    # point of the restructuring: the tag is the artifact, and it is permanent.
    needs: [validate, lint, security, trivy, integration, netfault, errfs, fuzz, modules, contrib-dragonboat]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Smoke check only; the gate jobs above carry the real weight. What this
      # still catches on its own is a tag placed on a commit that does not
      # build at all.
      - name: Build
        run: go build ./...

      - name: Build FIPS variant
        run: GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      # Byte-identical to the ci.yml `test` job, deliberately. This step used
      # to drop BOTH -race and the coverage threshold, so the race-enabled unit
      # suite never ran on a tag at all.
      - name: Test
        run: |
          go test -race -count=1 -timeout=900s -coverprofile=coverage.out ./...
          if [ ! -s coverage.out ]; then
            echo "FAIL: coverage.out is missing or empty; the test run produced no coverage data"
            exit 1
          fi
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          case "${COVERAGE}" in
            '' | *[!0-9.]* )
              echo "FAIL: coverage could not be read from coverage.out (got '${COVERAGE}')"
              exit 1 ;;
          esac
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < 91" | bc -l) -eq 1 ]; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum 91%"
            exit 1
          fi

      # Consumers read the release page, not the repository, so the notes have
      # to carry the section verbatim — including the on-disk break warnings,
      # which are the whole upgrade procedure for this project today.
      - name: Extract changelog section
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/       { exit }
            inside                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "FAIL: changelog section for $VERSION is empty"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "\`\`\`"
            echo "go get github.com/jeremyhahn/go-quicraft@v$VERSION"
            echo "\`\`\`"
            echo ""
            echo "See [docs/operations/compatibility.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/docs/operations/compatibility.md) for the API-stability guarantee and the upgrade path."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          body_path: release-notes.md
