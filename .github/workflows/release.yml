name: Release

# go-quicraft is a library with no binaries, so a release is the tag itself:
# `go get github.com/jeremyhahn/go-quicraft@vX.Y.Z` resolves from the VCS and the
# module proxy. This workflow checks that the tag is releasable, runs the
# release gates on the tagged tree, and publishes the release notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by the SARIF uploads in the lint, security and trivy jobs.
  security-events: write

env:
  # Must match ci.yml, so the tag is certified on the toolchain the push gate
  # used.
  GO_VERSION: "1.27.0"
  # Nothing here may resolve through a workspace.
  GOWORK: "off"

jobs:
  # A separate job so a malformed tag fails in seconds, before the gates.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      # The commit this job approved. The publish job refuses anything else;
      # see the immutability guard there.
      approved_sha: ${{ steps.approved.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Recorded BEFORE the gates run, so it names the tree this job actually
      # validated rather than whatever the tag points at later.
      - name: Record the approved commit
        id: approved
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qEi '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A malformed tag is published forever: the module proxy caches it and it
      # cannot be retracted by deleting the tag. Validate before anything else.
      - name: Validate tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "FAIL: tag v$VERSION is not a semantic version"
            exit 1
          fi
          # Compare BYTES against the writer inverted, never normalize.
          # `tr -d '[:space:]'` accepts '0.9. 1-alpha', a VERSION split across
          # lines, and a file with no trailing newline — each of which publishes
          # a VERSION that does not match its own tag. The Makefile writes this
          # file with `printf '%s\n'`, so this is that exact statement read
          # backwards; on mismatch dump the bytes, because the difference is
          # usually invisible in an echo.
          if ! printf '%s\n' "$VERSION" | cmp -s - VERSION; then
            echo "FAIL: the VERSION file does not match the tag byte for byte."
            echo "tag:          '$VERSION'"
            echo "VERSION file:"
            od -c VERSION
            exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          # A v2+ module must carry the major suffix in its module path, or
          # every `go get` of it silently resolves to the v1 line.
          MAJOR="${VERSION%%.*}"
          # GOWORK=off: inside a Go workspace `go list -m` prints EVERY module
          # in it, and the comparison below would then test the wrong string. CI
          # checks out this repo alone so no workspace exists there, but a
          # release cut from a developer machine inside one would misfire.
          MODULE="$(GOWORK=off go list -m)"
          if [ "$MAJOR" -ge 2 ] && [ "${MODULE##*/}" != "v$MAJOR" ]; then
            echo "FAIL: module path '$MODULE' lacks the required /v$MAJOR suffix"
            exit 1
          fi

  # ==========================================================================
  # Release gates
  #
  # ci.yml does not run on tags, and a tag can point at a commit ci.yml never
  # saw. A module tag cannot be retracted, so the gates run here on the exact
  # tagged tree, and `release` waits for all of them. They are the same
  # commands as the matching ci.yml jobs; keep them in step.
  # ==========================================================================

  # Lint, security and trivy on the exact commit being released. Advisories
  # are time-sensitive, so one published since the last branch build is caught
  # here.
  lint:
    name: Gate - lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # On the self-hosted runners the analysis tools are baked into the runner
      # image at pinned versions. Each job verifies the tools it runs itself,
      # because jobs do not share a machine. To change a version, rebuild the
      # image and update the pins here, in ci.yml and in the Makefile.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in golangci-lint; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check golangci-lint v2.13.2 "$(modver golangci-lint)"
          exit $rc

      # GitHub-hosted runners bake none of these tools, so install them at the
      # same pins.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  security:
    name: Gate - security
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6


      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Verify the tools baked into the runner image; see the lint job.
      - name: Verify baked analysis tools
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          rc=0
          check() { # <tool> <expected> <actual>
            if [ "$3" != "$2" ]; then
              echo "FAIL $1: image has '$3', this repo pins '$2'"; rc=1
            else
              echo "OK   $1 $2"
            fi
          }
          # Versions come from the binary's BUILD INFO, not its --version string.
          # gosec self-reports "dev" unless its version is injected via ldflags
          # at image-build time, so parsing --version would reject a correctly
          # pinned binary built by a plain `go install`; govulncheck's first
          # --version line is the Go version when go is on PATH and the scanner
          # version otherwise. `go version -m` reads the module version recorded
          # in the binary itself, which is uniform across all three tools and
          # independent of how the image chose to build them.
          modver() { go version -m "$(command -v "$1")" 2>/dev/null | awk '$1=="mod"{print $3; exit}'; }
          for t in gosec govulncheck; do
            command -v "$t" >/dev/null 2>&1 || { echo "FAIL $t: not in the runner image"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "The runner image is missing a baked tool."; exit 1; }
          check gosec        v2.29.0 "$(modver gosec)"
          check govulncheck  v1.7.0  "$(modver govulncheck)"
          exit $rc

      # GitHub-hosted runners bake none of these tools, so install them at the
      # same pins.
      - name: Provision analysis tools (GitHub-hosted)
        if: github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Keep this exclude list identical to ci.yml's security job and to
      # GOSEC_EXCLUDE in the Makefile; see ci.yml for the per-rule
      # justifications.
      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec.sarif -exclude=G103,G104,G115,G301,G304,G306,G404 -exclude-dir=test -exclude-dir=examples -exclude-dir=contrib -severity=medium -confidence=medium ./...

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: gosec.sarif
          category: gosec-release

      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    name: Gate - trivy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs-release

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

  integration:
    name: Gate - integration suite
    runs-on: ubuntu-latest
    # Runs after the cheap gates rather than beside them. This suite starts
    # multi-node QUIC clusters under -race, and sharing the runner with the
    # fuzz, errfs and module gates expires its 30s replication waits. Nothing
    # here needs their output; the dependency only keeps them apart.
    # `netfault` runs after this job for the same reason.
    needs: [validate, errfs, fuzz, modules]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # -p 1: see the matching step in ci.yml.
      - name: Run integration suite
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  # The only suite that builds a live network partition: it deposes a leader
  # that is still running and still believes it leads. Every other partition
  # test stops the node outright. Serialised behind `integration`, as in
  # ci.yml, because these tests wait on election timeouts.
  netfault:
    name: Gate - network partitions [build tag quicraft_netfault]
    runs-on: ubuntu-latest
    needs: [validate, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      # Same Makefile target as ci.yml. Every test asserts
      # netfault.BlockedCount() is non-zero, so a missing build tag fails the
      # job.
      - name: Run network-partition suite
        run: make ci-netfault

  errfs:
    name: Gate - errfs injection
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run errfs suite
        run: go test -race -count=1 -tags=quicraft_errfs ./test/errfs/...

  fips:
    name: Gate - FIPS [GODEBUG=fips140=only]
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Publish only builds the FIPS variant. These steps prove the code runs
      # under the approved-only module, matching nightly.yml's FIPS job, so a
      # release does not depend on the last nightly being green. The transport
      # suite starts real QUIC listeners.
      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Compile under the module, tagged and untagged
        run: make build-fips

      - name: Approved-only gate
        run: make verify-fips

      - name: Exempt revocation tree, FIPS mode
        run: make verify-fips-exempt

  zero-rtt:
    name: Gate - 0-RTT replay policy [no -race]
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Publish runs `go test -race`, and this test skips under the race
      # detector (the race is inside quic-go's DialAddrEarly path). This gate
      # verifies that a snapshot arriving as 0-RTT early data is refused.
      - name: Run the 0-RTT tests without the race detector
        run: go test -count=1 -run '0RTT' ./pkg/internal/transport/

  fuzz:
    name: Gate - fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Go's fuzzer starts one worker per CPU. Too many concurrent fuzz jobs
      # starve the coordinator's shutdown RPC, which shows up as "context
      # deadline exceeded" after -fuzztime and looks like a crash.
      # max-parallel is ignored by some runners (act_runner among them), so
      # the Makefile target also limits -parallel.
      max-parallel: 3
      matrix:
        package:
          - ./pkg/proto
          - ./pkg/internal/transport
          - ./pkg/internal/session
          - ./pkg/internal/raft
          - ./pkg/logdb/waldb
          - ./pkg/seal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The seed pass is the gate: deterministic, covers every target, and must
      # pass. The bounded mutation pass afterwards is a short last look for a
      # crash the committed corpus does not encode; real fuzzing is fuzz.yml's
      # nightly schedule.
      - name: Seed and committed-corpus pass
        run: go test -race -count=1 -tags=quicraft_fuzz -run=Fuzz '${{ matrix.package }}'

      # The same Makefile target a developer runs. ci-fuzz-mutation budgets each
      # target as an execution count rather than a duration; see the Makefile.
      - name: Bounded mutation pass
        run: make ci-fuzz-mutation FUZZ_MUT_PKGS='${{ matrix.package }}'

  modules:
    name: Gate - sibling modules build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Discovered rather than listed, so a new go.mod is enrolled
      # automatically. Keep this in step with ci.yml, MODULE_FLOOR included:
      # without the floor, a discovery that finds nothing passes.
      - name: Build and vet every module in the tree
        run: |
          set -uo pipefail
          MODULE_FLOOR=6
          MODULES="$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | sort)"
          COUNT="$(printf '%s\n' "${MODULES}" | grep -c . || true)"
          echo "Discovered ${COUNT} module(s):"
          printf '%s\n' "${MODULES}"
          if [ "${COUNT}" -lt "${MODULE_FLOOR}" ]; then
            echo "FAIL: discovered ${COUNT} modules but expected at least ${MODULE_FLOOR}."
            echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
            echo "Otherwise discovery has broken and this gate is verifying nothing."
            exit 1
          fi
          FAILED=""
          for dir in ${MODULES}; do
            echo "==> ${dir}"
            if ! (cd "${dir}" && go build ./... && go vet ./...); then
              FAILED="${FAILED} ${dir}"
            fi
          done
          if [ -n "${FAILED}" ]; then
            echo "FAIL: module(s) did not build or vet cleanly:${FAILED}"
            exit 1
          fi

  contrib-dragonboat:
    name: Gate - contrib/dragonboat compatibility [unit + integration]
    runs-on: ubuntu-latest
    # Runs after the other heavy suites: it starts multi-node QUIC clusters
    # under -race, and sharing the runner flakes the 30s waits.
    needs: [validate, integration, netfault]
    timeout-minutes: 45
    # Runs the same two suites as ci.yml's contrib-dragonboat job, on the
    # exact tree being tagged.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Run contrib/dragonboat unit tests
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -timeout=900s ./...

      # -p 1 is required: every package here starts multi-node QUIC clusters
      # under -race, and running them concurrently flakes the 30s waits.
      - name: Run contrib/dragonboat integration suite
        working-directory: contrib/dragonboat
        run: go test -race -count=1 -tags=integration -timeout=1800s -p 1 ./test/integration/...

  release:
    name: Publish
    runs-on: ubuntu-latest
    # Nothing publishes until every gate above is green.
    needs: [validate, lint, security, trivy, integration, netfault, errfs, fips, zero-rtt, fuzz, modules, contrib-dragonboat]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4


      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Smoke check; the gate jobs above carry the real weight.
      - name: Build
        run: go build ./...

      - name: Build FIPS variant
        run: GOFIPS140=v1.0.0 CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      # Runs the race-enabled suite with a coverage floor, like ci.yml's
      # `test` job.
      - name: Test
        run: |
          go test -race -count=1 -timeout=900s -coverprofile=coverage.out ./...
          if [ ! -s coverage.out ]; then
            echo "FAIL: coverage.out is missing or empty; the test run produced no coverage data"
            exit 1
          fi
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          case "${COVERAGE}" in
            '' | *[!0-9.]* )
              echo "FAIL: coverage could not be read from coverage.out (got '${COVERAGE}')"
              exit 1 ;;
          esac
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < 91" | bc -l) -eq 1 ]; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum 91%"
            exit 1
          fi

      # The release notes carry the changelog section verbatim, including any
      # on-disk format break warnings.
      - name: Extract changelog section
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/       { exit }
            inside                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "FAIL: changelog section for $VERSION is empty"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "\`\`\`"
            echo "go get github.com/jeremyhahn/go-quicraft@v$VERSION"
            echo "\`\`\`"
            echo ""
            echo "See [docs/compatibility.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/docs/compatibility.md) for the API-stability guarantee and the upgrade path."
          } >> release-notes.md

      # Tag immutability, checked against the remote.
      #
      # Comparing this job's HEAD with the approved commit cannot fail: on a
      # tag push, actions/checkout checks out the event SHA in every job. The
      # publish step resolves `tag_name` by name at publish time, so a tag
      # force-moved mid-release would publish an unvalidated commit. So resolve
      # what the tag points at on the remote now, peeled (`^{}`) because an
      # annotated tag's ref names the tag object, and require the approved
      # commit.
      #
      # Fails on a missing, ambiguous or mismatched tag, and on an empty
      # approved value. It does not fall back to checking out the approved
      # commit: a moved tag needs a human to look at it.
      - name: Refuse a tag that moved after validation
        env:
          APPROVED: ${{ needs.validate.outputs.approved_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVED:-}" ]; then
            echo "FAIL: validate published no approved commit. Refusing to publish"
            echo "      an unverified tree; an empty guard is not a passing guard."
            exit 1
          fi
          if [ -z "${TAG:-}" ]; then
            echo "FAIL: no tag name in the event; cannot resolve what is being published."
            exit 1
          fi

          # Peeled line first: for an ANNOTATED tag refs/tags/<t> is the tag
          # object and refs/tags/<t>^{} is the commit. A lightweight tag has
          # only the former, and it already points at the commit.
          refs="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          REMOTE_SHA="$(printf '%s\n' "$refs" | awk -v t="refs/tags/${TAG}^{}" '$2==t{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(printf '%s\n' "$refs" | awk -v t="refs/tags/${TAG}" '$2==t{print $1}')"
          fi

          if [ -z "$REMOTE_SHA" ]; then
            echo "FAIL: tag $TAG does not exist on the remote any more."
            echo "It was deleted or renamed mid-release. Nothing is published."
            exit 1
          fi
          if [ "$(printf '%s\n' "$REMOTE_SHA" | wc -l)" -ne 1 ]; then
            echo "FAIL: tag $TAG resolves ambiguously on the remote:"
            printf '%s\n' "$refs"
            exit 1
          fi
          if [ "$REMOTE_SHA" != "$APPROVED" ]; then
            echo "FAIL: the tag moved after it was validated."
            echo "  validate approved:      $APPROVED"
            echo "  $TAG now points at:     $REMOTE_SHA"
            echo "A published tag is immutable by convention; something moved this one"
            echo "mid-release, so every gate above validated a tree that is not the one"
            echo "about to be published. Not falling back to the approved commit -- a"
            echo "human needs to see this."
            exit 1
          fi
          echo "OK: $TAG still points at the commit validate approved ($APPROVED)"
      # This guard must stay immediately before the publish step, with no
      # executable step between: it only covers the window it precedes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          body_path: release-notes.md
