# nightly-template: v1.0 (customized) — the known-red and long-horizon jobs,
# off the push path.
#
# Owner ruling 2026-08-20 (fail-fast pipeline for iteration speed): jobs that
# are known-red with tracked issues, or that verify a slow-moving property, do
# NOT run per push — a known-red job burning runner-minutes per push produces
# information we already have. They run here nightly, plus on demand via
# workflow_dispatch, and are NOT in any merge gate. When their tracked issues
# land (FIPS: go-quicraft#24's runner-contention flake; Trivy: the
# install/log diagnosis), a job may move back to ci.yml — that move is
# deliberate, not automatic. Adopted here via go-quicraft#22.
#
# CUSTOMIZE applied: the `fips` job mirrors go-quicraft's own two-tier FIPS
# verification exactly as it ran in ci.yml before this move — `make
# build-fips` (compile under the module, tagged and untagged), `make
# verify-fips` (GODEBUG=fips140=only over every package except
# pkg/internal/transport/revocation, so the QUIC transport IS judged under
# approved-only), and `make verify-fips-exempt` (GODEBUG=fips140=on,
# pkg/internal/transport/revocation only — one notch lower because the OCSP
# CertID is SHA-1 by protocol definition; see the FIPS block in the Makefile
# and docs/quic-transport/architecture.md for the exemption record). A bare
# `go test ./...` would drag in build-tag-gated suites the Test job
# deliberately excludes and fail for reasons that have nothing to do with FIPS.
#
# The QUIC packet-protection exemption was retired in go-quicraft#85: quic-go
# v0.60.0 routes packet AEADs through Go's TLS 1.3 AES-GCM implementation, so
# the transport passes under fips140=only and is inside the approved-only gate.
#
# The `trivy` job is copied verbatim from the retired quality.yml, including
# go-quicraft's skip-dirs (test, examples, contrib — none of which ship in a
# release).
#
# That skip-dirs list used to end "contrib's deps are tracked via Dependabot
# like the others", and so did the comment on the job itself. Both were false,
# and go-quicraft#86 is what they cost. `.github/dependabot.yml` is real and
# thorough — eleven update entries, every Go module, the Rust rig, the actions,
# the Docker bases — and it has never run once, because Dependabot is a
# github.com service and this repository has no `github` remote at all
# (`git ls-remote github` answers "does not appear to be a git repository").
# Six direct dependencies drifted while two comments in this file asserted they
# were being watched. The `deps` job below is the replacement that runs where
# the code actually lives.
#
# Source of truth: software/templates/github-actions/nightly.yml in the
# automatethethings repo (v1.0, commit 2732bc0). Pushed directly per the
# workflow/CI-configuration carve-out (conventions/sdlc.md §"What requires a
# PR").

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  # Kept in lockstep with ci.yml's pin (issue #23) — a nightly FIPS/trivy
  # sweep that runs on a different toolchain than the push gate is not
  # verifying the thing the push gate ships.
  GO_VERSION: "1.27.0"
  GOWORK: "off"

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The transport suite in the last step starts real QUIC listeners.
      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Compile under the module, tagged and untagged
        run: make build-fips

      # GODEBUG=fips140=only over every package except
      # pkg/internal/transport/revocation. Since go-quicraft#85 this INCLUDES
      # the QUIC transport, which is the slowest tree in the run and the reason
      # this job's timeout has headroom. It is also where go-quicraft#24's
      # flake now lands (10s waitBatch timeout under runner contention, worse
      # under FIPS mode's non-X25519 key exchange). Running here off the push
      # path was that issue's mitigation; #24 was closed on it, not on a fix.
      # release.yml runs the same gate, so a release pays the flake's rerun
      # cost rather than shipping without the approved-only proof.
      - name: Approved-only gate
        run: make verify-fips

      # pkg/internal/transport/revocation under GODEBUG=fips140=on. It is one
      # notch lower because the OCSP CertID (RFC 6960 s4.1.1) is SHA-1 by
      # protocol definition, inside golang.org/x/crypto/ocsp. The exemption is
      # recorded with its citation in docs/quic-transport/architecture.md; this
      # step is what keeps the exempt tree gated rather than merely excluded.
      - name: Exempt revocation tree, FIPS mode
        run: make verify-fips-exempt

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # A fresh source-scoped scan is uploaded to GitHub code scanning on every
      # run, so the dashboard never reflects a stale analysis. Benchmark
      # harnesses (test/performance/*), examples, and contrib adapters are
      # excluded — none ship in a release. Their dependency freshness is the
      # `deps` job's business, not Dependabot's (see the header).
      # NOTE: do NOT image-scan the .devcontainer dev image into code scanning;
      # that surfaces base-OS/toolchain CVEs that are not go-quicraft source vulns.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action's setup checks out aquasecurity/trivy from github.com
        # with the runner token, which a Gitea token cannot authenticate.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      # Same gate on Gitea, via the trivy CLI installed from the release
      # tarball (anonymous download — no github.com auth involved).
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

      # Misconfiguration scanning (owner ruling 2026-08-20, task #27): advisory
      # exit code, so findings surface daily without a new finding class
      # blocking merges.
      - name: Trivy misconfiguration scan (advisory)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

  deps:
    name: Dependency freshness
    runs-on: ubuntu-latest
    # needs: none — like the other nightly jobs this stands alone and gates no
    # merge. It reports a fact about the world (a dependency published a
    # release), not a fact about a commit, so it must never sit on the push
    # path: failing someone's PR for an upstream release they had nothing to do
    # with is how a gate gets ignored.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make deps-check` — the Makefile is the contract (devops.md §4), so
      # this is the same command a developer runs, not a workflow-only flag
      # set. It walks every go.mod in the tree with the exact `go list -m -u`
      # invocation CLAUDE.md documents, and exempts a lagging module only when
      # its require line carries a DOCUMENTED PIN comment (devops.md §9).
      #
      # Runs on BOTH hosts unguarded: it needs no credential either host
      # lacks, and the drift it looks for is identical on both. Gitea is where
      # it matters, since that is the only plane this repository is pushed to.
      - name: Every direct dependency on its current release
        run: make deps-check
