# Nightly jobs that verify slow-moving properties: FIPS mode, Trivy and
# dependency freshness. They run on a schedule or on demand and gate no merge.
#
# The FIPS job runs the Makefile's two-tier verification: `make build-fips`,
# `make verify-fips` (GODEBUG=fips140=only over every package except
# pkg/internal/transport/revocation) and `make verify-fips-exempt`
# (fips140=on for the revocation tree, whose OCSP CertID is SHA-1 by protocol
# definition). See the FIPS block in the Makefile and
# docs/quic-transport/architecture.md.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  # Must match ci.yml's pin.
  GO_VERSION: "1.27.0"
  GOWORK: "off"

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # Runs standalone; build health is ci.yml's job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The transport suite in the last step starts real QUIC listeners.
      - name: Tune QUIC UDP buffers
        run: sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032

      - name: Compile under the module, tagged and untagged
        run: make build-fips

      # GODEBUG=fips140=only over every package except
      # pkg/internal/transport/revocation, including the QUIC transport. The
      # transport tree is the slowest part of the run, hence the timeout.
      # release.yml runs the same gate.
      - name: Approved-only gate
        run: make verify-fips

      # pkg/internal/transport/revocation under GODEBUG=fips140=on. The OCSP
      # CertID (RFC 6960 s4.1.1) is SHA-1 by protocol definition, inside
      # golang.org/x/crypto/ocsp; docs/quic-transport/architecture.md records
      # the exemption. This keeps the exempt tree tested rather than excluded.
      - name: Exempt revocation tree, FIPS mode
        run: make verify-fips-exempt

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Benchmark harnesses (test/performance/*), examples and contrib adapters
      # are excluded; none ship in a release. Do not image-scan the
      # .devcontainer image here: its base-OS and toolchain CVEs are not
      # findings in this source tree.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action fetches aquasecurity/trivy from github.com with the
        # runner token, which only works on GitHub.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      # Elsewhere, install the trivy CLI from the release tarball (anonymous
      # download).
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

      # Advisory: findings surface daily without blocking anything.
      - name: Trivy misconfiguration scan (advisory)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

  deps:
    name: Dependency freshness
    runs-on: ubuntu-latest
    # Gates no merge: it reports that a dependency published a release, which
    # is not a fact about any commit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same `make deps-check` a developer runs. It walks every go.mod in
      # the tree and exempts a lagging module only when its require line
      # carries a documented pin comment.
      - name: Every direct dependency on its current release
        run: make deps-check
