# nightly-template: v1.9 (customized)
# v1.9 (2026-10-31, Company Agent m1804, ci-template v1.30 fix 2): a
# `lint-sweeps` job runs the repository's `make -k lint-sweeps` in its
# toolchain image, nightly and on dispatch only, when the Makefile (or a
# tracked *.mk) defines the target; without one it prints OK and passes. A
# repository's lint sweeps never run in ci.yml: go-qrdb's ran in its PR lint
# job at a 72-hour p95 of 87 minutes. It runs on ubuntu-latest and needs the
# scripts ci.yml ships (in-toolchain-image.sh, ci-image-cache.sh,
# trim-ci-caches.sh). timeout-minutes is CUSTOMIZE, ceil(1.5 x the 72-hour p95).
# >>> CUSTOMIZE (go-quicraft): this file adopts the v1.9 lint-sweeps job only.
# Its schedule, its fips job and the template's trivy job are not taken: the
# nightly is dispatch-only and FIPS runs in ci.yml's full tier, where CI Gate
# checks it (#293).
# <<< CUSTOMIZE
#
# Nightly jobs that verify slow-moving properties: lint sweeps, Trivy and
# dependency freshness. They gate no merge and run only when dispatched: the coordinator
# dispatches the nightly by hand, and there is no schedule (#293).
#
# The FIPS job moved to ci.yml's full tier (#293), where CI Gate checks it.

name: Nightly

on:
  workflow_dispatch:

env:
  # Must match ci.yml's pin.
  GO_VERSION: "1.27.4"
  GOWORK: "off"

jobs:
  # v1.9: the repository's lint sweeps (whole-tree, slow lint passes beside
  # `make lint`), off every push and PR path (ci-standard.md §12).
  lint-sweeps:
    name: Lint sweeps [toolchain image]
    runs-on: ubuntu-latest
    timeout-minutes: 15       # CUSTOMIZE (go-quicraft, #503): no lint-sweeps target yet, so the job is its probe; hosted-runner headroom until one lands
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: main
      CI_IMAGE_NAMESPACE: ci-images
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Does the Makefile define lint-sweeps?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-sweeps[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-sweeps target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the toolchain image from the registry cache
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # -k: a sweep reports every finding in one run; it gates no merge.
      - name: make lint-sweeps
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # CUSTOMIZE: bridge when a sweep needs the module proxy
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-sweeps"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Benchmark harnesses (test/performance/*), examples and contrib adapters
      # are excluded; none ship in a release. Do not image-scan the
      # .devcontainer image here: its base-OS and toolchain CVEs are not
      # findings in this source tree.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action fetches aquasecurity/trivy from github.com with the
        # runner token, which only works on GitHub.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,contrib
          trivyignores: .trivyignore

      # Elsewhere, install the trivy CLI from the release tarball (anonymous
      # download).
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

      # Advisory: findings surface on each run without blocking anything.
      - name: Trivy misconfiguration scan (advisory)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test,examples,contrib --ignorefile .trivyignore .

  deps:
    name: Dependency freshness
    runs-on: ubuntu-latest
    # Gates no merge: it reports that a dependency published a release, which
    # is not a fact about any commit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same `make deps-check` a developer runs. It walks every go.mod in
      # the tree and exempts a lagging module only when its require line
      # carries a documented pin comment.
      - name: Every direct dependency on its current release
        run: make deps-check
