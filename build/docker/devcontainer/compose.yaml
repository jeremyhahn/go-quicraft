# Services: integration (make integration-test, hardened, network none) and toolchain (make docker-run, checkout bind-mounted); no caps, non-root, read-only root, fixed memlock/core/nofile ulimits.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 65536
      hard: 65536
  working_dir: /src

services:
  integration:
    <<: *posture
    image: ${GO_QUICRAFT_IT_IMAGE:-go-quicraft-it:local}
    pull_policy: never
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"

  toolchain:
    <<: *posture
    image: go-quicraft-toolchain:${GO_QUICRAFT_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${GO_QUICRAFT_UID:-10001}:${GO_QUICRAFT_GID:-10001}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - ../../..:/src
      - toolchain-gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      HOME: /tmp

volumes:
  gocache:
  toolchain-gocache:
