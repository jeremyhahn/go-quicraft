# Module credentials come from the gitignored .devcontainer/.env (format: .env.example); the build fails without it.
services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
      secrets:
        - gomodauth
    image: go-quicraft-dev:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ../:/app
    working_dir: /app
    network_mode: host
    cap_add:
      - NET_ADMIN

  integration:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      secrets:
        - gomodauth
    image: go-quicraft-integration:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ../:/app
    working_dir: /app
    network_mode: host
    cap_add:
      - NET_ADMIN
    command: ["make", "_integration-test"]

secrets:
  gomodauth:
    file: .env
