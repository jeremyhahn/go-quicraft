# docker-compose.integration.yml - containerised runner for the E2E suite.
#
# Usage:
#   docker compose -f .devcontainer/docker-compose.integration.yml up --build \
#       --abort-on-container-exit --exit-code-from test-runner
#
# There is a single service. The suite builds its own clusters:
# newTestCluster in test/integration/e2e starts N quicraft.Host instances over
# real QUIC with mTLS on loopback ports, so no cross-container topology is
# needed. The container provides the pinned toolchain and the tuned QUIC UDP
# buffers the entrypoint sets.
#
# The builder stage downloads modules with the gomodauth BuildKit secret, taken
# from the gitignored .devcontainer/.env (format: .env.example). The runner
# stage holds only the compiled binary, so it needs no credentials at run time.

services:

  test-runner:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.integration
      target: test-runner
      secrets:
        - gomodauth
    image: go-quicraft-integration-runner:latest
    hostname: test-runner
    cap_add:
      - NET_ADMIN
    # -test.v for verbose output; -test.timeout is a hard ceiling. Each test
    # starts a multi-node QUIC cluster and waits on election timeouts, so raise
    # this rather than trimming coverage if it is ever hit.
    command: ["-test.v", "-test.timeout=600s"]

secrets:
  gomodauth:
    file: .env
